/* A species can be drawn from six hand-made poses instead of from code. Anything
   with no sprite files keeps the code-drawn figure, so species drop in one at a
   time and a missing or broken file is never worse than the art we already had.

   Everything that responds to the world stays code: the bob, the firelight, the
   contact shadow, gear, indicators, the hollow treatment. None of it is baked in. */

const POSES = ["stand", "walk_a", "walk_b", "sit", "rest", "weary"];
const SPRITE_SPECIES = ["frog"];                  // add a key once its six files exist

/* Sprites are embedded in this file as data URIs, not fetched from assets/. That
   keeps the game one double-clickable file: a page opened over file:// cannot load
   its own assets/ folder in Safari, and even where it can, the images come back
   cross-origin and taint the canvas, which breaks the hollow treatment.

   assets/sprites/ is still the source of truth. SPRITE_DATA is generated from it by
   tools/embed_sprites.py, and anything not embedded falls back to the folder path so
   new art can be dropped in and tested from a served copy before being baked in. */
function spriteSrc(key, pose){
  const id = key + "_" + pose;
  return SPRITE_DATA[id] || "assets/sprites/" + id + ".png";
}

/* The shape tools/normalize_sprites.py guarantees: a square canvas, content bottom
   sitting on `baseline`, an upright figure `fig` tall. Mapping `fig` onto FIG.total
   is what puts a sprite's feet exactly where the code-drawn figure's feet land. */
const SPR_GEO = { size:256, baseline:236, fig:185 };

/* Sockets for the hollow treatment, in sprite-canvas coordinates of the sit pose.
   Fixed per species; replaced outright when real hollow sprites arrive. */
const SOCKETS = {
  frog: [{ x:96, y:91, rx:20, ry:27 }, { x:168, y:91, rx:20, ry:27 }]
};

const WALK_S = 0.25;                              // seconds per walk frame
const SPR = { art:{} };                           // species key -> pose -> derived treatments

function sprCanvas(draw){
  const n = SPR_GEO.size, c = document.createElement("canvas");
  c.width = c.height = n;
  draw(c.getContext("2d"), n);
  return c;
}

/* Derived treatments are built once per image, never per frame. Inside an offscreen
   canvas the sprite is the only content, so "source-atop" is a mask to its alpha. */
function derivePose(img){
  const lit = side => sprCanvas((g, n) => {       // a warm wash across the lit side
    g.drawImage(img, 0, 0, n, n);
    g.globalCompositeOperation = "source-atop";
    const grad = g.createLinearGradient(side > 0 ? n : 0, 0, side > 0 ? n * 0.35 : n * 0.65, 0);
    grad.addColorStop(0, C.fireBody); grad.addColorStop(1, "rgba(255,171,61,0)");
    g.fillStyle = grad; g.fillRect(0, 0, n, n);
  });
  /* The rim has to hug the silhouette, same as the code-drawn one: keep the sprite,
     erase a copy of itself shifted away from the fire, and what survives is the edge. */
  const rim = side => sprCanvas((g, n) => {
    const off = 7;                                // ~1.8px once the sprite is down at 48
    g.drawImage(img, 0, 0, n, n);
    g.globalCompositeOperation = "destination-out";
    g.drawImage(img, -side * off, 0, n, n);
    g.globalCompositeOperation = "source-in";
    g.fillStyle = C.fireCore; g.fillRect(0, 0, n, n);
  });
  return { base:img, lit:[lit(-1), lit(1)], rim:[rim(-1), rim(1)] };
}

/* No hollow sprites exist yet, so one is derived from the living sit pose: drained
   of colour, rebuilt out of C.hollow, then sockets where the eyes were. When real
   files arrive this becomes a manifest entry, not a rewrite. */
function deriveHollow(img, key){
  const c = sprCanvas((g, n) => {
    g.drawImage(img, 0, 0, n, n);
    let d = null;
    try { d = g.getImageData(0, 0, n, n); } catch (e){ d = null; }   // a tainted canvas: tint only
    if (d){
      /* Greyscale, then rebuilt out of C.hollow alone. Calibrating against the
         sprite's own brightest pixel puts its lightest surface exactly on the
         hollow colour, which is where the code-drawn hollow puts its body: the
         two treatments land on the same values without either being hand-tuned. */
      const px = d.data, tint = C.hollow;
      const tr = parseInt(tint.slice(1,3),16), tg = parseInt(tint.slice(3,5),16), tb = parseInt(tint.slice(5,7),16);
      let peak = 1;
      for (let i = 0; i < px.length; i += 4)
        if (px[i+3] > 128){
          const l = px[i]*0.30 + px[i+1]*0.59 + px[i+2]*0.11;
          if (l > peak) peak = l;
        }
      for (let i = 0; i < px.length; i += 4){
        if (!px[i+3]) continue;
        const t = (px[i]*0.30 + px[i+1]*0.59 + px[i+2]*0.11) / peak;
        px[i] = tr * t; px[i+1] = tg * t; px[i+2] = tb * t;
      }
      g.putImageData(d, 0, 0);
    } else {
      g.globalCompositeOperation = "source-atop";
      g.fillStyle = "rgba(69,75,72,0.72)"; g.fillRect(0, 0, n, n);
      g.globalCompositeOperation = "source-over";
    }
    g.fillStyle = C.socket;
    for (const e of (SOCKETS[key] || [])){
      g.beginPath(); g.ellipse(e.x, e.y, e.rx, e.ry, 0, 0, 6.2832); g.fill();
    }
  });
  return { base:c, lit:null, rim:null };
}

/* Preloaded on boot. The loading state is per species and all-or-nothing: a key
   only appears in SPR.art once all six of its poses have resolved, so nothing ever
   renders half-sprite, half-code, and there is no frame where a pose is missing.
   Until then, and for any species that fails to load, drawAnimal takes the code
   path. Boot is never blocked on it. */
function loadSprites(){
  for (const key of SPRITE_SPECIES){
    const img = {};
    let left = POSES.length, ok = true;
    const settle = () => {
      if (--left > 0 || !ok) return;
      const art = {};
      for (const p of POSES) art[p] = derivePose(img[p]);
      art.hollow = deriveHollow(img.sit, key);
      SPR.art[key] = art;
    };
    for (const pose of POSES){
      const src = spriteSrc(key, pose), im = new Image();
      im.onload  = () => { img[pose] = im; settle(); };
      im.onerror = () => {
        /* Falling back is correct, but doing it silently makes "why is my species
           still code art" undiagnosable. Say it once, and name the usual cause. */
        if (ok) console.warn("sprites: " + key + " stays on code art, could not load "
          + (src.slice(0, 5) === "data:" ? "embedded " + pose : src)
          + (src.slice(0, 5) !== "data:" && location.protocol === "file:"
             ? " — this page was opened over file://, which cannot reach assets/."
               + " Run tools/embed_sprites.py to bake it in, or serve the folder."
             : ""));
        ok = false; settle();
      };
      im.src = src;
    }
  }
}

/* One timer, one index swap. The id offset keeps two walkers off each other's beat. */
function poseOf(a, time){
  if (a.state === "hollow") return "hollow";
  if (a.state === "walkin" || a.state === "walkout")
    return (Math.floor((time + a.id * 0.11) / WALK_S) & 1) ? "walk_b" : "walk_a";
  const weary = a.deaths >= 2;
  if (a.state === "rest"){                        // seated: alert only while something waits on them
    const alert = !!(a.find || a.choice) || S.nudge === a.id;
    if (!alert) return "rest";
    return weary ? "weary" : "sit";
  }
  return weary ? "weary" : "stand";               // standing, idle, not at a seat
}

function artOf(a, time){
  const set = SPR.art[a.sp];
  return set ? set[poseOf(a, time)] : null;
}

/* Where the sprite canvas lands in world space. Build variation scales it the same
   way it scales the code figure, and the baseline stays pinned to the feet. */
function sprRect(x, y, b){
  const k = FIG.total / SPR_GEO.fig, sx = k * b.w, sy = k * b.h, n = SPR_GEO.size;
  return { dx: x - (n / 2) * sx, dy: y - SPR_GEO.baseline * sy, dw: n * sx, dh: n * sy };
}

function drawSpriteFigure(art, x, y, b, hollow){
  const r = sprRect(x, y, b);
  if (hollow){                                    // slumped, leaning toward the fire it lost
    ctx.save();
    ctx.translate(x, y); ctx.rotate((x > fx ? 1 : -1) * 0.06); ctx.translate(-x, -y);
    ctx.drawImage(art.base, r.dx, r.dy, r.dw, r.dh);
    ctx.restore();
    return;
  }
  ctx.drawImage(art.base, r.dx, r.dy, r.dw, r.dh);
}

/* The same proximity and flame terms the code-drawn rim uses, at the same strengths,
   so a sprite sitting beside a code figure is lit by the same fire. */
function spriteRim(art, x, y, b, cy){
  const f = firePull(x, cy);
  if (!f || !art.lit) return;
  const r = sprRect(x, y, b), i = f.side > 0 ? 1 : 0, k = f.near * f.life;
  ctx.globalAlpha = 0.04 + 0.14 * k;
  ctx.drawImage(art.lit[i], r.dx, r.dy, r.dw, r.dh);
  ctx.globalAlpha = 0.10 + 0.20 * k;
  ctx.drawImage(art.rim[i], r.dx, r.dy, r.dw, r.dh);
  ctx.globalAlpha = 1;
}

function drawAnimal(a, x, y, opts){
  const o = opts || {};
  const sp = spOf(a), b = BUILDS[a.build || 0];
  const hollow = a.state === "hollow";
  const garb = hollow ? mix(a.garb || sp.body, "#6a6a68", 0.78) : (a.garb || "#c03a2f");
  const body = hollow ? C.hollow : sp.body;
  const plate = hollow ? "#2a2830" : sp.plate;
  const dir = o.dir || 1;
  const drop = hollow ? 5 : 0;                      // head forward, body lower, legs bent
  const hw = FIG.head.w * b.w, hh = FIG.head.h * b.h;
  const bw = FIG.body.w * b.w, bh = FIG.body.h;
  const gear = a.gear || {};

  contact(x, y + 2, hw * 0.52, hollow ? 0.5 : 0.42);

  /* The anchors below are shared by both paths, so gear lands in the same place
     whether the figure underneath it is a sprite or a stack of shapes. */
  const bodyY = y - FIG.leg.h - bh / 2 + drop * 0.5;
  const hy = y - FIG.leg.h - bh - hh / 2 + drop;
  const art = artOf(a, o.time || 0);

  const armour = () => {                            // armour widens the shoulders
    if (!gear.armour) return;
    shape(()=>ctx.ellipse(x, bodyY - bh * 0.3, bw * 0.72, bh * 0.5, 0, 0, 6.2832),
          mix(garb, C.relief, 0.55), LW.outer);
  };
  const pack = () => {                              // a pack, a bedroll: travellers
    if (hollow) return;
    shape(()=>ctx.ellipse(x - dir * (bw * 0.52), bodyY, 5.5, bh * 0.55, dir * 0.2, 0, 6.2832),
          mix(garb, OUTLINE, 0.4), LW.outer);
  };

  if (art){
    pack();                                         // behind them, so it reads as carried
    drawSpriteFigure(art, x, y, b, hollow);
    armour();
    if (!hollow) spriteRim(art, x, y, b, hy);
    drawGear(x, y, dir, hw, bh, bodyY, gear);
    return;
  }

  const legY = y - FIG.leg.h / 2 + drop * 0.3;      // 12. legs first, behind the body
  for (const sx of [-1, 1])
    shape(()=>{ ctx.rect(x + sx * (FIG.leg.gap / 2) - (sx > 0 ? 0 : FIG.leg.w), legY - FIG.leg.h / 2,
                         FIG.leg.w, FIG.leg.h + (hollow ? -2 : 0)); }, mix(body, OUTLINE, 0.25), LW.outer);

  shape(()=>{ ctx.moveTo(x - bw / 2, bodyY - bh / 2); ctx.lineTo(x + bw / 2, bodyY - bh / 2);
    ctx.lineTo(x + bw / 2 + 1, bodyY + bh / 2); ctx.lineTo(x - bw / 2 - 1, bodyY + bh / 2);
    ctx.closePath(); }, garb, LW.outer);            // the garment is the body block
  armour();
  pack();

  if (sp.key === "cat"){
    ear(x - hw * 0.30, hy - hh * 0.42, 12 * b.w, 13, -0.12, body);
    ear(x + hw * 0.30, hy - hh * 0.42, 12 * b.w, 13, 0.12, body);
  } else if (sp.key === "rabbit"){
    ear(x - hw * 0.24, hy - hh * 0.44, 9 * b.w, 24, -0.14, body);
    ear(x + hw * 0.24, hy - hh * 0.44, 9 * b.w, 24, 0.14, body);
  } else if (sp.key === "goat"){
    for (const sx of [-1, 1])
      shape(()=>{ ctx.moveTo(x + sx * hw * 0.34, hy - hh * 0.40);
        ctx.quadraticCurveTo(x + sx * hw * 0.86, hy - hh * 0.86, x + sx * hw * 0.74, hy - hh * 0.12);
        ctx.quadraticCurveTo(x + sx * hw * 0.62, hy - hh * 0.62, x + sx * hw * 0.30, hy - hh * 0.28);
        ctx.closePath(); }, "#5c5346", LW.outer);
  }
  rrect(x, hy, hw, hh, 12, body, LW.outer);         // the head, generously cornered
  if (sp.key === "dog")
    for (const sx of [-1, 1])
      shape(()=>ctx.ellipse(x + sx * hw * 0.50, hy + hh * 0.10, 6.5 * b.w, 11, sx * 0.25, 0, 6.2832),
            mix(body, OUTLINE, 0.18), LW.outer);

  facePlate(x, hy + hh * 0.10, hw, hh, sp.key, plate);
  if (sp.key === "crow")                            // the beak sits below the eyes, not through them
    shape(()=>{ ctx.moveTo(x - 3.5, hy + hh * 0.30); ctx.lineTo(x + 3.5, hy + hh * 0.30);
      ctx.lineTo(x, hy + hh * 0.56); ctx.closePath(); }, "#c9a06a", LW.outer);
  drawEyes(x, hy + hh * (sp.key === "frog" ? 0.02 : 0.04), hw,
           hollow ? "hollow" : a.deaths >= 2 ? "weary" : "normal", plate);

  drawGear(x, y, dir, hw, bh, bodyY, gear);
  if (!hollow) rimLight(x, hy, hw, hh, 12);
}

/* In front of the figure on both paths, and identical on both. */
function drawGear(x, y, dir, hw, bh, bodyY, gear){
  if (gear.weapon){                                 // scavenged, and too big for them
    const g = gear.weapon, len = g.rarity === "rare" ? 34 : g.rarity === "fine" ? 28 : 22;
    ctx.save(); ctx.translate(x + dir * (hw * 0.46), y - FIG.leg.h - bh * 0.4); ctx.rotate(dir * 0.22);
    shape(()=>ctx.rect(-2.5, -len, 5, len), g.cursed ? C.cursed : C.relief, LW.outer);
    ctx.restore();
  }
  if (gear.trinket){
    const g = gear.trinket;
    const col = g.cursed ? C.cursed : g.rarity === "rare" ? C.rare : g.rarity === "fine" ? "#9a8f6a" : "#6f6a5c";
    const gl = ctx.createRadialGradient(x, bodyY, 0, x, bodyY, 10);
    gl.addColorStop(0, col); gl.addColorStop(1, "rgba(0,0,0,0)");
    ctx.globalAlpha = 0.9; ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(x, bodyY, 10, 0, 6.2832); ctx.fill(); ctx.globalAlpha = 1;
    circle(x, bodyY, 2.4, col, LW.detail);
  }
}

function drawAdventurer(a, time){
  if (S.nudge === a.id && a.state === "rest"){    // the only attention-directing thing in the game
    const pulse = 0.5 + 0.5 * Math.sin(time * 2.6);
    const g = ctx.createRadialGradient(a.x, a.y - 24, 6, a.x, a.y - 24, 46);
    g.addColorStop(0, "rgba(255,233,184," + (0.20 + 0.16 * pulse).toFixed(3) + ")");
    g.addColorStop(1, "rgba(255,233,184,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(a.x, a.y - 24, 46, 0, 6.2832); ctx.fill();
  }
  if (a.state === "hollow"){ drawAnimal(a, a.x, a.y, { seated:true, dir:1, time }); }
  else {
    const rest = a.state === "rest";
    const bob = rest ? Math.sin(time * 1.6 * (a.rate || 1)) * 1.2
                     : Math.sin(a.bob) * 2.2;        // 11. nothing synchronised
    drawAnimal(a, a.x, a.y + bob, { seated:rest, dir:a.dir || 1, time,
                                    wag:Math.sin(time * 1.1 * (a.rate || 1) + a.id) * 3 });
  }
  const sp = spOf(a), lift = sp.key === "rabbit" ? 16 : sp.key === "cat" || sp.key === "goat" ? 9 : 0;
  const top = a.y - (a.state === "rest" ? 52 : 58) - lift;
  /* The scene carries no text. Marks only, and only where a decision waits. */
  if (a.find || a.choice) circle(a.x - 16, top, 5.5, C.rare, LW.outer);
  if (a.shallow) circle(a.x + 16, top, 4.5, C.relief, LW.outer);
  if (a.state === "hollow"){                        // the only countdown in the game
    const left = 1 - Math.min(1, (a.hollowT || 0) / hollowWindow());
    const cy = a.y + 5, rx = 28, ry = 10;           // on the ground, never across the figure
    ctx.save();
    ctx.strokeStyle = "rgba(20,16,20,0.55)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(a.x, cy, rx, ry, 0, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = C.deadCore; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.globalAlpha = 0.95;
    ctx.beginPath(); ctx.ellipse(a.x, cy, rx, ry, 0, -1.5708, -1.5708 + left * 6.2832);
    ctx.stroke();
    ctx.restore();
  }
  drawPips(a.x, a.y + 16, a.deaths, hollowAt(a), a.state === "hollow");
}


function drawPips(x, y, deaths, cap, hollow){
  if (!revealed("pips")) return;
  const gap = 9, x0 = x - (cap - 1) * gap / 2;
  for (let i = 0; i < cap; i++)
    circle(x0 + i*gap, y, 3.4, i < deaths ? (hollow ? "#454b48" : "#f2682c") : "#2a2136", 2.5);
}

function drawBlacksmith(time, px, py){
  const x = px != null ? px : fx + RING_R * 0.86;
  const y = py != null ? py : fy + 26, swing = Math.sin(time*5.2);
  rrect(x + 34, y - 4, 26, 9, 4, "#2b3136", 4);
  shape(()=>{ ctx.moveTo(x+26, y-8); ctx.lineTo(x+42, y-8); ctx.lineTo(x+39, y-18);
              ctx.lineTo(x+29, y-18); ctx.closePath(); }, "#3d444a", 4);
  shape(()=>{ ctx.moveTo(x+22, y-18); ctx.lineTo(x+46, y-18); ctx.lineTo(x+46, y-26);
              ctx.lineTo(x+26, y-26); ctx.lineTo(x+16, y-22); ctx.closePath(); }, "#4d545a", 4);
  hooded(x, y, 30, 30, "#332f24", "#3a3529", 1, true);
  rrect(x + 1, y - 12, 20, 22, 6, "#2c2a21", 3);
  ctx.save(); ctx.translate(x + 16, y - 24); ctx.rotate(-0.35 + swing*0.6);
  rrect(0, -11, 7, 24, 3, "#332f24", 3);
  rrect(0, -22, 16, 11, 4, "#4d545a", 3);
  ctx.restore();
  if (swing > 0.95) sparks(x + 34, y - 26, 0.4);
}

function drawHerbalist(time, px, py){
  const x = px != null ? px : Math.max(fx - RING_R * 0.86, 48);
  const y = py != null ? py : fy + 8, grind = Math.sin(time*3.1);
  rrect(x - 25, y - 2, 22, 9, 4, "#2b3136", 4);              // bench, tucked outside the ring
  shape(()=>{ ctx.moveTo(x-33, y-8); ctx.lineTo(x-17, y-8); ctx.lineTo(x-20, y-18);
              ctx.lineTo(x-30, y-18); ctx.closePath(); }, "#35402c", 4);      // mortar
  ctx.save(); ctx.translate(x - 25, y - 18); ctx.rotate(-0.4 + grind*0.25);
  rrect(0, -7, 5, 17, 3, "#3a4448", 3); ctx.restore();       // pestle
  hooded(x, y, 26, 26, "#35402c", "#232c20", -1, true);
  rrect(x - 1, y - 10, 17, 19, 6, "#232c20", 3);             // apron
  circle(x + 10, y - 27, 5.5, "#4c5a38", 3);                 // sprig at the hood
  if (grind > 0.97) S.sparks.push({ x:x-25, y:y-22, vx:(Math.random()-0.5)*20, vy:-18, t:0, life:0.5 });
}

/* The road, as a bar under the status line: how many are in each place,
   and a marker per adventurer sinking as they go. */
function drawStrip(time){
  if (!revealed("road")) return;
  const g = stripGeom(), list = away(), n = LOC.length, band = g.w / n;
  const base = g.y + g.h - 5;
  rrect(g.x + g.w / 2, g.y + g.h / 2, g.w + 10, g.h + 8, 11, "rgba(15,21,18,0.82)", 0);
  ctx.save();
  ctx.strokeStyle = "rgba(78,88,82,0.5)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.rect(g.x - 4, g.y - 3, g.w + 8, g.h + 6); ctx.stroke();
  for (let i = 0; i < n; i++){
    const x = g.x + band * (i + 0.5), open = i <= S.unlocked;
    const inside = list.filter(a => locOf(a.depth) === i).length;
    if (i){                                              // a notch between one place and the next
      ctx.strokeStyle = "rgba(78,88,82,0.35)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(g.x + band * i, g.y + 3); ctx.lineTo(g.x + band * i, g.y + g.h - 3);
      ctx.stroke();
    }
    ctx.lineCap = "round"; ctx.lineWidth = open ? 3 : 2;
    ctx.strokeStyle = open ? (inside ? LOC[i].tint : "rgba(120,132,124,0.55)") : "rgba(70,78,74,0.35)";
    ctx.beginPath(); ctx.moveTo(x - band * 0.34, base); ctx.lineTo(x + band * 0.34, base); ctx.stroke();
  }
  ctx.restore();
  list.forEach((a, i) => {
    const p = markerPos(a, i);
    circle(p.x, p.y, 5, a.garb || spOf(a).body, 2);
    if (a.flash){
      const al = a.flash.t < 0.2 ? a.flash.t / 0.2 : Math.min(1, (2 - a.flash.t) / 0.6);
      ctx.save(); ctx.globalAlpha = al * 0.9;
      ctx.strokeStyle = C.fireCore; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, 6.2832); ctx.stroke(); ctx.restore();
    }
  });
}

const K = { x:0, y:0, tx:0, ty:0, mode:"idle", t:0, dir:1, placed:false };

function keeperGoTo(x, y, mode){ K.tx = x; K.ty = y; K.mode = mode || "attend"; K.t = 0; }
function keeperIdle(){ keeperGoTo(fx - 62, fy + 30, "idle"); }

/* Vendors are built in the same language: a head, a body block, two pegs.
   Hooded, because none of them are animals the player recruits. */
function hooded(x, y, h, w, cloak, hood, dir, eyes){
  contact(x, y + 2, w * 0.5, 0.42);
  for (const sx of [-1, 1])
    shape(()=>ctx.rect(x + sx * 3 - (sx > 0 ? 0 : 6), y - 8, 6, 8), mix(hood, OUTLINE, 0.3), LW.outer);
  shape(()=>{ ctx.moveTo(x - w * 0.42, y - 20); ctx.lineTo(x + w * 0.42, y - 20);
              ctx.lineTo(x + w * 0.46, y - 8); ctx.lineTo(x - w * 0.46, y - 8);
              ctx.closePath(); }, cloak, LW.outer);
  rrect(x, y - 20 - h * 0.42, w * 1.05, h * 0.84, 11, hood, LW.outer);
  shape(()=>ctx.ellipse(x + dir * w * 0.10, y - 20 - h * 0.40, w * 0.30, h * 0.28, 0, 0, 6.2832),
        mix(hood, OUTLINE, 0.5), LW.outer);
  if (eyes) drawEyes(x + dir * w * 0.10, y - 20 - h * 0.40, w * 0.8, "normal");
  rimLight(x, y - 20 - h * 0.42, w * 1.05, h * 0.84, 11);
}

function updateKeeper(dt){
  if (!K.placed){ K.x = fx - 62; K.y = fy + 30; K.tx = K.x; K.ty = K.y; K.placed = true; }
  if (S.sel != null){                        // stands with whoever you are counselling
    const who = S.pool.find(o => o.id === S.sel);
    if (who && who.state !== "away") keeperGoTo(who.x + (who.x > fx ? -34 : 34), who.y + 6, "attend");
  } else if (K.mode !== "idle" && (K.t += dt) > 6) keeperIdle();
  const dx = K.tx - K.x, dy = K.ty - K.y, d = Math.hypot(dx, dy);
  if (d > 2){ const sp = Math.min(d, 54 * dt); K.x += dx/d * sp; K.y += dy/d * sp; K.dir = dx >= 0 ? 1 : -1; }
}

/* The keeper is built the same way as everyone else — head, block, two pegs — and
   set apart by scale and colour instead: taller, darker, and nothing under the hood. */
function drawKeeper(time){
  const walking = Math.hypot(K.tx - K.x, K.ty - K.y) > 2;
  const sway = walking ? Math.sin(time * 9) * 1.6 : Math.sin(time * 1.4) * 0.8;
  const y = K.y + sway, hw = 36, hh = 34, bw = 24, bh = 14;
  contact(K.x, K.y + 3, 20, 0.5);
  for (const sx of [-1, 1])                                            // pegs, same as theirs
    shape(()=>ctx.rect(K.x + sx * 3 - (sx > 0 ? 0 : 9), y - 8, 9, 8), "#151a1c", LW.outer);
  const bodyY = y - 8 - bh / 2;
  shape(()=>{ ctx.moveTo(K.x - bw / 2, bodyY - bh / 2); ctx.lineTo(K.x + bw / 2, bodyY - bh / 2);
              ctx.lineTo(K.x + bw / 2 + 2, bodyY + bh / 2); ctx.lineTo(K.x - bw / 2 - 2, bodyY + bh / 2);
              ctx.closePath(); }, "#1e2427", LW.outer);
  rrect(K.x, bodyY - bh * 0.34, bw * 0.6, 5, 2.5, C.keeper, LW.outer); // the one warm colour
  const hy = y - 8 - bh - hh / 2;
  rrect(K.x, hy, hw, hh, 14, "#171d1f", LW.outer);                     // the hood, worn as a head
  shape(()=>ctx.ellipse(K.x + K.dir * 4, hy + hh * 0.10, hw * 0.30, hh * 0.30, 0, 0, 6.2832),
        "#0d1113", LW.outer);                                          // nothing inside it
  rimLight(K.x, hy, hw, hh, 14);
  const tend = K.mode === "tend" && !walking;                          // leans in to feed the fire
  ctx.save();
  ctx.translate(K.x + K.dir * 17, bodyY - 2);
  ctx.rotate(K.dir * (tend ? 0.5 + Math.sin(time * 2.2) * 0.22 : 0.15 + Math.sin(time * 0.9) * 0.06));
  rrect(0, 0, 6, 34, 3, "#332f24", LW.outer);
  circle(0, -19, 4.5, C.keeper, LW.outer);
  ctx.restore();
}

function relicPos(i){ return { x: fx + 92 + i * 30, y: fy + 76 }; }
function relicBounds(){ return { x0: fx + 74, x1: fx + 172, y: fy + 76 }; }

function drawReliquary(time){
  if (!S.relic.length && !S.seen.relic) return;
  const x0 = fx + 78, y = fy + 76;
  rrect(x0 + 46, y + 12, 108, 7, 3, "#2b3136", 3);            // the shelf, and no label on it
  S.relic.forEach((r, i) => {
    const p = relicPos(i), g = r.art;
    const mat = { common:"#4d545a", fine:"#c9a227", rare:"#4c5a38" }[g.rarity];
    const bob = Math.sin(time * 1.6 + i) * 1;
    if (g.slot === "weapon") rrect(p.x, p.y + bob, 7, 26, 3, mat, 2.5);
    else if (g.slot === "armour")
      shape(()=>{ ctx.moveTo(p.x-9, p.y-12+bob); ctx.lineTo(p.x+9, p.y-12+bob);
                  ctx.lineTo(p.x, p.y+12+bob); ctx.closePath(); }, mat, 2.5);
    else circle(p.x, p.y + bob, 9, mat, 2.5);
    if (g.cursed) circle(p.x, p.y - 17 + bob, 3, C.cursed, 2);   // a mark, not a word
  });
  ctx.textAlign = "center";
}

function drawPlots(time){
  const n = plotCount();
  for (let i = 0; i < n; i++){
    const p = plotPos(i), key = S.plots[i], lit = inLight(i);
    if (!key){                                        // a footprint someone else laid
      if (!revealed("build")) continue;
      ctx.setLineDash([4, 6]);
      shape(()=>ctx.ellipse(p.x, p.y, 22, 11, 0, 0, 6.2832), "rgba(23,27,30,0.45)", 2);
      ctx.setLineDash([]);
      continue;
    }
    const v = VMAP[key];
    shape(()=>ctx.ellipse(p.x, p.y + 8, 24, 9, 0, 0, 6.2832), "rgba(0,0,0,0.3)", 0.001);
    if (key === "smith") drawBlacksmith(time, p.x, p.y);
    else if (key === "herb") drawHerbalist(time, p.x, p.y);
    else {
      hooded(p.x, p.y, 26, 26, v.tint, mix(v.tint, "#0a0e0b", 0.45), p.x > fx ? -1 : 1, true);
      rrect(p.x, p.y - 10, 17, 19, 6, mix(v.tint, "#0a0e0b", 0.25), 3);
      rrect(p.x, p.y - 46, 20, 9, 4, v.tint, LW.outer);   // their colour on a board, not their name
    }
    /* Inner and outer read from where the light falls. Adjacency is in the Build tab. */
  }
}

function drawEmbers(){
  if (!revealed("embers")) return;
  const n = T.MAX_EMBERS, gap = 15, x0 = fx - (n-1)*gap/2, y = emberY();
  for (let i = 0; i < n; i++)
    circle(x0 + i*gap, y, 4.5, i < Math.floor(S.embers) ? "#ffab3d" : "#232c20", 3);
  /* No text on the scene. The pips are the whole instruction. */
}

/* The keeper's lines are sentences, and a phone is 390 wide. */
function wrapText(txt, max){
  if (ctx.measureText(txt).width <= max) return [txt];
  const words = String(txt).split(" "), out = [];
  let line = "";
  for (const w of words){
    const next = line ? line + " " + w : w;
    if (ctx.measureText(next).width > max && line){ out.push(line); line = w; }
    else line = next;
  }
  if (line) out.push(line);
  return out;
}

function drawFx(dt){
  for (let i = S.sparks.length - 1; i >= 0; i--){
    const p = S.sparks[i]; p.t += dt;
    if (p.t > p.life){ S.sparks.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 14*dt;
    ctx.globalAlpha = 1 - p.t/p.life; ctx.fillStyle = p.col || "#ffe9b8";
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.6, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = "center";
  for (let i = S.says.length - 1; i >= 0; i--){
    const q = S.says[i]; q.t += dt;
    if (q.t > 4.2){ S.says.splice(i, 1); continue; }
    const who = S.pool.find(o => o.id === q.id);
    if (who && who.state !== "away"){ q.x = who.x; q.y = sayY(who); }
    ctx.globalAlpha = q.t < 0.5 ? q.t/0.5 : Math.min(1, (4.2 - q.t)/1.1);
    ctx.font = "600 11px ui-rounded, system-ui, sans-serif";
    const w = ctx.measureText(q.txt).width + 16;
    const lim = Math.max(20, worldHalfW() - w/2 - 6);
    const bx = Math.max(fx - lim, Math.min(fx + lim, q.x));     // never off the edge
    rrect(bx, q.y, w, 20, 9, "rgba(20,15,28,0.9)", 2);
    ctx.fillStyle = "#a9a3b5"; ctx.fillText(q.txt, bx, q.y + 4);
    ctx.globalAlpha = 1;
  }
  for (let i = S.floats.length - 1; i >= 0; i--){
    const f = S.floats[i]; f.t += dt;
    if (f.t > 1.2){ S.floats.splice(i,1); continue; }
    ctx.globalAlpha = 1 - f.t/1.2;
    ctx.font = "800 16px ui-rounded, system-ui, sans-serif";
    ctx.lineWidth = 4; ctx.strokeStyle = "#0a0e0b";
    ctx.strokeText(f.txt, f.x, f.y - f.t*38);
    ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, f.y - f.t*38);
    ctx.globalAlpha = 1;
  }
}

/* 12. A little grain over the whole thing, to unify the flats. */
let grainTile = null, grainT = 0, grainOff = 0;
function drawGrain(){
  if (!grainTile){
    grainTile = document.createElement("canvas"); grainTile.width = grainTile.height = 72;
    const g = grainTile.getContext("2d"), img = g.createImageData(72, 72);
    for (let i = 0; i < img.data.length; i += 4){
      const v = (Math.random() * 255) | 0;
      img.data[i] = img.data[i+1] = img.data[i+2] = v;
      img.data[i+3] = Math.random() < 0.5 ? 16 : 0;
    }
    g.putImageData(img, 0, 0);
  }
  grainT += 1;
  if (grainT > 24){ grainT = 0; grainOff = (grainOff + 17) % 72; }
  const pat = ctx.createPattern(grainTile, "repeat");
  ctx.save(); ctx.globalAlpha = 0.5; ctx.translate(-grainOff, grainOff * 0.5);
  ctx.fillStyle = pat; ctx.fillRect(0, 0, W + 72, H + 72); ctx.restore();
}

/* ============================ loop ============================ */

let flare = 0, sparkT = 0, uiT = 0, last = performance.now();
S.elapsed = 0;

function frame(now){
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.25) dt = 0.25;
  S.elapsed += dt;
  const time = now / 1000;

  S.arriveT += dt;
  const iv = interval();
  let guard = 0;
  while (S.arriveT >= iv && guard++ < 20){
    S.arriveT -= iv;
    if (revealed("arrivals") && living().length < poolCap()) recruit();
  }

  S.emberT += dt;
  while (S.emberT >= T.EMBER_REGEN){ S.emberT -= T.EMBER_REGEN; S.embers = Math.min(T.MAX_EMBERS, S.embers + 1); }

  RING_R = Math.min(168, Math.max(FIRE_TAP_R + 30, lightR() * 1.18));
  tickOpening(dt);
  if (S.flameOn && !S.ending) tickFlame(dt);
  updatePool(dt);
  updateKeeper(dt);
  tickCraft(dt);
  while (S.earnLog.length && S.earnLog[0].t < S.elapsed - 60) S.earnLog.shift();
  flare = Math.max(0, flare - dt * 1.6);
  sparkT += dt;
  if (sparkT > 0.16){ sparkT = 0;
    if (Math.random() < 0.12 + 0.88 * flameLife()) sparks(fx + (Math.random()-0.5)*14, fy - 18, 0.8); }

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = C.void; ctx.fillRect(0, 0, W, H);   // the dark, before any transform
  const cam = camera(dt);
  ctx.save();
  ctx.translate(W / 2, cam.oy); ctx.scale(cam.z, cam.z); ctx.translate(-fx, -cam.cy);
  drawGround(time);
  drawColumns(time);
  const onStage = S.pool.filter(a => a.state !== "away");
  onStage.sort((a,b) => a.y - b.y);
  const behind = onStage.filter(a => a.y <= fy), front = onStage.filter(a => a.y > fy);
  behind.forEach(a => drawAdventurer(a, time));
  drawPlots(time);
  if (K.y <= fy) drawKeeper(time);
  drawFire(time);
  front.forEach(a => drawAdventurer(a, time));
  if (K.y > fy) drawKeeper(time);
  drawEmbers();
  drawReliquary(time);
  drawFx(dt);
  ctx.restore();
  drawStrip(time);                                // the road bar is chrome, not scenery

  if (S.notice){
    S.notice.t += dt;
    if (S.notice.t > 4.5) S.notice = null;
    else {
      const n = S.notice;
      ctx.globalAlpha = n.t < 0.3 ? n.t / 0.3 : Math.min(1, (4.5 - n.t) / 1.2);
      ctx.font = "800 14px ui-rounded, system-ui, sans-serif"; ctx.textAlign = "center";
      ctx.lineWidth = 5; ctx.strokeStyle = "#0a0e0b"; ctx.fillStyle = "#a9a3b5";
      let ny = (revealed("road") ? stripGeom().y + stripGeom().h : 8) + 26;
      for (const ln of wrapText(n.txt, W - 30)){       // a line, never a line running off the edge
        ctx.strokeText(ln, W / 2, ny); ctx.fillText(ln, W / 2, ny); ny += 18;
      }
      ctx.globalAlpha = 1;
    }
  }

  if (open_ && !open_.dusted && (open_.clean === "thaw" || open_.clean === "creep")){
    open_.regrow = (open_.regrow || 0) + dt;
    if (open_.regrow > (open_.clean === "thaw" ? 1.1 : 1.7)){
      open_.regrow = 0;
      const a = open_, edge = a.clean === "creep";
      for (let k = 0; k < 6; k++){
        const gx = (Math.random() * GRID) | 0, gy = (Math.random() * GRID) | 0;
        const isEdge = gx < 3 || gy < 3 || gx > GRID - 4 || gy > GRID - 4;
        if (edge && !isEdge) continue;
        if (a.grid[gy * GRID + gx]){ a.grid[gy * GRID + gx] = 0; a.cleared--; }
      }
      if (a.grimeCv){
        const g2 = a.grimeCv.getContext("2d");
        g2.globalCompositeOperation = "source-over";
        g2.fillStyle = a.clean === "thaw" ? "rgba(150,190,210,0.30)" : "rgba(74,63,82,0.28)";
        if (a.clean === "creep"){
          g2.fillRect(0, 0, AW, 22); g2.fillRect(0, AH - 22, AW, 22);
          g2.fillRect(0, 0, 22, AH); g2.fillRect(AW - 22, 0, 22, AH);
        } else g2.fillRect(0, 0, AW, AH);
      }
      const frac = a.cleared / (GRID * GRID);
      artToFire.disabled = frac < 0.62;
      drawArt();
    }
  }

  drawGrain();
  drawGesture(dt);

  uiT += dt;
  if (uiT > 0.15){ uiT = 0; refresh(); if (S.sel != null) showCounsel(byId(S.sel)); }
  requestAnimationFrame(frame);
}

/* ============================ input ============================ */

const byId = id => S.pool.find(a => a.id === id);

cv.addEventListener("pointerdown", e => {
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;

  const sg = stripGeom();                       // the whole bar opens the road
  if (revealed("road") && y < sg.y + sg.h + 8){ openMap(); return; }

  const w = toWorld(x, y), wx = w.x, wy = w.y;  // everything below is world space

  const rb = relicBounds();                     // the shelf opens when tapped
  if (S.relic.length && Math.abs(wy - rb.y) < 26 && wx > rb.x0 - 14 && wx < rb.x1){ openShelf(); return; }

  /* A figure owns a tight circle of their own; the fire owns the rest of its ground.
     Nobody may sit inside the fire's clear radius, so the fire is always tappable. */
  let hit = null, best = 28;
  for (const a of S.pool){
    if (a.state !== "rest" && a.state !== "hollow") continue;
    const d = Math.hypot(wx - a.x, wy - (a.y - 16));
    if (d < best){ best = d; hit = a; }
  }
  if (hit){ S.sel = hit.id; S.nudge = null; showCounsel(hit);
            keeperGoTo(hit.x + (hit.x > fx ? -34 : 34), hit.y + 6, "attend"); return; }
  const dx = (wx - fx) / 52, dy = (wy - (fy - 6)) / 48;
  if (dx*dx + dy*dy > 1){ closeCounsel(); return; }
  S.taps++;
  if (S.embers < 1){ S.floats.push({ x:fx, y:fy - 46, t:0, txt:"no embers", col:"#7d8a85" }); return; }
  keeperGoTo(fx - 52, fy + 26, "tend");
  S.embers--; flare = 0.5;
  for (let k = 0; k < 5; k++) sparks(fx + (Math.random()-0.5)*16, fy - 22, 0.6);
  if (S.first && S.beat < 3){                     // the one time in the game it goes up
    S.flame = Math.min(S.flameMax, S.flame + TAP_INTENSITY);
    S.floats.push({ x:fx + (Math.random()-0.5)*20, y:fy - 46, t:0, txt:"+1.5", col:"#ffab3d" });
    beatTo(1);
    if (S.taps >= 3) S.rev.embers = true;
    if (S.flame >= 40) beatTo(2);
    if (S.flame >= 60) beatTo(3);
    return;
  }
  earn(1, fx + (Math.random()-0.5)*20, fy - 46, false);
});

/* ============================ counsel card ============================ */

const counsel = document.getElementById("counsel");
const cTone = counsel.querySelector(".cTone"), cTitle = counsel.querySelector(".cTitle");
const cSub = counsel.querySelector(".cSub"), cOdds = counsel.querySelector(".cOdds");
const cAct = counsel.querySelector(".cAct"), cNote = counsel.querySelector(".cNote");
counsel.querySelector(".cClose").addEventListener("click", closeCounsel);

function closeCounsel(){
  S.sel = null; picking = null; counsel.hidden = true;
  const old = counsel.querySelector(".cActs"); if (old) old.remove();
}
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");

function showCounsel(a){
  if (!a){ closeCounsel(); return; }
  S.sel = a.id; counsel.hidden = false;
  const hollow = a.state === "hollow";
  cTone.style.background = hollow ? C.hollow : (a.garb || spOf(a).body);
  cTitle.textContent = (a.name ? a.name + ", " : "") + (hollow ? "hollowed" : "a " + spOf(a).name);
  cSub.textContent = hollow ? "Nothing left to spend" : spOf(a).note;
  const stale = counsel.querySelector(".cActs"); if (stale) stale.remove();
  cGear.hidden = hollow;
  if (hollow) cGear.innerHTML = "";
  else if (a.choice) renderChoice(a);
  else if (a.find) renderFind(a);
  else renderGear(a);

  if (hollow){
    const c = rekCost(a), free = vlv("ossu") >= 3 && !S.freeRiteUsed;
    cOdds.innerHTML = (a.name ? "<b>" + a.name + "</b>. " : "") + "Got as far as depth "
      + peakOf(a) + ". " + plural(a.deaths, "death") + ".<br>"
      + "Carrying " + gearSummary(a) + ".<br>"
      + "<b>" + Math.max(0, Math.ceil(hollowWindow() - (a.hollowT || 0))) + "s</b> before they stand up "
      + "and walk out on their own.";
    cGear.hidden = false; cGear.className = "cPick"; cGear.innerHTML = "";
    const rite = document.createElement("button");
    rite.innerHTML = "<b>Rite of Rekindling — " + (free ? "free" : fmt(c)) + "</b><br><em>"
      + "They come back at depth 0 with their deaths forgiven, and they keep what they carry."
      + "</em>";
    rite.disabled = !free && S.souls < c;
    rite.onclick = () => { if (rekindle(a)) closeCounsel(); };
    cGear.appendChild(rite);
    const go = document.createElement("button");
    go.innerHTML = "<b>Let Them Go — " + fmt(letGoCost()) + "</b><br><em>"
      + "The seat comes back. Their things go on the shelf. They are written down and that is "
      + "all that is left of them. <span>+" + letGoAsh(a) + " ash</span></em>";
    go.disabled = S.souls < letGoCost();
    go.onclick = () => { if (vlv("ossu")) startGesture("vigil", () => { letThemGo(a); closeCounsel(); });
                         else { letThemGo(a); closeCounsel(); } };
    cGear.appendChild(go);
    cAct.style.display = "none";
    cNote.textContent = "One of them costs souls you may not have. The other costs less than that.";
  } else {
    cAct.style.display = "";
    const d = runDepth(a), odds = Math.round(survival(d, a.deaths, a) * 100);
    const mult = (1 + d * T.DEPTH_PAY).toFixed(1).replace(/\.0$/, "");
    const left = hollowAt(a) - a.deaths;
    cOdds.innerHTML =
      (a.name ? "<b>" + a.name + "</b>. " : "") + LOC[locOf(d)].name + ", depth " + d +
      ". Pays <b>" + mult + "x</b>, or " + plural(payFor(a), "soul") + ".<br>" +
      "Deaths " + a.deaths + " of " + hollowAt(a) + ". " +
      (left === 1 ? "One more and they hollow." : left === 2 ? "Two more and they hollow." : "Unscarred.") + "<br>" +
      "Survival <b>" + odds + "%</b>.";
    cAct.textContent = a.shallow ? "Sent shallow" : "Send shallow";
    cAct.className = "cAct";
    cAct.disabled = a.shallow || a.depth === 0;
    cAct.onclick = () => { a.shallow = true; showCounsel(a); };
    cNote.textContent = a.depth === 0 ? "Nowhere shallower to send them."
      : a.shallow ? "They come home no deeper than they left."
      : "One layer short: safer odds, a smaller purse, no new depth.";
  }
}

const cGear = counsel.querySelector(".cGear");
let picking = null;

function renderFind(a){
  cGear.className = "cPick"; cGear.innerHTML = "";
  const b = document.createElement("button");
  b.innerHTML = "<b>They brought something up</b><br><span>It is filthy. Clean it and see.</span>";
  b.onclick = () => openArtifact(a.find);
  cGear.appendChild(b);
}

function renderChoice(a){
  cGear.className = "cPick"; cGear.innerHTML = "";
  const g = a.choice, worn = gearIn(a, g.slot);
  const row = (title, art, keep) => {
    const b = document.createElement("button");
    b.innerHTML = "<b>" + title + ": " + artTitle(art) + (art.cursed ? " ✦" : "") +
      "</b><br><span>" + effectLine(art) + "</span><br><em>" + art.line + "</em>";
    b.onclick = () => {
      if (!keep){ a.gear[g.slot] = g; }        // the other one goes in the fire either way
      a.choice = null;
      S.notice = { txt:"The other one went in the fire.", t:0 };
      showCounsel(a);
    };
    cGear.appendChild(b); return b;
  };
  const head = document.createElement("button");
  head.disabled = true;
  head.innerHTML = "<b>Only one of these can be kept.</b><br><span>The other is destroyed.</span>";
  cGear.appendChild(head);
  row("Keep", worn, true);
  row("Take", g, false);
}

function craftOffers(g){
  const out = [];
  if (vlv("smith") >= 2 && g.rarity === "common") out.push(["forge", "fine", T.FORGE_COST.fine]);
  if (vlv("smith") >= 3 && g.rarity === "fine")   out.push(["forge", "rare", T.FORGE_COST.rare]);
  if (g.cursed && vlv("herb") >= 3) out.push(["cleanse", "clean", T.CLEANSE_COST.clean]);
  else if (g.cursed && vlv("herb") >= 2 && g.rarity !== "common") out.push(["cleanse", "rough", T.CLEANSE_COST.rough]);
  return out;
}

function startCraft(a, slot, kind, grade, cost){
  const g = gearIn(a, slot);
  if (!g || g.craft) return;
  let scrap = cost[1];
  if (kind === "forge" && slot === "weapon" && adjActive("smith", "quart")) scrap = Math.ceil(scrap * 0.65);
  if (S.souls < cost[0] || S.mat < scrap) return;
  S.souls -= cost[0]; S.mat -= scrap;
  const key = kind === "forge" ? "smith" : "herb";
  startGesture(VMAP[key].verb, q => {
    g.craft = { kind, grade, left: T.CRAFT_SECONDS * vSlow(key) * (q >= 0.7 ? 0.6 : 1) };
    if (q >= 0.7) S.floats.push({ x:fx, y:fy - 40, t:0, txt:"good work", col:"#ffe9b8" });
    showCounsel(a);
  });
  const pi = plotOf(kind === "forge" ? "smith" : "herb");
  if (pi >= 0){ const pp = plotPos(pi); keeperGoTo(pp.x, pp.y, "attend"); }
}

function tickCraft(dt){
  for (const a of S.pool){
    if (!a.gear) continue;
    for (const slot of A_SLOTS){
      const g = a.gear[slot];
      if (!g || !g.craft) continue;
      if ((g.craft.left -= dt) > 0) continue;
      const c = g.craft; g.craft = null;
      if (c.kind === "forge"){ g.rarity = c.grade; S.notice = { txt:"Reforged. " + artTitle(g) + ".", t:0 }; }
      else {
        g.cursed = false; g.curseLine = null;
        if (c.grade === "rough" && g.rarity !== "common")
          g.rarity = g.rarity === "rare" ? "fine" : "common";
        S.notice = { txt:"The mark is off it. " + artTitle(g) + ".", t:0 };
      }
      if (S.sel === a.id) showCounsel(a);
    }
  }
}

function gearButton(a, slot){
  const g = gearIn(a, slot), b = document.createElement("button");
  b.className = g ? (g.cursed ? "filled cursed" : "filled") : "";
  b.innerHTML = "<i>" + SLOT_NAME[slot].toUpperCase() + "</i>" +
    (g ? (g.craft ? Math.ceil(g.craft.left) + "s" : RARITY_NAME[g.rarity] + (g.cursed ? " ✦" : "")) : "empty");
  b.onclick = () => { picking = slot; showCounsel(a); };
  return b;
}

function vendorActions(a){
  const out = [];
  if (vlv("carto") >= 1) out.push({
    label:"Send them somewhere else",
    sub: a.route != null ? "Bound for " + LOC[a.route].name + "." : "They go as deep as they can.",
    go: () => openRoute(a) });
  if (vlv("quart") >= 1 && !a.packed) out.push({
    label:"Pack them off", sub:"Supplies for the road. Shorter trip.",
    go: () => startGesture("pack", q => { a.packed = true; a.packQ = q; showCounsel(a); }) });
  if (vlv("tink") >= 1) out.push({
    label:"Break something down", sub:"Whatever they carry, into scrap.",
    go: () => openBreak(a) });
  return out;
}

function openRoute(a){
  const rows = LOC.slice(0, S.unlocked + 1).map((L, i) => ({
    html:"<b>" + L.name + "</b><br><em>Depths " + locFloor(i) + " and " + (locFloor(i)+1) +
         (i === locOf(a.depth) ? ". Where they would go anyway." : ". Shallower than they have been.") +
         "</em>" + (S.marked === i ? "<br><span>Marked. Better things come up.</span>" : ""),
    onClick: () => startGesture("route", () => { a.route = i; closeSheet(); showCounsel(a); })
  }));
  rows.push({ html:"Let them go as deep as they can", onClick: () => { a.route = null; closeSheet(); showCounsel(a); } });
  openSheet("Where to?", (a.name || "They") + " will be told the way.", rows);
}

function openBreak(a){
  const rows = A_SLOTS.filter(k => gearIn(a, k)).map(k => {
    const g = gearIn(a, k);
    return { html:"<b>" + artTitle(g) + "</b><br><em>" + effectLine(g) + "</em>",
      onClick: () => startGesture("break", q => {
        let n = MAT_VALUE[g.rarity] * 2 + Math.round(q * 3);
        if (adjActive("smith", "tink")) n = Math.round(n * 1.5);
        S.mat += n; S.seen.material = true; a.gear[k] = null;
        S.notice = { txt:"Broken down. " + n + " scrap.", t:0 };
        closeSheet(); showCounsel(a);
      }) };
  });
  if (!rows.length) rows.push({ html:"They are carrying nothing to break.", onClick:null });
  openSheet("Break it down", "The Tinker takes anything.", rows);
}

function renderGear(a){
  cGear.innerHTML = "";
  if (!picking){
    cGear.className = "cGear";
    A_SLOTS.forEach(slot => cGear.appendChild(gearButton(a, slot)));
    const acts = vendorActions(a);
    if (acts.length){
      const bar = document.createElement("div"); bar.className = "cActs";
      for (const act of acts){
        const b = document.createElement("button");
        b.innerHTML = act.label + "<i>" + act.sub + "</i>";
        b.onclick = act.go; bar.appendChild(b);
      }
      cGear.parentNode.insertBefore(bar, cGear.nextSibling);
      if (cGear.nextSibling && cGear.nextSibling.nextSibling &&
          cGear.nextSibling.nextSibling.className === "cActs")
        cGear.nextSibling.nextSibling.remove();
    }
    return;
  }
  cGear.className = "cPick";
  const slot = picking, worn = gearIn(a, slot);
  const add = (html, fn, dis) => {
    const b = document.createElement("button");
    b.innerHTML = html; b.disabled = !!dis; if (fn) b.onclick = fn;
    cGear.appendChild(b); return b;
  };
  if (worn){
    add("<b>" + artTitle(worn) + (worn.cursed ? " ✦" : "") +
        (worn.origin != null ? " — " + LOC[worn.origin].name : "") + "</b><br><span>" + effectLine(worn) +
        "</span><br><em>" + worn.line + (worn.curseLine ? " " + worn.curseLine : "") + "</em>", null, true);
    if (worn.craft) add("At the " + (worn.craft.kind === "forge" ? "forge" : "herbalist") + ", " +
                        Math.ceil(worn.craft.left) + "s", null, true);
    else for (const [kind, grade, cost] of craftOffers(worn)){
      const label = kind === "forge" ? "Reforge to " + RARITY_NAME[grade].toLowerCase()
                  : grade === "clean" ? "Lift the curse" : "Lift the curse, lose a grade";
      add(label + "<br><span>" + fmt(cost[0]) + " souls · " + cost[1] + " scrap</span>",
          () => startCraft(a, slot, kind, grade, cost), S.souls < cost[0] || S.mat < cost[1]);
    }
  } else {
    const shelf = S.relic.filter(r => r.art.slot === slot);
    if (!shelf.length) add("Nothing to put here.", null, true);
    shelf.forEach(r => add(
      "<b>" + artTitle(r.art) + (r.art.cursed ? " ✦" : "") + "</b><br><span>" + effectLine(r.art) +
      "</span><br><em>Carried by someone who reached depth " + r.depth + ", and died " + r.deaths + " times.</em>",
      () => {
        S.relic.splice(S.relic.indexOf(r), 1);
        a.gear = a.gear || {}; a.gear[slot] = r.art; r.art.owner = a.id;
        picking = null; showCounsel(a);
      }));
  }
  add("Back", () => { picking = null; showCounsel(a); });
}

function letThemGo(a){
  if (!a || a.state !== "hollow" || S.souls < letGoCost()) return false;
  S.souls -= letGoCost();
  const ash = letGoAsh(a);
  S.meta.ash += ash;
  if (a.gear) for (const slot of A_SLOTS){
    const g = a.gear[slot];
    if (g) toReliquary(g, peakOf(a), a.deaths, a.name);
  }
  a.gear = null;
  releaseSlot(a);
  S.pool.splice(S.pool.indexOf(a), 1);
  S.notice = { txt:(a.name ? a.name + " is not at the fire any more." : "One of them is gone."), t:0 };
  if (vlv("herb") && vlv("ossu") && adjacent("herb", "ossuary")){   // the grove eases one of the living
    const scarred = living().filter(o => o.deaths > 0);
    if (scarred.length){
      const o = scarred[(Math.random() * scarred.length) | 0];
      o.deaths--; say(o, "Something lifted off them.");
    }
  }
  S.floats.push({ x:fx, y:fy - 50, t:0, txt:"+" + ash + " ash", col:"#a9a3b5" });
  hollowResolved();
  render(); saveGame(); return true;
}

function rekindle(a){
  const c = rekCost(a);
  if (!a || a.state !== "hollow" || S.souls < c) return false;
  const free = vlv("ossu") >= 3 && !S.freeRiteUsed;
  if (free) S.freeRiteUsed = true; else S.souls -= c;
  S.rekindles++;
  releaseSlot(a); a.deaths = 0; a.depth = 0; a.shallow = false;
  edgeSpawn(a); a.state = "walkin";
  for (let k = 0; k < 14; k++) sparks(a.x, a.y - 10, 1.1);
  hollowResolved();
  render(); return true;
}

/* ==================== dusting and deduction ==================== */

const artEl = document.getElementById("art");
const artCv = document.getElementById("artCv");
const actx  = artCv.getContext("2d");
const artDust = document.getElementById("artDust");
const artTest = document.getElementById("artTest");
const artToFire = document.getElementById("artToFire");
const AW = 240, AH = 200, GRID = 20;
const SITES = { glyph:[0.50, 0.15], material:[0.32, 0.62], form:[0.70, 0.64] };
let grimeCv = null, gctx = null, open_ = null, wiping = false, pick = null, testing = 0;

function openArtifact(a){
  open_ = a; artEl.hidden = false; closeCounsel();
  if (!a.dusted){                                   // the grime only exists before it comes off
    if (!a.grimeCv){
      a.grid = a.grid || new Uint8Array(GRID * GRID);
      a.grimeCv = document.createElement("canvas");
      a.grimeCv.width = AW; a.grimeCv.height = AH;
      grimeCv = a.grimeCv; gctx = grimeCv.getContext("2d"); paintGrime();
    } else { grimeCv = a.grimeCv; gctx = grimeCv.getContext("2d"); }
  }
  artDust.hidden = false;
  a.clean = a.clean || CLEAN[a.loc != null ? a.loc : 0];
  document.querySelector(".artTitle").textContent = "Filthy";
  document.querySelector(".artSub").textContent = (a.loc != null ? LOC[a.loc].name + ". " : "")
    + CLEAN_HINT[a.clean];
  drawArt();
}
function closeArtifact(){ open_ = null; artEl.hidden = true; }
document.getElementById("artX").addEventListener("click", closeArtifact);

function paintGrime(){
  gctx.globalCompositeOperation = "source-over";
  gctx.fillStyle = "#4a3f52"; gctx.fillRect(0, 0, AW, AH);
  for (let i = 0; i < 420; i++){                    // crust, so wiping reads as work
    gctx.fillStyle = ["#3d3345","#574a5e","#443a4d"][(Math.random()*3)|0];
    gctx.beginPath();
    gctx.arc(Math.random()*AW, Math.random()*AH, 3 + Math.random()*9, 0, 6.2832);
    gctx.fill();
  }
}

/* the artifact as it appears — which is not always as it is */
function drawArt(){
  const a = open_; if (!a) return;
  actx.clearRect(0, 0, AW, AH);
  const mat = a.origin != null ? LOC[a.origin].tint
            : { common:"#4d545a", fine:"#c9a227", rare:"#4c5a38" }[a.rarity];
  const dark = { common:"#3d444a", fine:"#5c4a1c", rare:"#3a4448" }[a.rarity];
  const cx = AW/2, cy = AH/2;
  actx.lineWidth = 4; actx.strokeStyle = "#0a0e0b"; actx.lineJoin = "round";
  const box = (x, y, w, h, r, fill) => {
    actx.beginPath();
    actx.moveTo(x-w/2+r, y-h/2);
    actx.arcTo(x+w/2, y-h/2, x+w/2, y+h/2, r); actx.arcTo(x+w/2, y+h/2, x-w/2, y+h/2, r);
    actx.arcTo(x-w/2, y+h/2, x-w/2, y-h/2, r); actx.arcTo(x-w/2, y-h/2, x+w/2, y-h/2, r);
    actx.closePath(); actx.fillStyle = fill; actx.fill(); actx.stroke();
  };
  if (a.slot === "weapon"){                         // the shape is the truth once clean
    actx.beginPath(); actx.moveTo(cx, cy - 74); actx.lineTo(cx + 13, cy - 46);
    actx.lineTo(cx + 13, cy + 30); actx.lineTo(cx - 13, cy + 30); actx.lineTo(cx - 13, cy - 46);
    actx.closePath(); actx.fillStyle = mat; actx.fill(); actx.stroke();
    box(cx, cy + 38, 56, 12, 5, dark);
    box(cx, cy + 60, 14, 34, 6, dark);
  } else if (a.slot === "armour"){
    actx.beginPath(); actx.moveTo(cx - 44, cy - 58); actx.lineTo(cx + 44, cy - 58);
    actx.lineTo(cx + 36, cy + 34); actx.lineTo(cx, cy + 70); actx.lineTo(cx - 36, cy + 34);
    actx.closePath(); actx.fillStyle = mat; actx.fill(); actx.stroke();
    box(cx, cy - 4, 42, 60, 12, dark);
  } else {
    actx.beginPath(); actx.arc(cx, cy + 10, 46, 0, 6.2832);
    actx.arc(cx, cy + 10, 26, 0, 6.2832, true);
    actx.fillStyle = mat; actx.fill("evenodd");
    actx.beginPath(); actx.arc(cx, cy + 10, 46, 0, 6.2832); actx.stroke();
    actx.beginPath(); actx.arc(cx, cy + 10, 26, 0, 6.2832); actx.stroke();
    actx.beginPath(); actx.arc(cx, cy - 32, 14, 0, 6.2832);
    actx.fillStyle = dark; actx.fill(); actx.stroke();
  }
  const g = SITES.glyph;                            // glyph is the curse tell
  actx.save(); actx.translate(AW*g[0], AH*g[1]);
  actx.lineWidth = 3.4; actx.strokeStyle = a.cursed ? "#7a4a6e" : "#d8d2c4";
  actx.beginPath();
  if (a.cursed){ actx.moveTo(-9,-9); actx.lineTo(4,-2); actx.lineTo(-4,3); actx.lineTo(9,10); }
  else { actx.arc(0, 0, 9, 0.5, 5.4); }
  actx.stroke(); actx.restore();

  if (!a.dusted && grimeCv) actx.drawImage(grimeCv, 0, 0);
}

function cellCleared(nx, ny){
  const a = open_, gx = Math.min(GRID-1, (nx*GRID)|0), gy = Math.min(GRID-1, (ny*GRID)|0);
  return a.grid[gy*GRID + gx] === 1;
}

function wipe(e){
  const a = open_; if (!a || a.dusted) return;
  const r = artCv.getBoundingClientRect();
  const x = (e.clientX - r.left) * AW / r.width, y = (e.clientY - r.top) * AH / r.height;
  const mode = a.clean || "wipe";
  let R = 24;
  if (mode === "scrape"){                              // one direction only
    const going = a.lastX != null ? x - a.lastX : 0;
    a.lastX = x;
    if (going <= 0.5) return;
    R = 20;
  } else if (mode === "press"){                        // reward staying still
    const still = a.lastX != null && Math.hypot(x - a.lastX, y - (a.lastY || y)) < 3;
    a.dwell = still ? (a.dwell || 0) + 1 : 0;
    a.lastX = x; a.lastY = y;
    R = 12 + Math.min(22, (a.dwell || 0) * 1.6);
  } else if (mode === "cut"){                          // only along the roots
    const vine = Math.abs(Math.sin((y / AH) * 6.2832) * (AW * 0.3) + AW / 2 - x);
    if (vine > 34) return;
    R = 18;
  } else if (mode === "thaw"){
    R = 30;
  }
  a.lastX = x; a.lastY = y;
  gctx.globalCompositeOperation = "destination-out";
  const grad = gctx.createRadialGradient(x, y, 0, x, y, R);   // soft edges, not a hard hole
  grad.addColorStop(0, "rgba(0,0,0,1)"); grad.addColorStop(0.65, "rgba(0,0,0,0.9)");
  grad.addColorStop(1, "rgba(0,0,0,0)");
  gctx.fillStyle = grad; gctx.beginPath(); gctx.arc(x, y, R, 0, 6.2832); gctx.fill();

  const cw = AW/GRID, ch = AH/GRID;
  for (let gy = 0; gy < GRID; gy++) for (let gx = 0; gx < GRID; gx++){
    if (a.grid[gy*GRID+gx]) continue;
    if (Math.hypot((gx+0.5)*cw - x, (gy+0.5)*ch - y) < R*0.8){ a.grid[gy*GRID+gx] = 1; a.cleared++; }
  }
  for (const k in SITES) if (!a.sites[k] && cellCleared(SITES[k][0], SITES[k][1])) a.sites[k] = true;
  for (let i = 0; i < 3; i++)
    S.sparks.push({ x:fx + (Math.random()-0.5)*10, y:fy - 10, vx:(Math.random()-0.5)*20,
                    vy:-14, t:0, life:0.4, col:"#6f6478" });
  const frac = a.cleared / (GRID*GRID);
  artToFire.disabled = frac < 0.62;
  artToFire.textContent = frac < 0.62 ? "Keep wiping — " + Math.round(frac/0.62*100) + "%" : "To the fire";
  drawArt();
}
artCv.addEventListener("pointerdown", e => { wiping = true; artCv.setPointerCapture(e.pointerId); wipe(e); });
artCv.addEventListener("pointermove", e => { if (wiping) wipe(e); });
artCv.addEventListener("pointerup",   () => { wiping = false; });
artCv.addEventListener("pointercancel", () => { wiping = false; });

artToFire.addEventListener("click", () => {
  const g = open_; if (!g) return;
  g.dusted = true;
  const a = S.pool.find(o => o.id === g.owner);
  closeArtifact();
  if (!a) return;
  a.find = null;
  a.gear = a.gear || {};
  if (!a.gear[g.slot]){ a.gear[g.slot] = g; S.notice = { txt:artTitle(g) + ". It fits.", t:0 }; }
  else a.choice = g;                          // one of the two is going in the fire
  S.seen.ident = true; if (g.cursed) S.seen.curse = true;
  showCounsel(a);
});

/* ==================== the cycle ==================== */

const UNLOCKS = [
  { key:"forge",  name:"Standing Forge", cost:80,
    body:"The smith never leaves. He is at his anvil when the next fire is lit." },
  { key:"grove",  name:"Standing Grove", cost:120,
    body:"The herbalist keeps her bench through the dark between fires." },
  { key:"road",   name:"The Old Road", cost:100,
    body:"The way down as far as the second place stays open. Nobody has to find it again." },
  { key:"dead",   name:"Stubborn Dead", cost:150,
    body:"They hold on longer. Four deaths before the grey takes them, not three." },
  { key:"wider",  name:"Wider Fire", cost:180,
    body:"Two more can sit from the beginning. The circle starts larger." },
  { key:"deep",   name:"Deep Ash", cost:220,
    body:"The new fire is lit off the old one's bed. It starts at 120, not 100." },
  { key:"names",  name:"Kept Names", cost:300,
    body:"One of the dead can be called back by name at the start of a fire, carrying one thing "
       + "they died with. They will not remember you." }
];

function ashFor(){
  return Math.max(1, Math.floor(S.peakDepth * 3 + S.runEarned / 400 + living().length * 2));
}

function endRun(voluntary){
  if (S.ending) return;
  S.ending = true;
  S.endInfo = { ash: ashFor(), depth: S.peakDepth, earned: S.runEarned,
                kept: living().length, hollowed: hollows().length,
                minutes: Math.max(1, Math.round(S.elapsed / 60)), voluntary };
  S.flame = 0;
  closeCounsel(); closeArtifact(); closeSheet(); bookEl.hidden = true;
  setTimeout(showEnd, voluntary ? 900 : 2600);     // let the light go out first
}

function showEnd(){
  const e = S.endInfo;
  S.meta.ash += e.ash; S.meta.cycles++;
  openSheet("The fire is out", "Cycle " + S.meta.cycles + " ended.", [
    { html:"<em>" + (e.voluntary ? "I let it go out while I still could."
        : "It went out, the way they do.") + "</em>", onClick:null },
    { html:"The fire held for <span>" + e.minutes + " minutes</span>.", onClick:null },
    { html:"Deepest anyone got: <span>depth " + e.depth + "</span>.", onClick:null },
    { html:"<span>" + fmt(e.earned) + " souls</span> passed through my hands.", onClick:null },
    { html: e.kept + " still standing when the light went. " + e.hollowed + " grey.", onClick:null },
    { html:"<b>" + e.ash + " ash</b><br><em>What is left of a fire is what you build the next one with.</em>",
      onClick:null },
    { html:"<b>Rake the ashes</b>", onClick: () => { closeSheet(); openAshes(); } },
    { html:"Kindle another fire", onClick: () => { closeSheet(); newCycle(); } }
  ]);
  saveGame();
}

function openTrade(){
  const rate = 6, back = 12;
  openSheet("The Tinker's rate", "Both directions are bad. That is the trade.", [
    { html:"<b>Sell 10 scrap</b><br><em>" + (10 * rate) + " souls, which is not what it is worth.</em>",
      onClick: S.mat < 10 ? null : () => { S.mat -= 10; S.souls += 10 * rate;
        S.notice = { txt:"Sold, badly.", t:0 }; openTrade(); } },
    { html:"<b>Buy 5 scrap</b><br><em>" + (5 * back) + " souls, which is worse.</em>",
      onClick: S.souls < 5 * back ? null : () => { S.souls -= 5 * back; S.mat += 5;
        S.seen.material = true; openTrade(); } },
    { html:"Leave it", onClick: closeSheet }
  ]);
}

function openAshes(){
  const rows = UNLOCKS.map(u => {
    const owned = has(u.key), afford = S.meta.ash >= u.cost;
    return { html:"<b>" + u.name + (owned ? " — kept" : "") + "</b><br><em>" + u.body + "</em>" +
                  (owned ? "" : "<br><span>" + u.cost + " ash</span>"),
      onClick: owned || !afford ? null : () => {
        S.meta.ash -= u.cost; S.meta.unlocks.push(u.key); saveGame(); openAshes();
      } };
  });
  rows.push(S.ending
    ? { html:"<b>Kindle another fire</b>", onClick: () => { closeSheet(); newCycle(); } }
    : { html:"Back to the fire", onClick: closeSheet });   // never end a live run by accident
  openSheet("Ashes", fmt(S.meta.ash) + " ash. These carry between fires.", rows);
}

function newCycle(){
  S.souls = 0; S.mat = 0; S.lv = { flame:0, word:0, echo:0, circle:0 };
  S.v = { smith:has("forge")?1:0, herb:has("grove")?1:0, quart:0, carto:0, ossu:0, tink:0 };
  S.plots = [null,null,null,null,null,null,null]; S.spent = {}; S.marked = null; S.freeRiteUsed = false;
  if (S.v.smith) S.plots[0] = "smith";
  if (S.v.herb) S.plots[1] = "herb";
  S.rekindles = 0; S.bells = 0; S.embers = T.MAX_EMBERS; S.emberT = 0;
  S.pool = []; S.relic = []; S.lost = []; S.arriveT = 0;
  S.flameMax = has("deep") ? 120 : T.FLAME_MAX; S.flame = S.flameMax;
  S.unlocked = has("road") ? 1 : 0; S.log = [];
  S.peakDepth = 0; S.runEarned = 0; S.elapsed = 0; S.earnLog = [];
  S.floats = []; S.sparks = []; S.says = []; S.notice = null;
  S.sel = null; S.ending = false; S.endInfo = null;
  S.first = false; S.nudge = null; S.tipSeen = true;   // every fire after the first opens whole
  S.tab = "skills"; CAM.set = false;
  for (let i = 0; i < slotUsed.length; i++) slotUsed[i] = null;
  if (has("names") && S.meta.dead.length){        // one of them is called back
    const d = S.meta.dead[(Math.random() * S.meta.dead.length) | 0];
    const a = recruit(); a.name = d.name || null;
    if (!a.name) giveName(a);
    S.notice = { txt:(a.name || "Someone") + " came back. Not the same one, but the name is.", t:0 };
  }
  render(); saveGame();
}

/* ==================== gestures ====================
   Six verbs, one per vendor. None runs past five seconds and none can fail
   destructively: sloppy work gets the base result, good work gets a little more. */

const GEST = {
  hammer:{ title:"Strike it", hint:"Tap when the metal is bright.", rounds:4 },
  stir:  { title:"Stir it",   hint:"Hold, and keep going round.",   rounds:2 },
  pack:  { title:"Pack it",   hint:"Drag each thing into the pack.", rounds:3 },
  route: { title:"Trace it",  hint:"Draw the way down.",            rounds:3 },
  vigil: { title:"Sit with them", hint:"Hold. It takes as long as it takes.", rounds:1 },
  break: { title:"Break it",  hint:"Left, right, left. Keep at it.", rounds:8 }
};

const gEl = document.getElementById("gest");
const gCv = document.getElementById("gestCv");
const gctx2 = gCv.getContext("2d");
const GW = 260, GH = 190;
let G = null;

function startGesture(kind, done){
  const spec = GEST[kind];
  G = { kind, spec, done, hits:0, miss:0, t:0, phase:0, ang:0, held:0, last:null, items:[0,1,2], side:1 };
  document.getElementById("gestTitle").textContent = spec.title;
  document.getElementById("gestHint").textContent = spec.hint;
  gEl.hidden = false;
}
function endGesture(){
  if (!G) return;
  const quality = Math.max(0, Math.min(1, G.hits / (G.spec.rounds || 1)));
  const cb = G.done; G = null; gEl.hidden = true;
  if (cb) cb(quality);
}
document.getElementById("gestX").addEventListener("click", () => {
  if (!G) return;                                   // walking away still finishes the job, plainly
  const cb = G.done; G = null; gEl.hidden = true; if (cb) cb(0);
});

function gestPoint(e){
  const r = gCv.getBoundingClientRect();
  return { x:(e.clientX - r.left) * GW / r.width, y:(e.clientY - r.top) * GH / r.height };
}
gCv.addEventListener("pointerdown", e => {
  if (!G) return;
  gCv.setPointerCapture(e.pointerId);
  const p = gestPoint(e);
  if (G.kind === "hammer"){
    const bright = Math.abs(Math.sin(G.t * 2.4)) > 0.82;
    if (bright) G.hits++; else G.miss++;
    G.phase++;
    for (let i = 0; i < 8; i++) S.sparks.push({ x:fx, y:fy - 16, vx:(Math.random()-0.5)*40, vy:-30, t:0, life:0.5 });
    if (G.phase >= G.spec.rounds) endGesture();
  } else if (G.kind === "break"){
    const wantLeft = G.side > 0;
    if ((p.x < GW/2) === wantLeft){ G.hits++; G.side *= -1; } else G.miss++;
    G.phase++;
    if (G.phase >= G.spec.rounds) endGesture();
  } else if (G.kind === "pack" || G.kind === "route"){
    G.drag = true; G.last = p;
  } else if (G.kind === "vigil" || G.kind === "stir"){
    G.holding = true; G.last = p;
  }
});
gCv.addEventListener("pointermove", e => {
  if (!G) return;
  const p = gestPoint(e);
  if (G.kind === "stir" && G.holding){
    const a = Math.atan2(p.y - GH/2, p.x - GW/2);
    if (G.ang !== 0 || G.lastAng != null){
      let d = a - (G.lastAng == null ? a : G.lastAng);
      while (d > Math.PI) d -= 6.2832;
      while (d < -Math.PI) d += 6.2832;
      G.ang += Math.abs(d) > 1 ? 0 : d;
    }
    G.lastAng = a;
    if (Math.abs(G.ang) > 6.2832 * G.spec.rounds){ G.hits = G.spec.rounds; endGesture(); }
  } else if (G.kind === "pack" && G.drag){
    const idx = G.items.findIndex(i => i >= 0 && Math.hypot(p.x - (30 + i*40), p.y - 40) < 26);
    if (idx >= 0 && p.y > 100){ G.items[idx] = -1; G.hits++;
      if (G.items.every(i => i < 0)) endGesture(); }
    if (G) G.last = p;                      // the last move can finish it; do not write to nothing
  } else if (G.kind === "route" && G.drag){
    const y = GH * (0.2 + 0.3 * G.phase);
    if (Math.abs(p.y - y) < 30 && Math.abs(p.x - GW/2) < 100){ G.phase++; G.hits++;
      if (G.phase >= G.spec.rounds) endGesture(); }
    if (G) G.last = p;
  }
});
const gestUp = () => { if (!G) return; G.drag = false; G.holding = false; G.lastAng = null; };
gCv.addEventListener("pointerup", gestUp);
gCv.addEventListener("pointercancel", gestUp);

function drawGesture(dt){
  if (!G) return;
  G.t += dt;
  if (G.kind === "vigil" && G.holding){
    G.held += dt;
    if (G.held >= 4){ G.hits = 1; endGesture(); return; }
  } else if (G.kind === "vigil") G.held = Math.max(0, G.held - dt * 0.6);
  if (G.t > 12) endGesture();                       // never trap anybody in here
  gctx2.clearRect(0, 0, GW, GH);
  gctx2.fillStyle = "#1b1526"; gctx2.fillRect(0, 0, GW, GH);
  const box = (x, y, w, h, r, fill, line) => {
    gctx2.beginPath();
    gctx2.moveTo(x-w/2+r, y-h/2);
    gctx2.arcTo(x+w/2,y-h/2,x+w/2,y+h/2,r); gctx2.arcTo(x+w/2,y+h/2,x-w/2,y+h/2,r);
    gctx2.arcTo(x-w/2,y+h/2,x-w/2,y-h/2,r); gctx2.arcTo(x-w/2,y-h/2,x+w/2,y-h/2,r);
    gctx2.closePath(); gctx2.fillStyle = fill; gctx2.fill();
    gctx2.lineWidth = 3; gctx2.strokeStyle = line || "#0a0e0b"; gctx2.stroke();
  };
  if (G.kind === "hammer"){
    const bright = Math.abs(Math.sin(G.t * 2.4));
    box(GW/2, GH/2, 120, 34, 8, mix("#3d444a", "#ffab3d", bright), bright > 0.82 ? "#ffe9b8" : "#0a0e0b");
    gctx2.fillStyle = "#7d8a85"; gctx2.font = "700 11px ui-rounded, system-ui, sans-serif";
    gctx2.textAlign = "center"; gctx2.fillText(G.phase + " / " + G.spec.rounds, GW/2, GH - 20);
  } else if (G.kind === "stir"){
    gctx2.strokeStyle = "#2b3136"; gctx2.lineWidth = 16;
    gctx2.beginPath(); gctx2.arc(GW/2, GH/2, 52, 0, 6.2832); gctx2.stroke();
    gctx2.strokeStyle = "#7fbf8a"; gctx2.lineWidth = 12;
    gctx2.beginPath();
    gctx2.arc(GW/2, GH/2, 52, -1.57, -1.57 + Math.min(6.2832, Math.abs(G.ang) / G.spec.rounds));
    gctx2.stroke();
  } else if (G.kind === "pack"){
    box(GW/2, GH - 42, 150, 56, 10, "#2b3136");
    G.items.forEach((v, i) => { if (v >= 0) box(30 + i*40, 40, 34, 34, 8, "#c9a227"); });
  } else if (G.kind === "route"){
    for (let i = 0; i < G.spec.rounds; i++){
      const y = GH * (0.2 + 0.3 * i);
      box(GW/2, y, 150, 18, 8, i < G.phase ? "#6f8fd6" : "#2b3136");
    }
  } else if (G.kind === "vigil"){
    box(GW/2, GH/2, 150, 40, 10, "#2b3136");
    box(GW/2 - 75 + Math.min(150, 150 * G.held / 4) / 2, GH/2,
        Math.max(2, Math.min(150, 150 * G.held / 4)), 40, 10, "#454b48");
    gctx2.fillStyle = "#a9a3b5"; gctx2.font = "700 11px ui-rounded, system-ui, sans-serif";
    gctx2.textAlign = "center"; gctx2.fillText("hold", GW/2, GH/2 + 4);
  } else if (G.kind === "break"){
    box(GW/4, GH/2, 90, 70, 10, G.side > 0 ? "#c9a227" : "#2b3136");
    box(3*GW/4, GH/2, 90, 70, 10, G.side < 0 ? "#c9a227" : "#2b3136");
    gctx2.fillStyle = "#7d8a85"; gctx2.font = "700 11px ui-rounded, system-ui, sans-serif";
    gctx2.textAlign = "center"; gctx2.fillText(G.hits + " / " + G.spec.rounds, GW/2, GH - 12);
  }
}

/* ==================== sheets ==================== */

const sheetEl = document.getElementById("sheet");
const sheetList = document.getElementById("sheetList");
document.getElementById("sheetX").addEventListener("click", ()=>{ sheetEl.hidden = true; });

function openSheet(title, sub, rows){
  document.getElementById("sheetTitle").textContent = title;
  document.getElementById("sheetSub").textContent = sub;
  sheetList.innerHTML = "";
  for (const r of rows){
    const b = document.createElement("button");
    b.innerHTML = r.html; b.disabled = !r.onClick;
    if (r.onClick) b.onclick = () => { r.onClick(); };
    sheetList.appendChild(b);
  }
  sheetEl.hidden = false;
}
const closeSheet = () => { sheetEl.hidden = true; };

function gearSummary(a){
  const bits = A_SLOTS.map(k => {
    const g = gearIn(a, k);
    if (!g) return null;
    return RARITY_NAME[g.rarity].toLowerCase() + " " + k + (g.cursed ? " ✦" : "")
         + (g.origin != null ? " (" + LOC[g.origin].code + ")" : "");
  }).filter(Boolean);
  return bits.length ? bits.join(", ") : "nothing but their own skin";
}

function openLocation(i){
  const where = LOC[i];
  const inside = away().filter(a => locOf(a.depth) === i);
  const rows = [];
  if (!inside.length) rows.push({ html:"<em>Nobody is down there right now.</em>", onClick:null });
  for (const a of inside){
    const prog = Math.round((1 - a.t / T.AWAY) * 100);
    const c = bellCost();
    rows.push({
      html:"<b>" + (a.name || "One of the unnamed") + "</b> · depth " + a.depth +
           "<br><em>Carrying " + gearSummary(a) + ".</em>" +
           "<br><span>" + prog + "% of the way through</span> · tap to ring them back for " + fmt(c),
      onClick: () => { if (ringBell(a)) closeSheet(); else openLocation(i); }
    });
  }
  const lines = S.log.filter(l => l.loc === i).slice(-8).reverse();
  if (lines.length) rows.push({ html:"<b>What came back up</b>", onClick:null });
  for (const l of lines) rows.push({ html:"<em>" + l.txt + "</em>", onClick:null });
  const locked = i > S.unlocked;
  openSheet(where.name, locked ? "Not open. " + where.gate + " is in the way."
    : "Depths " + locFloor(i) + " to " + (i === LOC.length-1 ? "as far as it goes" : locFloor(i)+1) + ".", rows);
}

function openMap(){
  const rows = LOC.map((L, i) => {
    const inside = away().filter(a => locOf(a.depth) === i).length;
    const open = i <= S.unlocked;
    return {
      html:"<b>" + L.name + "</b>" + (open ? "" : " — shut") +
           "<br><em>" + (open ? (inside ? inside + " down there now." : "Empty.")
             : L.gate + " holds it." + (vlv("carto") >= 2
                 ? " It wants about " + gateDifficulty(i).toFixed(1)
                   + "; the best of them is worth " + bestGateScore().toFixed(1) + "."
                 : " Nobody has measured it.")) + "</em>" +
           (open ? "<br><span>Depths " + locFloor(i) + "+</span>" : ""),
      onClick: open ? () => openLocation(i) : null
    };
  });
  if (vlv("carto") >= 3 && S.marked == null)
    rows.push({ html:"<b>Mark a place for this fire</b><br><em>Better things come out of it. Once.</em>",
      onClick: () => openSheet("Mark which?", "It holds until the fire goes out.",
        LOC.slice(0, S.unlocked + 1).map((L, i) => ({ html:"<b>" + L.name + "</b>",
          onClick: () => startGesture("route", () => { S.marked = i; closeSheet(); }) }))) });
  if (vlv("tink") >= 2)
    rows.push({ html:"<b>The Tinker's rate</b><br><em>Scrap for souls, souls for scrap, badly both ways.</em>",
      onClick: openTrade });
  openSheet("The road below", "Seven places, and a gate between each.", rows);
}

function openBuild(plot){

function openShelf(){
  const living = S.pool.filter(a => a.state !== "hollow");
  openSheet("Left Behind", "What outlived the people carrying it.", S.relic.length ? S.relic.map(r => ({

        onClick: () => startGesture("break", q => {

          S.mat += n; S.seen.material = true;
          S.relic.splice(S.relic.indexOf(r), 1);
          S.notice = { txt:"Beaten flat. " + n + " scrap.", t:0 };

        })
      })));
    };

  }
  if (vlv("tink") >= 3 && S.relic.length && !S.reforgedThisCycle){

    b.onclick = () => openSheet("Reshape which?", "It keeps its grade and loses its purpose.",
      S.relic.map(r => ({ html:"<b>" + artTitle(r.art) + "</b>", onClick: () => {
        const others = A_SLOTS.filter(k => k !== r.art.slot);
        openSheet("Into what?", artTitle(r.art) + " becomes:", others.map(k => ({
          html:"<b>" + RARITY_NAME[r.art.rarity] + " " + SLOT_NAME[k] + "</b>",
          onClick: () => startGesture("hammer", () => {
            r.art.slot = k; r.art.line = "Beaten into a shape it was never meant to hold.";
            S.reforgedThisCycle = true; closeSheet(); render();
          })
        })));
      } })));
    sheetList.appendChild(b);
  }
}

/* ==================== persistence ==================== */

const SAVE_KEY = "sanctuary.save";
const SAVE_VERSION = 4;
const OFFLINE_CAP = 8 * 3600;

const stripArt = g => g && { id:g.id, slot:g.slot, rarity:g.rarity, cursed:g.cursed, depth:g.depth, origin:g.origin,
                             dusted:g.dusted, line:g.line, curseLine:g.curseLine, owner:g.owner,
                             craft:g.craft, cleared:g.cleared };

function serialize(){
  return {
    version: SAVE_VERSION, at: Date.now(),
    souls:S.souls, mat:S.mat, lv:S.lv, smithLv:vlv("smith"), herbLv:vlv("herb"),
    rekindles:S.rekindles, bells:S.bells, embers:S.embers, taps:S.taps,
    seen:S.seen, tipSeen:S.tipSeen, nextId:S.nextId, nextArt:S.nextArt,
    flame:S.flame, flameMax:S.flameMax, peakDepth:S.peakDepth, runEarned:S.runEarned,
    unlocked:S.unlocked, log:S.log.slice(-30),
    v:S.v, plots:S.plots, spent:S.spent, marked:S.marked,
    freeRiteUsed:S.freeRiteUsed, reforgedThisCycle:S.reforgedThisCycle,
    everHollowed:S.everHollowed, elapsed:S.elapsed, flameOn:S.flameOn,
    first:S.first, beat:S.beat, rests:S.rests, rev:S.rev,
    nudge:S.nudge, bookShown:S.bookShown,
    pool: S.pool.map(a => ({
      id:a.id, depth:a.depth, deaths:a.deaths, shallow:a.shallow, state:a.state, t:a.t, name:a.name || null,
      slot:a.slot, sp:a.sp, garb:a.garb, build:a.build || 0, rate:a.rate || 1, peak:a.peak || 0, route:a.route == null ? null : a.route,
      packed:!!a.packed,
      gear: a.gear ? { weapon:stripArt(a.gear.weapon), armour:stripArt(a.gear.armour),
                       trinket:stripArt(a.gear.trinket) } : null,
      find: stripArt(a.find), choice: stripArt(a.choice), recalled:a.recalled || false
    })),
    relic: S.relic.map(r => ({ art:stripArt(r.art), depth:r.depth, deaths:r.deaths, name:r.name || null })),
    lost:  S.lost.map(l => ({ art:stripArt(l.art), depth:l.depth, deaths:l.deaths })),
    meta:  S.meta
  };
}

function migrate(save){
  if (!save || typeof save !== "object") return null;
  let v = save.version | 0;
  if (v > SAVE_VERSION) return null;          // a newer build wrote this; leave it alone
  if (v < SAVE_VERSION){
    save.meta = save.meta || { ash:0, unlocks:[], dead:[], cycles:0 };
    save.version = SAVE_VERSION;
  }
  return save;
}

function saveGame(){
  if (S.ending) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(serialize())); }
  catch (e){ /* a full or blocked store is not worth crashing the fire over */ }
}

function restore(save){
  S.souls = save.souls || 0; S.mat = save.mat || 0;
  S.lv = Object.assign(S.lv, save.lv || {});
  S.rekindles = save.rekindles || 0; S.bells = save.bells || 0;
  S.embers = save.embers != null ? save.embers : T.MAX_EMBERS;
  S.taps = save.taps || 0; S.tipSeen = !!save.tipSeen;
  S.everHollowed = !!save.everHollowed; S.elapsed = save.elapsed || 0;
  /* A save written before the first fire was authored has already seen everything. */
  S.first = save.first != null ? !!save.first : false;
  S.beat = save.beat || 0; S.rests = save.rests || 0;
  S.nudge = save.nudge != null ? save.nudge : null;
  S.bookShown = !!save.bookShown;
  S.rev = Object.assign({}, S.rev, save.rev || {});
  S.flameOn = save.flameOn != null ? !!save.flameOn : true;
  S.tab = revealed("build") ? S.tab : "skills";
  S.flameMax = save.flameMax || T.FLAME_MAX;
  S.flame = save.flame != null ? save.flame : S.flameMax;
  S.peakDepth = save.peakDepth || 0; S.runEarned = save.runEarned || 0;
  S.unlocked = save.unlocked || 0; S.log = save.log || [];
  S.v = Object.assign({ smith:0, herb:0, quart:0, carto:0, ossu:0, tink:0 },
                      save.v || { smith:save.smithLv || 0, herb:save.herbLv || 0 });
  S.plots = save.plots && save.plots.length ? save.plots : [null,null,null,null,null,null,null];
  if (!save.plots){                                   // an older save had two vendors and no ground
    if (S.v.smith) S.plots[0] = "smith";
    if (S.v.herb) S.plots[1] = "herb";
  }
  S.spent = save.spent || {}; S.marked = save.marked == null ? null : save.marked;
  S.freeRiteUsed = !!save.freeRiteUsed; S.reforgedThisCycle = !!save.reforgedThisCycle;
  S.seen = Object.assign(S.seen, save.seen || {});
  S.nextId = save.nextId || 1; S.nextArt = save.nextArt || 1;
  S.meta = Object.assign(S.meta, save.meta || {});
  const rehydrate = g => g ? Object.assign({ grid:null, sites:{}, grimeCv:null }, g) : null;
  S.pool = (save.pool || []).map(p => {
    const a = Object.assign({ x:0, y:0, dir:1, exit:0, bob:0, events:null, flash:null,
                              pending:null, find:null, choice:null, gear:null }, p);
    if (!a.sp){                                     // saves from before the animals arrived
      a.sp = SPECIES[(Math.random() * SPECIES.length) | 0].key;
      a.build = (Math.random() * BUILDS.length) | 0; a.rate = 0.8 + Math.random() * 0.5;
    }
    a.find = rehydrate(p.find); a.choice = rehydrate(p.choice);
    if (p.gear){ a.gear = {}; for (const k of A_SLOTS) if (p.gear[k]) a.gear[k] = rehydrate(p.gear[k]); }
    edgeSpawn(a);
    if (a.state === "rest" || a.state === "wait" || a.state === "walkin"){ a.slot = -1; a.state = "walkin"; }
    return a;
  });
  for (const a of S.pool) if (!a.garb) a.garb = pickGarb(a.sp);   // once the circle is whole again
  for (let i = 0; i < T.SLOTS; i++) slotUsed[i] = null;
  S.relic = (save.relic || []).map(r => ({ art:rehydrate(r.art), depth:r.depth, deaths:r.deaths, name:r.name }));
  S.lost  = (save.lost  || []).map(l => ({ art:rehydrate(l.art), depth:l.depth, deaths:l.deaths }));
}

/* The offline pass runs the real rules at a coarse step, so nothing drifts. */
function runOffline(seconds){
  const report = { seconds, souls:0, hollowed:[], found:0, scrap:0, deaths:0 };
  S.offline = report;
  const step = 0.5;
  const before = S.souls, beforeMat = S.mat;
  for (let t = 0; t < seconds; t += step){
    S.arriveT += step;
    const iv = interval();
    while (S.arriveT >= iv){ S.arriveT -= iv;
      if (revealed("arrivals") && living().length < poolCap()) recruit(); }
    updatePool(step);
    tickCraft(step);
    tickOpening(step);
    if (S.flameOn && !S.ending) tickFlame(step);
    if (S.ending){ report.flameDied = true; break; }
  }
  report.souls = S.souls - before;
  report.scrap = S.mat - beforeMat;
  S.offline = null;
  S.floats.length = 0; S.sparks.length = 0; S.says.length = 0; S.notice = null;
  return report;
}

function card(o){
  const el = document.createElement("div"); el.className = "card";
  el.innerHTML =
    '<div class="icon" style="background:' + o.tint + '">' + o.glyph + '</div>' +
    '<div class="info"><div class="name">' + o.name +
      (o.level != null ? '<span class="lvl">LV ' + o.level + '</span>' : '') +
    '</div><div class="desc"></div></div>' +
    '<button class="buy"><span></span><small>SOULS</small></button>';

  btn.addEventListener("click", o.onBuy);

    btn.classList.toggle("done", !!done);
    const small = btn.querySelector("small");

  });
}
