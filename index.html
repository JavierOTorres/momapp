<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1512">
<title>Sanctuary</title>
<style>
  :root{
    /* Human stone is cool. The fire is the only warm thing. */
    --bg:#0f1512; --panel:#1b2124; --panel-2:#232b2e; --ink:#0a0e0b;
    --line:#0a0e0b; --text:#d8d2c4; --dim:#7d8a85;
    --ember:#ffab3d; --ember-2:#f2682c; --gold:#ffe9b8;
    --good:#4c5a38; --cold:#4d545a; --disabled:#2b3136;
    --moss:#35402c; --stone:#2b3136; --keeper:#d9c48a;
    --cursed:#7a4a6e; --rare:#c9a227;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:var(--bg);color:var(--text);
    font-family:ui-rounded,"Avenir Next Rounded","Trebuchet MS",Verdana,system-ui,sans-serif;
    font-weight:700;letter-spacing:.02em;
    display:flex;justify-content:center;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;
  }
  #app{
    width:100%;max-width:430px;height:100dvh;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* ---------- top bar ---------- */
  #top{
    flex:0 0 auto;padding:9px 10px 6px;gap:6px;
    display:flex;align-items:center;justify-content:space-between;
    background:var(--panel);
  }
  #soulWrap{display:flex;align-items:baseline;gap:5px;min-width:0;flex-wrap:wrap}
  #souls{font-size:25px;line-height:1;color:var(--gold);text-shadow:0 2px 0 var(--ink)}
  #matWrap{font-size:9px;color:var(--dim);letter-spacing:.04em}
  #matWrap span{color:#4c5a38;font-size:12px}
  #soulLabel{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
  #rate{font-size:8px;color:var(--dim);text-align:right;line-height:1.3;white-space:nowrap}
  #rate b{display:block;font-size:13px;color:var(--text)}
  #flameWrap{flex:0 0 auto;margin-left:6px;text-align:center}
  #flameBar{
    width:52px;height:9px;border:3px solid var(--line);border-radius:6px;background:#232c20;overflow:hidden;
  }
  #flameBar i{display:block;height:100%;width:100%;background:var(--ember);transition:width .3s linear}
  #flameNum{display:block;font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:.08em}
  #bookBtn{
    flex:0 0 auto;margin-left:6px;width:34px;height:34px;border-radius:10px;
    border:3px solid var(--line);background:var(--panel-2);font-size:16px;line-height:1;
  }
  #sheet{
    position:fixed;inset:0;z-index:22;background:#0f1512;
    display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  #sheet[hidden]{display:none}
  #sheetList{flex:1 1 auto;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px}
  #sheetList button{
    text-align:left;padding:10px 12px;border:3px solid var(--line);border-radius:14px;
    background:var(--panel-2);color:var(--text);font:inherit;font-size:12px;line-height:1.45;
  }
  #sheetList button b{font-size:13px}
  #sheetList button span{color:var(--gold);font-weight:700}
  #sheetList button em{color:var(--dim);font-style:italic}
  #sheetList button:disabled{opacity:.7}
  #book{
    position:fixed;inset:0;z-index:20;background:#0f1512;
    display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  #book[hidden]{display:none}
  .bookTop{
    display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:3px solid var(--line);
    background:var(--panel);
  }
  .bookTop h3{margin:0;font-size:15px;letter-spacing:.06em}
  .bookTop p{margin:3px 0 0;font-size:11px;font-weight:600;color:var(--dim);font-style:italic}
  #bookList{flex:1 1 auto;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px}
  #pop{
    flex:0 0 auto;display:flex;gap:14px;padding:0 16px 9px;
    background:var(--panel);border-bottom:3px solid var(--line);
    font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em;
  }
  #pop span{display:flex;align-items:center;gap:5px}
  #pop i{width:8px;height:8px;border-radius:9px;display:block;border:2px solid var(--ink)}
  .dFire{background:var(--ember)} .dAway{background:var(--cold)} .dHollow{background:#454b48}

  /* ---------- sanctuary ---------- */
  /* Nothing in the HUD exists until it is true; then it arrives. */
  #top,#top>*,#pop,#pop>span,#bottom,.tab{transition:opacity .55s ease,height .45s ease,padding .45s ease}
  body.boot #top,body.boot #top>*,body.boot #pop,body.boot #bottom,body.boot .tab{transition:none}
  .gone{opacity:0;pointer-events:none}
  #top.gone,#pop.gone{height:0;padding:0;overflow:hidden;border:0}
  #bottom.gone{flex:0 0 0;height:0;min-height:0;padding:0;overflow:hidden;border:0}
  .tab.gone{display:none}

  #stage{flex:1 1 auto;position:relative;min-height:0;background:var(--bg)}
  canvas{display:block;width:100%;height:100%}

  /* ---------- counsel card ---------- */
  #gest{
    position:fixed;inset:0;z-index:30;background:rgba(15,11,22,0.97);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;
  }
  #gest[hidden]{display:none}
  #gestCv{
    width:260px;height:190px;border:3px solid var(--line);border-radius:14px;
    background:#1b1526;touch-action:none;
  }
  #art{
    position:absolute;inset:0;z-index:6;background:rgba(15,11,22,0.96);
    display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 12px;
  }
  #art[hidden]{display:none}
  .artTop{display:flex;align-items:center;gap:10px;width:100%}
  .artTitle{font-size:15px}
  .artSub{font-size:11px;font-weight:600;color:var(--dim);margin-top:2px}
  #artCv{
    width:240px;height:200px;flex:0 0 auto;border:3px solid var(--line);border-radius:14px;
    background:#1b1526;touch-action:none;
  }
  .artHint{font-size:11px;font-weight:600;color:var(--dim);text-align:center;margin:2px 0 6px}
  #artDust,#artTest{width:100%;display:flex;flex-direction:column;gap:6px}
  #artTest[hidden],#artDust[hidden]{display:none}
  .axis{display:flex;gap:6px}
  .axis button{
    flex:1;padding:8px 2px;border:3px solid var(--line);border-radius:10px;
    background:var(--panel-2);color:var(--text);font:inherit;font-size:11px;
  }
  .axis button.on{background:var(--gold);color:var(--ink)}
  .axis button.out{opacity:.35;text-decoration:line-through}
  .tests{display:flex;gap:6px;margin-top:2px}
  .tests button{
    flex:1;padding:9px 2px;border:3px solid var(--line);border-radius:10px;
    background:var(--panel-2);color:var(--text);font:inherit;font-size:10.5px;line-height:1.3;
  }
  .tests button:disabled{opacity:.4}
  .tests button b{display:block;color:var(--gold);font-size:11px}
  #counsel{
    position:absolute;left:10px;right:10px;bottom:10px;z-index:5;
    background:var(--panel-2);border:3px solid var(--line);border-radius:16px;
    padding:10px;box-shadow:0 8px 0 rgba(0,0,0,.35);
  }
  #counsel[hidden]{display:none}
  .cTop{display:flex;align-items:center;gap:10px}
  .cTone{flex:0 0 auto;width:26px;height:26px;border-radius:14px;border:3px solid var(--line)}
  .cTitle{font-size:14px}
  .cSub{font-size:11px;font-weight:600;color:var(--dim);margin-top:2px}
  .cClose{
    margin-left:auto;width:30px;height:30px;border-radius:10px;border:3px solid var(--line);
    background:var(--panel);color:var(--dim);font:inherit;font-size:14px;
  }
  .cOdds{
    margin:8px 0;padding:7px 9px;border-radius:11px;background:var(--panel);
    border:3px solid var(--line);font-size:11.5px;font-weight:600;color:var(--dim);line-height:1.45;
  }
  .cOdds b{font-size:15px;color:var(--text);font-weight:800}
  .cGear{display:flex;gap:6px;margin-bottom:8px}
  .cGear button{
    flex:1;padding:7px 3px;border:3px solid var(--line);border-radius:11px;
    background:var(--panel);color:var(--text);font:inherit;font-size:10px;line-height:1.3;
  }
  .cGear button i{display:block;color:var(--dim);font-style:normal;font-size:9px;letter-spacing:.08em}
  .cGear button.filled{background:var(--panel-2);color:var(--gold)}
  .cGear button.cursed{color:#e0708a}
  .cActs{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
  .cActs button{
    width:100%;padding:8px 10px;border:3px solid var(--line);border-radius:11px;text-align:left;
    background:var(--panel);color:var(--text);font:inherit;font-size:11.5px;
  }
  .cActs button i{display:block;color:var(--dim);font-style:normal;font-size:10px;margin-top:2px}
  .cPick button b{font-size:11.5px}
  .cPick button span{color:var(--gold);font-weight:700}
  .cPick button em{color:var(--dim);font-style:italic;font-weight:600}
  .cPick{
    max-height:126px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;margin-bottom:8px;
  }
  .cPick button{
    width:100%;padding:8px;border:3px solid var(--line);border-radius:10px;
    background:var(--panel);color:var(--text);font:inherit;font-size:11px;text-align:left;
  }
  .cAct{
    width:100%;padding:11px;border:3px solid var(--line);border-radius:12px;
    background:var(--cold);color:var(--ink);font:inherit;font-size:14px;
  }
  .cAct:disabled{background:var(--disabled);color:#7d7090}
  .cAct.warm{background:var(--ember)}
  .cNote{font-size:10.5px;font-weight:600;color:var(--dim);text-align:center;margin-top:6px;line-height:1.35}

  /* ---------- bottom panel ---------- */
  #bottom{
    flex:0 0 auto;height:44%;min-height:296px;
    background:var(--panel);border-top:3px solid var(--line);
    display:flex;flex-direction:column;
  }
  #tabs{display:flex;flex:0 0 auto;border-bottom:3px solid var(--line)}
  .tab{
    flex:1;padding:13px 0;background:var(--panel-2);color:var(--dim);
    border:0;border-right:3px solid var(--line);
    font:inherit;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;
  }
  .tab:last-child{border-right:0}
  .tab.on{background:var(--panel);color:var(--gold);box-shadow:inset 0 -4px 0 var(--ember)}
  #list{flex:1 1 auto;overflow-y:auto;padding:11px;display:flex;flex-direction:column;gap:9px;-webkit-overflow-scrolling:touch}

  .card{
    background:var(--panel-2);border:3px solid var(--line);border-radius:14px;
    padding:10px 11px;display:flex;align-items:center;gap:11px;
  }
  .icon{
    flex:0 0 auto;width:42px;height:42px;border:3px solid var(--line);border-radius:12px;
    display:grid;place-items:center;font-size:19px;
  }
  .info{flex:1 1 auto;min-width:0}
  .name{font-size:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .lvl{flex:0 0 auto;font-size:11px;color:var(--ink);background:var(--gold);border-radius:20px;padding:2px 7px;letter-spacing:.06em}
  .desc{font-size:11.5px;font-weight:600;color:var(--dim);margin-top:3px;line-height:1.35}
  .buy{
    flex:0 0 auto;min-width:86px;padding:10px;border:3px solid var(--line);border-radius:12px;
    background:var(--ember);color:var(--ink);font:inherit;font-size:14px;
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .buy small{font-size:10px;font-weight:700;opacity:.72;letter-spacing:.1em}
  .buy:active{transform:translateY(2px)}
  .buy:disabled{background:var(--disabled);color:#7d7090;transform:none}
  .buy.done{background:var(--good);color:var(--ink)}
  .razeBtn{
    flex:0 0 auto;margin-left:6px;padding:9px 7px;border:3px solid var(--line);border-radius:11px;
    background:var(--panel);color:var(--dim);font:inherit;font-size:10px;
  }
  .entry{
    background:var(--panel-2);border:3px solid var(--line);border-radius:14px;padding:10px 12px;
  }
  .entry h4{margin:0;font-size:13px;letter-spacing:.06em}
  .entry p{margin:5px 0 0;font-size:11.5px;font-weight:600;color:var(--dim);line-height:1.45}
  .entry.locked{opacity:.55}
  .entry.locked h4{color:var(--dim)}
  .entry.locked p{font-style:italic}
  .note{font-size:11px;font-weight:600;color:var(--dim);text-align:center;padding:2px 6px 6px;line-height:1.4}
</style>
</head>
<body class="boot">
<div id="app">
  <div id="top" class="gone">
    <div id="soulWrap"><div id="souls">0</div><div id="soulLabel">souls</div>
      <div id="matWrap" hidden><span id="mat">0</span> scrap</div></div>
    <div id="rate"><b>0.0</b>souls/sec</div>
    <div id="flameWrap"><div id="flameBar"><i></i></div><span id="flameNum">100</span></div>
    <button id="bookBtn" title="The keeper's notes">📕</button>
  </div>
  <div id="pop" class="gone">
    <span><i class="dFire"></i><em id="pFire">0</em> at fire</span>
    <span><i class="dAway"></i><em id="pAway">0</em> on expedition</span>
    <span id="popHollow"><i class="dHollow"></i><em id="pHollow">0</em> hollow</span>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="gest" hidden>
      <div class="artTop">
        <div><div class="artTitle" id="gestTitle"></div><div class="artSub" id="gestHint"></div></div>
        <button class="cClose" id="gestX">✕</button>
      </div>
      <canvas id="gestCv" width="260" height="190"></canvas>
    </div>

    <div id="art" hidden>
      <div class="artTop">
        <div><div class="artTitle">Unidentified</div><div class="artSub"></div></div>
        <button class="cClose" id="artX">✕</button>
      </div>
      <canvas id="artCv" width="240" height="200"></canvas>
      <div id="artDust">
        <div class="artHint">Drag to wipe the grime away.</div>
        <button class="cAct" id="artToFire" disabled>To the fire</button>
      </div>
      <div id="artTest" hidden>
        <div class="axis" data-axis="slot"></div>
        <div class="axis" data-axis="rarity"></div>
        <div class="axis" data-axis="cursed"></div>
        <div class="tests">
          <button data-test="sound"></button>
          <button data-test="heat"></button>
          <button data-test="bleed"></button>
        </div>
        <button class="cAct warm" id="artName">Name it</button>
      </div>
    </div>

    <div id="counsel" hidden>
      <div class="cTop">
        <div class="cTone"></div>
        <div><div class="cTitle">Adventurer</div><div class="cSub"></div></div>
        <button class="cClose">✕</button>
      </div>
      <div class="cOdds"></div>
      <div class="cGear"></div>
      <button class="cAct"></button>
      <div class="cNote"></div>
    </div>
  </div>

  <div id="sheet" hidden>
    <div class="bookTop">
      <div><h3 id="sheetTitle"></h3><p id="sheetSub"></p></div>
      <button class="cClose" id="sheetX" style="margin-left:auto">✕</button>
    </div>
    <div id="sheetList"></div>
  </div>

  <div id="book" hidden>
    <div class="bookTop">
      <div><h3>The keeper's notes</h3><p>Kept because no one else was going to.</p></div>
      <button class="cClose" id="bookX" style="margin-left:auto">✕</button>
    </div>
    <div id="bookList"></div>
  </div>

  <div id="bottom" class="gone">
    <div id="tabs">
      <button class="tab on" data-tab="skills">Skills</button>
      <button class="tab gone" data-tab="build">Build</button>
    </div>
    <div id="list"></div>
    <div class="note" id="note"></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================ tuning ============================

   Deaths now scar permanently and depth halves instead of resetting,
   so dying no longer hands an adventurer their survivability back.
   DEATH_PEN is the spec's 0.10; SURV_BASE is the dial that moved.
   At 0.84 the spiral runs far too hot — first hollow at 5 minutes and
   a choked sanctuary by 11 — so base goes up, not the penalty down.
   0.98 keeps the slide legible (92% fresh, 80% at depth 4 with one
   death, 70% with two) and lands: first hollow ~7min (p90 13),
   Herbalist ~10, choke ~19, ~22 if you rekindle, and a Counsel-heavy
   player stalls past 30 without ever escaping it.                    */

const T = {
  POOL:8, SLOTS:16, AWAY:30, REST:20, WALK:62,
  SURV_BASE:0.98, SURV_SMITH:0.12, SURV_HERB:0.08, DEPTH_PEN:0.05, DEATH_PEN:0.10,
  FIRST_GRACE:0.07,
  SURV_MIN:0.15, SURV_MAX:0.92,
  HOLLOW_AT:3, HOLLOW_AT_HERB:4,
  DEPTH_PAY:0.5,
  SMITH_COST:200, HERB_COST:500, REK_BASE:150, REK_GROWTH:1.6,
  BELL_BASE:40, BELL_GROWTH:1.55, LETGO_COST:40,
  DROP_BASE:0.12, DROP_PER_DEPTH:0.03, DROP_CAP:0.45, CURSE_RATE:0.20,
  MAT_DROP_BASE:0.10, MAT_DROP_PER_DEPTH:0.02, RELIC_CAP:3, CRAFT_SECONDS:15,
  FLAME_MAX:100, BASE_DECAY:0.037, HEARTH:0.0074, FAR_FEED:0.35,
  HOLLOW_HIT:5, HOLLOW_HIT_PER_DEPTH:0.25, HOLLOW_WINDOW:30, HOLLOW_CAP:3,
  RING_MIN:4, RING_BASE:5, RING_MAX:8, NAME_AT_DEPTH:3,
  SMITH_LV:[0, 200, 800, 2500], SMITH_MAT:[0, 0, 12, 40],
  HERB_LV:[0, 500, 1100, 3000], HERB_MAT:[0, 0, 14, 44],
  FORGE_COST:{ fine:[150, 6], rare:[600, 20] },
  CLEANSE_COST:{ rough:[200, 8], clean:[700, 24] },
  MAX_EMBERS:10, EMBER_REGEN:2
};
const SMITH_SLOTS = [1,2], HERB_SLOT = 6;

const S = {
  souls:0, lv:{flame:0, word:0, echo:0, circle:0}, rekindles:0,
  embers:T.MAX_EMBERS, emberT:0, arriveT:0, taps:0, tab:"skills",
  pool:[], nextId:1, sel:null, tipSeen:false, notice:null, bells:0,
  first:true, beat:0, rests:0, nudge:null, bookShown:false,
  rev:{ embers:false, souls:false, arrivals:false, tabs:false, book:false, road:false,
        flameBar:false, pop:false, hollowCount:false, pips:false, build:false,
        sawFind:false, sawDeath:false,
        skWord:false, skCircle:false, skEcho:false, skRite:false },
  seen:{ depth:false, death:false, hollow:false, artifact:false, ident:false, curse:false, material:false, relic:false },
  mat:0, relic:[], lost:[], nextArt:1,
  v:{ smith:0, herb:0, quart:0, carto:0, ossu:0, tink:0 }, plots:[null,null,null,null,null,null,null],
  spent:{}, marked:null, freeRiteUsed:false,
  offline:null, ending:false, flameOn:true, everHollowed:false,
  flame:100, flameMax:100, runStart:0, peakDepth:0, runEarned:0,
  unlocked:0, log:[],
  meta:{ ash:0, unlocks:[], dead:[], cycles:0 },
  earnLog:[], floats:[], sparks:[], says:[]
};

const ARCHIVE = [
  { name:"This place", open:()=>true, body:
    "People built it. The steps are too tall, the doors are too wide, and the basin the fire sits "
    + "in would take four of me to fill. They are not here now. Nobody I have asked knows where "
    + "they went, and the ones who go down looking come back with their things instead of them." },
  { name:"Souls", open:()=>true, body:
    "What they pay with. I have never asked where it comes from and they have never offered. "
    + "It buys skills, vendors, the bell, and whatever the smith and the herbalist want for their "
    + "work. It does not buy anyone back." },
  { name:"Who comes", open:()=>true, body:
    "Cats keep more of themselves back and hand over less. Dogs take one more death than the rest "
    + "before the grey. Frogs go down too fast and do not last. Crows find things and cannot work "
    + "a latch. Rabbits are quick there and back and never much deeper. Goats get doors open that "
    + "nothing else will, and are slow about everything else." },
  { name:"The fire", open:()=>true, body:
    "It does not need me. I tend it anyway. Stoking it by hand pulls a soul out of the embers, "
    + "ten of them at a time, and one comes back every two seconds. Early on that is most of the "
    + "money. Later it is a thing to do with my hands." },
  { name:"Expeditions", open:()=>true, body:
    "They rest twenty seconds, pay, and go down for thirty. The bar under the count is how I "
    + "know where they are: one length of it for each place, "
    + "and a mark on it for everyone who is down there." },
  { name:"The bell", open:()=>true, body:
    "Rung, it brings one of them straight back up. They arrive alive, no deeper than they went, "
    + "and they owe me nothing, which is the point and also the cost. It asks more of me every "
    + "time I ring it." },
  { name:"Depth", open:()=>S.seen.depth, body:
    "Every run they survive takes them one layer further down. A rest pays half again as much for "
    + "each layer, so the ones who go deepest keep this place standing. Each layer also takes five "
    + "points off their odds of coming back. Both of those things are the same sentence." },
  { name:"Deaths and scars", open:()=>S.seen.death, body:
    "Dying does not end them. It halves how deep they are and it takes ten points off their odds "
    + "for good. The red pips under a figure are how many they have taken. Nothing lifts a scar "
    + "but the rite, and the rite is not cheap." },
  { name:"Hollowing", open:()=>S.seen.hollow, body:

const cost      = n => (S.first && n.key === "flame" && S.lv.flame === 0) ? 3
                     : Math.floor(n.base * Math.pow(n.growth, S.lv[n.key]));
const perRest   = () => 1 + S.lv.flame + (built("smith") ? 2 : 0);
const interval  = () => 5 * Math.pow(0.9, S.lv.word);
const echoChance= () => Math.min(0.5, 0.05 * S.lv.echo);
const peakOf    = a => Math.max(a.peak || 0, a.depth || 0);
const rekCost   = a => a ? 120 + peakOf(a) * 45 : 120;      // a deep veteran is worth paying for
const letGoCost = () => T.LETGO_COST;
const letGoAsh  = a => Math.max(1, Math.floor(peakOf(a) / 5)) * (vlv("ossu") >= 1 ? 2 : 1);
const bellCost  = () => Math.floor(T.BELL_BASE * Math.pow(T.BELL_GROWTH, S.bells));
const away      = () => S.pool.filter(a => a.state === "away");
const poolCap   = () => T.POOL + S.lv.circle + (has("wider") ? 2 : 0);
const has       = k => S.meta.unlocks.indexOf(k) >= 0;
const flameLife = () => Math.max(0, Math.min(1, S.flame / T.FLAME_MAX));
function awayScale(a){                                     // supplies make the road shorter
  let f = 1 + (a && a.sp ? (spOf(a).away || 0) : 0);        // and some of them are just quicker
  const q = vlv("quart");
  if (q) f -= (q === 1 ? 0.15 : 0.25) * vEff("quart");
  if (a && a.packed) f -= 0.05;
  if (a && a.route != null && adjActive("quart", "carto")) f -= 0.10;
  return Math.max(0.5, f);
}
const lightR    = () => (104 + S.lv.flame * 9) * (0.5 + 0.5 * flameLife());
const ringCap   = () => Math.max(T.RING_MIN, Math.round(   // the first level has to buy a seat
                    Math.min(T.RING_MAX, T.RING_BASE + Math.round(S.lv.flame / 2)) * (0.45 + 0.55 * flameLife())));
const vendorSeats = () => VENDORS.reduce((n, v) => n + (built(v.key) && inLight(plotOf(v.key)) ? v.seats : 0), 0);
const usableSeats = () => Math.max(1, ringCap() - vendorSeats());

function tickFlame(dt){
  const alive = living().length, dead = hollows().length;
  const seats = Math.max(0, usableSeats() - dead);
  const atFire = Math.min(alive, seats);
  const feed = atFire + T.FAR_FEED * Math.max(0, alive - atFire);
  const rate = T.BASE_DECAY - feed * T.HEARTH;   // the loss itself is a spike, not a drag
  S.flame = Math.max(0, Math.min(S.flameMax, S.flame - rate * dt));
  if (S.flame <= 0 && !S.ending) endRun(false);
}
const hollowAt  = a => (built("herb") ? T.HOLLOW_AT_HERB : T.HOLLOW_AT)
                     + (a && a.sp ? (spOf(a).deaths || 0) : 0);
const payFor    = a => Math.max(1, Math.round(perRest() * (1 + runDepth(a) * T.DEPTH_PAY + mods(a).pay)
                        * mods(a).payMul * (1 + (a && a.sp ? (spOf(a).pay || 0) : 0))));
const runDepth  = a => a.route != null ? Math.min(a.depth, locFloor(a.route) + 1)
                     : a.shallow ? Math.max(0, a.depth - 1) : a.depth;
const spSurv    = a => a && a.sp ? (spOf(a).survival || 0) : 0;
/* The sequence has to run eight to twelve minutes and the first hollow measured at
   a median of 6.6, so the opening pool is a little harder to kill. The survival cap
   swallows this at depth 0, which is the point: the number a new player reads is
   unchanged and only the deep, scarred runs that actually cause hollowing get the
   help. It expires the moment the first one hollows, and only the first fire. */
const grace     = () => (S.first && !S.everHollowed) ? T.FIRST_GRACE : 0;
const survival  = (d, deaths, a) => Math.max(T.SURV_MIN, Math.min(T.SURV_MAX,
                    grace() + T.SURV_BASE + (built("smith") ? T.SURV_SMITH * vEff("smith") : 0) + (built("herb") ? T.SURV_HERB * vEff("herb") : 0)
                    - d * T.DEPTH_PEN - deaths * (a ? deathPenFor(a) : T.DEATH_PEN)
                    + mods(a).surv + spSurv(a)));
const hollows   = () => S.pool.filter(a => a.state === "hollow");
const living    = () => S.pool.filter(a => a.state !== "hollow");
const avgRate   = () => {                 // never divide by a window too short to mean anything
  const w = Math.max(20, Math.min(60, S.elapsed || 0));
  return S.earnLog.reduce((s,e)=>s+e.n, 0) / w;
};

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
/* fx and fy are world coordinates and never move. The stage changes height as the
   HUD assembles itself, and the camera absorbs all of it. */
let W = 0, H = 0;
const fx = 195, fy = 300;

function resize(){
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  if (Math.abs(r.width - W) < 1 && Math.abs(r.height - H) < 1) return;   // the panel animates
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);   // a panel reflow is not a resize

/* One palette, one set of line weights. Outer contour 3, interior 1.5, detail 1. */
const C = {
  shadow:"#171b1e", stone:"#2b3136", stoneLit:"#3d444a", relief:"#4d545a", wet:"#3a4448",
  void:"#0f1512", mossDark:"#232c20", moss:"#35402c", mossLit:"#4c5a38",
  root:"#2c2a21", water:"#1e2724",
  fireCore:"#ffe9b8", fireBody:"#ffab3d", fireTongue:"#f2682c",
  deadBody:"#6e6a7a", deadCore:"#a9a3b5",
  line:"#0a0e0b", hollow:"#454b48", socket:"#1a1f1c",
  keeper:"#d9c48a", cursed:"#7a4a6e", rare:"#c9a227"
};
const LW = { outer:3, inner:3, detail:3 };   // uniform heavy outline; the style depends on it

function shape(path, fill, lw){
  ctx.beginPath(); path();
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  ctx.lineWidth = lw === 0 ? 0 : (lw || LW.outer);
  if (ctx.lineWidth){ ctx.strokeStyle = OUTLINE; ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.stroke(); }
}

const mix = (a, b, t) => {                      // blend two hexes: firelight, and things dying
  const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
  const r = Math.round(((pa>>16&255)*(1-t) + (pb>>16&255)*t));
  const g = Math.round(((pa>>8&255)*(1-t) + (pb>>8&255)*t));
  const bl = Math.round(((pa&255)*(1-t) + (pb&255)*t));
  return "#" + [r,g,bl].map(v=>v.toString(16).padStart(2,"0")).join("");
};

/* 10. Grounding: nothing floats. */
function contact(x, y, w, alpha){
  const g = ctx.createRadialGradient(x, y, 0, x, y, w);
  g.addColorStop(0, "rgba(10,14,11," + (alpha || 0.45) + ")");
  g.addColorStop(1, "rgba(10,14,11,0)");
  ctx.fillStyle = g;
  ctx.save(); ctx.translate(x, y); ctx.scale(1, 0.36); ctx.beginPath();
  ctx.arc(0, 0, w, 0, 6.2832); ctx.fill(); ctx.restore();
}
function circle(x, y, r, fill, lw){ shape(()=>ctx.arc(x, y, r, 0, 6.2832), fill, lw); }
function rrect(x, y, w, h, rad, fill, lw){
  shape(()=>{ ctx.moveTo(x-w/2+rad, y-h/2);
    ctx.arcTo(x+w/2, y-h/2, x+w/2, y+h/2, rad);
    ctx.arcTo(x+w/2, y+h/2, x-w/2, y+h/2, rad);
    ctx.arcTo(x-w/2, y+h/2, x-w/2, y-h/2, rad);
    ctx.arcTo(x-w/2, y-h/2, x+w/2, y-h/2, rad); ctx.closePath(); }, fill, lw);
}
function teardrop(x, y, w, h, fill, lw){
  shape(()=>{ ctx.moveTo(x, y-h);
    ctx.bezierCurveTo(x+w, y-h*0.5, x+w*0.85, y, x, y);
    ctx.bezierCurveTo(x-w*0.85, y, x-w, y-h*0.5, x, y-h); ctx.closePath(); }, fill, lw);
}
function desat(hex){                       // a hollow keeps its hue, drained of life
  const n = parseInt(hex.slice(1), 16), r = n>>16 & 255, g = n>>8 & 255, b = n & 255;
  const l = r*0.30 + g*0.59 + b*0.11;
  const m = c => Math.round(Math.min(255, c*0.20 + l*0.52));
  return "#" + [m(r), m(g), m(b)].map(v => v.toString(16).padStart(2,"0")).join("");
}

const GARMENTS = [
  { key:"red",    hex:"#c03a2f" }, { key:"gold",   hex:"#e0a52c" },

const OUTLINE = "#141014";

const SPMAP = {}; SPECIES.forEach(sp => SPMAP[sp.key] = sp);
const spOf = a => SPMAP[a.sp] || SPECIES[0];
const BUILDS = [{ h:1, w:1 }, { h:1.06, w:0.95 }, { h:0.95, w:1.06 }];

const TONES = [ ["#6f8fd6","#41598f"], ["#c86f8f","#8a3f5c"], ["#7fbf8a","#4a7d57"],
                ["#c9a227","#5c4a1c"], ["#9b7fd0","#5f4a8c"], ["#d0796a","#8c4638"],
                ["#5fbec4","#2f7d82"], ["#d9c48a","#9c5a22"], ["#b96fc4","#7a3f85"],
                ["#a8c95c","#6c8a30"], ["#8894b0","#525b74"], ["#c45f5f","#832f2f"] ];
const slotUsed = new Array(T.RING_MAX).fill(null);
const FIRE_TAP_R = 66;                    // nobody may sit inside this
let RING_R = 108;                         // recomputed each frame: the seats sit at the light's edge

const emberY = () => fy + RING_R * 0.52 + 34;

/* 6. The camera. The lit area fills the frame and the dark is the edge it pushes
   against, not the majority of the screen. As the light grows the frame widens to
   match, so the sanctuary grows into the screen instead of shrinking inside it. */
const CAM = { z:1, cy:0, oy:0, set:false };

function sceneBounds(){
  const onStage = S.pool.some(a => a.state !== "away");
  const R = lightR();
  let halfW = onStage ? RING_R + 24 : Math.max(R * 1.35, 66);
  let top   = onStage ? fy - RING_R * 0.52 - 66 : fy - Math.max(R * 0.62, 52);
  let bot   = Math.max(emberY() + 12, fy + (onStage ? RING_R * 0.52 + 48 : R * 0.5 + 26));
  for (let i = 0; i < plotCount(); i++){          // built ground has to stay in shot
    if (!S.plots[i]) continue;
    const pp = plotPos(i);
    halfW = Math.max(halfW, Math.abs(pp.x - fx) + 28);
    bot = Math.max(bot, pp.y + 26); top = Math.min(top, pp.y - 40);
  }
  if (K.placed){                                  // the keeper is never half out of frame
    halfW = Math.max(halfW, Math.abs(K.x - fx) + 42);
    top = Math.min(top, K.y - 68); bot = Math.max(bot, K.y + 14);
  }
  if (S.relic.length || S.seen.relic){
    const rb = relicBounds();
    halfW = Math.max(halfW, rb.x1 - fx + 12); bot = Math.max(bot, rb.y + 24);
  }
  return { halfW, top, bot };
}

function camera(dt){
  const b = sceneBounds();
  const barH = revealed("road") ? stripGeom().y + stripGeom().h + 10 : 10;
  const availH = Math.max(80, H - barH);
  const z = Math.max(0.85, Math.min(3.2, Math.min((W - 10) / (b.halfW * 2),
                                                  availH / Math.max(60, b.bot - b.top))));
  const cy = (b.top + b.bot) / 2, oy = barH + availH / 2;
  if (!CAM.set){ CAM.z = z; CAM.cy = cy; CAM.oy = oy; CAM.set = true; }
  else {
    const k = Math.min(1, dt * 1.6);              // the pull-back is a drift, never a cut
    CAM.z += (z - CAM.z) * k; CAM.cy += (cy - CAM.cy) * k; CAM.oy += (oy - CAM.oy) * k;
  }
  return CAM;
}
const worldHalfW = () => (W / 2) / CAM.z;
function toWorld(x, y){ return { x: fx + (x - W / 2) / CAM.z, y: CAM.cy + (y - CAM.oy) / CAM.z }; }

function slotPos(i){
  const n = Math.max(1, ringCap());
  const a = -Math.PI/2 + (i / n) * Math.PI * 2 + 0.4;
  return { x: fx + Math.cos(a) * RING_R, y: fy + Math.sin(a) * (RING_R * 0.52) + 14 };
}
function claimSlot(a){
  const n = usableSeats();
  for (let i = 0; i < n; i++){
    if (slotUsed[i]) continue;
    slotUsed[i] = a; a.slot = i; return true;
  }
  return false;
}
function releaseSlot(a){ if (a.slot >= 0){ slotUsed[a.slot] = null; a.slot = -1; } }
function edgeSpawn(a){
  const left = Math.random() < 0.5, off = worldHalfW() + 34;
  a.x = fx + (left ? -off : off); a.y = fy + 40 + Math.random() * 12;
  a.dir = left ? 1 : -1; a.exit = fx + (left ? off : -off);
}

const rand = arr => arr[(Math.random() * arr.length) | 0];

function pickSpecies(){                    // two candidates, the rarer one wins: no wall of frogs
  const count = k => S.pool.filter(a => a.sp === k).length;
  const a = rand(SPECIES), b = rand(SPECIES);
  return count(a.key) <= count(b.key) ? a : b;
}
function pickGarb(spKey){                  // garment is how you tell two of the same animal apart
  const kin = S.pool.filter(a => a.sp === spKey).map(a => a.garb);
  const used = g => S.pool.filter(a => a.garb === g.hex).length + (kin.includes(g.hex) ? 8 : 0);
  const best = Math.min.apply(null, GARMENTS.map(used));
  return rand(GARMENTS.filter(g => used(g) === best)).hex;   // the rarest colour in the circle
}

function recruit(){
  const sp = pickSpecies();
  const a = { id:S.nextId++, depth:0, deaths:0, shallow:false, slot:-1,
              sp:sp.key, build:(Math.random() * BUILDS.length) | 0, rate:0.8 + Math.random() * 0.5,
              garb:pickGarb(sp.key),
              tone:TONES[(S.nextId - 1) % TONES.length], state:"walkin", t:0,
              x:0, y:0, dir:1, exit:0, bob:Math.random() * 6, queue:0 };
  edgeSpawn(a); S.pool.push(a); return a;
}

function earn(n, x, y, doubled){
  S.souls += n; S.runEarned += n;
  if (S.first && !S.rev.souls){ S.rev.souls = true; refresh(); }
  S.earnLog.push({ t:S.elapsed, n });
  if (S.offline) return;
  S.floats.push({ x, y, t:0, txt:"+" + n, col: doubled ? "#ffe9b8" : "#d8d2c4" });
}

function sitDown(a){
  a.state = "rest"; a.t = T.REST;
  const p = slotPos(a.slot); a.x = p.x; a.y = p.y;
  if (a.recalled){                      // the bell buys their life, not their purse
    a.recalled = false;
    S.floats.push({ x:a.x, y:a.y - 26, t:0, txt:"no fee", col:"#4d545a" });
  } else {
    const doubled = Math.random() < echoChance();
    earn(payFor(a) * (doubled ? 2 : 1), a.x, a.y - 26, doubled);
  }
  if (S.first && S.beat < 4 && ++S.rests >= 3) beatTo(4);
  if (a.pending){ say(a, a.pending); a.pending = null; }
  a.shallow = false;                    // the discount is spent on this rest
  for (let k = 0; k < 4; k++) sparks(a.x, a.y - 10, 0.7);
}

function resolveExpedition(a){
  const d = runDepth(a), survived = Math.random() < survival(d, a.deaths, a);
  a.shallow = false;
  if (S.first && !S.rev.flameBar){        // they are back, so now there is something to protect
    S.rev.flameBar = true; S.flameOn = true; refresh();
  }
  if (survived){
    if (a.depth === d){
      const wouldBe = d + 1;
      if (wouldBe > deepestAllowed() && S.unlocked < LOC.length - 1){
        if (!attemptGate(a, S.unlocked + 1)){ edgeSpawn(a); a.state = "walkin"; return; }
      }
      const leap = spOf(a).depth || 0;                      // the reckless take two at a time
      a.depth = Math.min(wouldBe + (leap && Math.random() < 0.35 ? 1 : 0), deepestAllowed());
      if (a.depth > (a.peak || 0)) a.peak = a.depth;
    }
    if (S.first && S.beat < 6 && a.depth > 0){    // glows at the fire until tapped, once, ever
      S.nudge = a.id; beatTo(6);
    }
    if (a.depth === 1 && !S.tipSeen){ S.seen.depth = true; showTip(); }
    if (a.depth >= T.NAME_AT_DEPTH && !a.name){
      giveName(a);
      if (!S.offline) say(a, "They started calling this one " + a.name + ".");
    }
    if (a.depth > S.peakDepth) S.peakDepth = a.depth;
    dropFor(a);
    recoverGear(a, d);
    if (Math.random() < 0.25) a.pending = oneOf(d >= 5 ? LINES.deepRet : LINES.ret);
    a.packed = false; a.skipped = false; a.route = null;
  } else {
    a.deaths++; S.seen.death = true;
    beatEvent(8);                                 // pips, on everyone from now on
    if (a.deaths === 1) a.pending = oneOf(LINES.firstDeath);
    const hollowing = a.deaths >= hollowAt(a);
    if (!hollowing) loseGear(a, d, false);   // dropped at the depth that took them
    // a hollowing death keeps hold of it: goHollow puts it on the shelf instead
    a.depth = Math.floor(a.depth / 2);    // a setback, not a reset — the scar stays
    if (hollowing){ goHollow(a); return; }
  }
  edgeSpawn(a); a.state = "walkin";
}

/* ================== the first fire ==================
   Not a tutorial layer: the first cycle, authored. Every element of the HUD starts
   absent and arrives the moment it first becomes true. The sequence gates what is
   revealed, never what is permitted, and every word of it is one line in the
   keeper's voice that fades. It runs on the first cycle only. */

const revealed = k => !S.first || !!S.rev[k];

const OPEN_LINE = {
  0: "The fire is nearly out, and nobody has come this way in a long time.",
  2: "It was bigger than the fire once. Some of it is still standing.",
  3: "Someone found the light. They do not look like they were going anywhere.",
  5: "They go down. There is a down, and it runs further than I have been.",
  7: "The people who built this left their things behind. Nobody knows what for.",
  8: "Something down there had a go at them first. They came back anyway."
};

/* 7 and 8 are driven by what actually happens down there, and either can land
   first. Each owns a flag so neither is swallowed by the other arriving early. */
function beatEvent(n){                             // true the one time it fires
  if (!S.first) return false;
  const key = n === 7 ? "sawFind" : "sawDeath";
  if (S.rev[key]) return false;
  S.rev[key] = true;
  if (n === 8) S.rev.pips = true;
  if (!S.offline && OPEN_LINE[n]) S.notice = { txt:OPEN_LINE[n], t:0 };
  S.beat = Math.max(S.beat, n);
  render(); refresh(); saveGame();
  return true;
}

function beatTo(n){
  if (!S.first || S.beat >= n) return;
  S.beat = n;
  const line = OPEN_LINE[n];
  if (line && !S.offline) S.notice = { txt:line, t:0 };
  switch (n){
    case 2: break;                                  // the light does its own talking
    case 3: S.rev.arrivals = true; break;
    case 4: S.rev.tabs = true; S.rev.book = true; break;
    case 5: S.rev.road = true; S.rev.pop = true; break;
    case 6: S.rev.skEcho = true; break;             // depth exists, so paying by depth can
    case 9: S.rev.hollowCount = true; S.rev.skRite = true; break;
    case 10: S.rev.build = true; break;
  }
  render(); refresh(); saveGame();
}

/* Beats 1-3 have to land inside ninety seconds even for somebody who never taps,
   so the keeper feeds it too — slowly enough that a tap is plainly worth more. */
const OPEN_TREND = 0.55, TAP_INTENSITY = 1.5;

function tickOpening(dt){
  if (!S.first) return;
  if (S.beat < 3){
    S.flame = Math.min(S.flameMax, S.flame + OPEN_TREND * dt);
    if (S.flame >= 40) beatTo(2);
    if (S.flame >= 60) beatTo(3);
  }
}

const hollowWindow = () => vlv("ossu") >= 2 ? 60 : T.HOLLOW_WINDOW;

/* They stand up and walk out on their own if nobody decides for them. */
/* Beat 10. Whatever the player did about the first hollow, including nothing, the
   book opens once on the entry about it — the one moment they will want to know. */
function hollowResolved(){
  if (!S.first || S.beat < 9 || S.bookShown) return;
  S.bookShown = true;
  if (S.offline){ beatTo(10); return; }
  setTimeout(() => { openBook("Hollowing"); beatTo(10); }, 1500);
}

function depart(a, quiet){
  if (!a || a.state !== "hollow") return;
  const ash = letGoAsh(a);
  S.meta.ash += ash;
  if (a.gear) for (const slot of A_SLOTS){
    const g = a.gear[slot];
    if (g) toReliquary(g, peakOf(a), a.deaths, a.name);
  }
  a.gear = null;
  releaseSlot(a);
  S.pool.splice(S.pool.indexOf(a), 1);
  if (S.sel === a.id) closeCounsel();
  if (!quiet && !S.offline){
    S.notice = { txt:(a.name ? a.name + " walked out on their own." : "One of them walked out."), t:0 };
    S.floats.push({ x:a.x, y:a.y - 46, t:0, txt:"+" + ash + " ash", col:"#a9a3b5" });
  }
  hollowResolved();
}

function goHollow(a){                     // the thing the whole system exists to produce
  a.state = "hollow"; a.t = 0; a.hollowT = 0; S.seen.hollow = true;
  S.flame = Math.max(0, S.flame - (T.HOLLOW_HIT + peakOf(a) * T.HOLLOW_HIT_PER_DEPTH));
  const others = hollows().filter(o => o !== a);
  while (others.length >= T.HOLLOW_CAP) depart(others.shift(), true);   // never a wall of grey
  if (a.gear) for (const slot of A_SLOTS){     // what they carried outlives them
    const g = a.gear[slot];
    if (g) toReliquary(g, a.depth, a.deaths, a.name);
  }
  a.gear = null; a.find = null; a.choice = null;
  releaseSlot(a);
  if (claimSlot(a)){ const p = slotPos(a.slot); a.x = p.x; a.y = p.y; }
  else { a.x = fx; a.y = fy + 78; }
  S.meta.dead.push({ name:a.name || null, depth:a.depth, deaths:a.deaths, sp:a.sp,
                     carried: A_SLOTS.map(k => a.gear && a.gear[k] ? artTitle(a.gear[k]) : null).filter(Boolean),
                     cycle: S.meta.cycles + 1 });
  if (S.offline) S.offline.hollowed.push({ name:a.name || null, depth:a.depth, sp:a.sp });
  const first = !S.everHollowed; S.everHollowed = true;
  if (first) beatTo(9);
  say(a, oneOf(first ? LINES.firstHollow : LINES.hollow));
  S.notice = { txt:"Someone has gone hollow.", t:0 };
  for (let k = 0; k < 22; k++)
    S.sparks.push({ x:a.x + (Math.random()-0.5)*18, y:a.y - 14, vx:(Math.random()-0.5)*44,
                    vy:-30-Math.random()*40, t:0, life:1.1 + Math.random()*0.7, col:"#6e6a7a" });
  if (S.sel === a.id) showCounsel(a);
}

function updatePool(dt){
  const speed = 62;
  for (let i = S.pool.length - 1; i >= 0; i--){      // the window runs down whether you look or not
    const h = S.pool[i];
    if (h.state !== "hollow") continue;
    h.hollowT = (h.hollowT || 0) + dt;
    if (h.hollowT >= hollowWindow()) depart(h, false);
  }
  const seats = usableSeats();             // a shrinking ring puts the outermost back on their feet
  for (const a of S.pool){
    if (a.slot >= seats){ releaseSlot(a); if (a.state === "rest"){ a.state = "walkin"; } }
  }
  let spill = 0;                           // a hollow squats the next slot that frees
  for (const h of S.pool){
    if (h.state !== "hollow") continue;
    if (h.slot < 0 && claimSlot(h)){ const p = slotPos(h.slot); h.x = p.x; h.y = p.y; }
    if (h.slot < 0){                       // no room left: they slump outside the ring
      h.x = fx + 108 - (spill++) * 38; h.y = fy + 78;
    }
  }
  for (const a of S.pool){
    if (a.state === "hollow") continue;
    a.bob += dt * 9;
    if (a.state === "walkin"){
      if (a.slot < 0 && !claimSlot(a)){ a.state = "wait"; a.t = 0.4; continue; }
      const p = slotPos(a.slot), dx = p.x - a.x, dy = p.y - a.y, d = Math.hypot(dx, dy);
      if (d <= Math.max(3, speed * dt)) sitDown(a);      // a coarse step must not overshoot the seat
      else { a.x += dx/d * speed * dt; a.y += dy/d * speed * dt; a.dir = dx >= 0 ? 1 : -1; }
    } else if (a.state === "wait"){
      const qi = S.pool.filter(o => o.state === "wait").indexOf(a);
      const tx = fx - 108 + qi * 40, ty = fy + 62;
      a.x += (tx - a.x) * Math.min(1, dt * 3); a.y += (ty - a.y) * Math.min(1, dt * 3);
      a.t -= dt;
      if (a.t <= 0){ a.t = 0.4; if (claimSlot(a)) a.state = "walkin"; }
    } else if (a.state === "rest"){
      a.t -= dt;
      if (a.t <= 0){
        if (S.first && S.beat < 5){                 // they stay until there are three
          if (living().length < 3){ a.t = T.REST; sitDown(a); continue; }
          beatTo(5);
        }
        releaseSlot(a); a.state = "walkout"; if (S.sel === a.id) closeCounsel();
      }
    } else if (a.state === "walkout"){
      a.x += Math.sign(a.exit - a.x) * speed * dt;
      a.y += (fy + 46 - a.y) * Math.min(1, dt);
      a.dir = Math.sign(a.exit - a.x);
      if (Math.abs(a.x - a.exit) <= Math.max(6, speed * dt)){
        a.state = "away";
        a.t = T.AWAY * awayScale(a);
        a.events = [0.22 + Math.random()*0.12, 0.5 + Math.random()*0.12, 0.74 + Math.random()*0.12]
          .slice(0, 2 + (Math.random() < 0.5 ? 1 : 0))
          .map(at => ({ at, icon: EVENTS[(Math.random()*EVENTS.length)|0], fired:false }));
        a.flash = null;
      }
    } else if (a.state === "away"){
      a.t -= dt;
      const prog = 1 - a.t / T.AWAY;
      if (a.events) for (const e of a.events)
        if (!e.fired && prog >= e.at){
          e.fired = true;
          if (a.packed && vlv("quart") >= 3 && !a.skipped){   // supplies carry them past the first
            a.skipped = true; continue;
          }
          a.flash = { icon:e.icon, t:0 };
          const L = LOC[locOf(a.depth)];
          logEvent(locOf(a.depth), oneOf(L.events).replace("{n}", a.name || "Someone"));
        }
      if (a.flash && (a.flash.t += dt) > 2) a.flash = null;
      if (a.t <= 0) resolveExpedition(a);
    }
  }
}

/* ============================ artifacts ============================ */

const A_SLOTS = ["weapon", "armour", "trinket"];
const RARITIES = ["common", "fine", "rare"];
const SLOT_NAME = { weapon:"Weapon", armour:"Armour", trinket:"Trinket" };
const RARITY_NAME = { common:"Common", fine:"Fine", rare:"Rare" };

/* A curse gives more than the clean version and takes it out of another system. */
const EFFECT = {
  weapon:  { common:0.04, fine:0.08, rare:0.14 },
  armour:  { common:0.03, fine:0.05, rare:0.08 },
  trinket: { common:0.15, fine:0.30, rare:0.55 }
};
const CURSED_EFFECT = {
  weapon:  { common:0.07, fine:0.13, rare:0.22 },
  armour:  { common:0.05, fine:0.08, rare:0.12 },
  trinket: { common:0.25, fine:0.50, rare:0.90 }
};
const CURSE_COST = {                      // each cost lands on a different system
  weapon:  "they pay 40% less",
  armour:  "8% off their survival",
  trinket: "every death cuts 5% deeper"
};
const MAT_VALUE = { common:1, fine:3, rare:8 };

const artTitle = g => RARITY_NAME[g.rarity] + " " + SLOT_NAME[g.slot];
const magnitude = g => (g.cursed ? CURSED_EFFECT : EFFECT)[g.slot][g.rarity];

function effectLine(g){
  const v = magnitude(g);
  const base = g.slot === "weapon"  ? "+" + Math.round(v*100) + "% survival"
             : g.slot === "armour"  ? "scars cut " + Math.round(v*100) + "% shallower"
             :                        "+" + v.toFixed(2).replace(/0$/,"") + "x payment";
  return g.cursed ? base + ", and " + CURSE_COST[g.slot] : base;
}

function makeArtifact(depth){
  const slot = A_SLOTS[(Math.random()*3)|0], rarity = rollRarity();
  const cursed = Math.random() < T.CURSE_RATE;
  return { id:S.nextArt++, slot, rarity, cursed, depth, dusted:false, loc:locOf(depth),
           line: oneOf(ART_LINES[slot][rarity]), curseLine: cursed ? oneOf(CURSE_LINES) : null,
           grid:null, cleared:0, sites:{ form:false, material:false, glyph:false },
           owner:null, craft:null };
}
function rollRarity(){ const r = Math.random(); return r < 0.60 ? "common" : r < 0.90 ? "fine" : "rare"; }

function markedBonus(a){                       // a marked place turns up better things
  return S.marked != null && locOf(a.depth) === S.marked ? 1 : 0;
}

function dropFor(a){
  if (Math.random() < T.MAT_DROP_BASE + a.depth * T.MAT_DROP_PER_DEPTH){
    const n = 1 + ((Math.random() * (1 + a.depth/3)) | 0);
    S.mat += n; S.seen.material = true;
    S.floats.push({ x:a.x, y:a.y - 30, t:0, txt:"+" + n + " scrap", col:"#4c5a38" });
  }
  const chance = Math.min(T.DROP_CAP, T.DROP_BASE + a.depth * T.DROP_PER_DEPTH
                          + (a.sp ? (spOf(a).drop || 0) : 0));
  if (Math.random() >= chance) return;
  const art = makeArtifact(a.depth);
  if (markedBonus(a)){
    if (art.rarity === "common") art.rarity = "fine";
    else if (art.rarity === "fine") art.rarity = "rare";
    if (adjActive("herb", "carto") && art.cursed && Math.random() < 0.5) art.cursed = false;
  }
  const held = a.gear && a.gear[art.slot];
  if (held && held.rarity === art.rarity){        // a second of what they already carry
    S.mat += MAT_VALUE[art.rarity]; S.seen.material = true;
    a.pending = "Brought up its twin. It went in the scrap.";
    return;
  }
  if (a.find || a.choice){                        // hands already full
    S.mat += MAT_VALUE[art.rarity]; S.seen.material = true;
    return;
  }
  a.find = art; art.owner = a.id;
  S.seen.artifact = true;
  const firstEver = beatEvent(7);                 // the first one gets its own line
  if (S.offline){ S.offline.found++; return; }
  if (!firstEver) S.notice = { txt:"Something came up with them.", t:0 };
}

const gearIn = (a, slot) => (a.gear && a.gear[slot]) || null;

/* what someone's gear does to them, all three slots at once */
function mods(a){
  const m = { surv:0, scar:0, pay:0, payMul:1 };
  if (!a || !a.gear) return m;
  for (const slot of A_SLOTS){
    const g = a.gear[slot];
    if (!g) continue;
    const v = magnitude(g);
    if (slot === "weapon"){ m.surv += v; if (g.cursed) m.payMul *= 0.6; }
    else if (slot === "armour"){ m.scar -= v; if (g.cursed) m.surv -= 0.08; }
    else { m.pay += v; if (g.cursed) m.scar += 0.05; }
  }
  return m;
}
const deathPenFor = a => Math.max(0, T.DEATH_PEN + mods(a).scar);

function loseGear(a, depth, destroy){
  if (a.find){ a.find = null; }                 // an uncleaned find goes down with them
  if (a.choice){ a.choice = null; }
  if (!a.gear) return;
  for (const slot of A_SLOTS){
    const g = a.gear[slot];
    if (!g) continue;
        if (!destroy) S.lost.push({ art:g, depth, deaths:a.deaths });
  }
  a.gear = null;
}

function recoverGear(a, depth){               // a deep enough run finds what the dead dropped
  const i = S.lost.findIndex(l => l.depth <= depth);
  if (i < 0) return;
  const found = S.lost.splice(i, 1)[0];
  toReliquary(found.art, found.depth, found.deaths || 0);
  S.notice = { txt:"Brought up someone else's " + SLOT_NAME[found.art.slot].toLowerCase() + ".", t:0 };
}

function toReliquary(art, depth, deaths, name){
  art.owner = null; art.craft = null;
  S.relic.push({ art, depth, deaths, name:name || null });
  S.seen.relic = true;
  while (S.relic.length > T.RELIC_CAP) S.relic.shift();   // oldest goes, quietly
}

const DEPTHS_PER_LOC = 2;
const locOf = d => Math.min(LOC.length - 1, Math.floor(d / DEPTHS_PER_LOC));
const locFloor = i => i * DEPTHS_PER_LOC;                    // first depth of a place

/* A gate is set against what is reachable at the cap below it: depth climbs 2 a place,
   and gear has to make up the rest. Gate 1 falls to a decent weapon; gate 6 needs a kit. */
const gateDifficulty = i => 2.5 + (i - 1) * 3.1;
const bestGateScore = () => living().reduce((m, a) => Math.max(m, gateScore(a)), 0);

function gateScore(a){                                       // gear, depth and scars, not a coin flip
  const m = mods(a);
  return a.depth + m.surv * 22 + (-m.scar) * 30 + m.pay * 3 - a.deaths * 1.4
       + (a.sp ? (spOf(a).gate || 0) : 0);
}

function logEvent(loc, txt){
  S.log.push({ loc, txt, t:S.elapsed });
  if (S.log.length > 60) S.log.shift();
}

function attemptGate(a, next){
  const need = gateDifficulty(next), got = gateScore(a);
  const where = LOC[next];
  if (got >= need){
    S.unlocked = next;
    logEvent(next, (a.name || "Someone") + " got through " + where.gate + ".");
    S.notice = { txt:where.gate + " is open. " + where.name + " is below.", t:0 };
    const g = makeArtifact(a.depth);
    g.rarity = "rare"; g.origin = next; g.line = where.gateLine;
    g.dusted = true; g.owner = a.id;
    a.gear = a.gear || {};
    if (!a.gear[g.slot]) a.gear[g.slot] = g; else a.choice = g;
    S.seen.artifact = true; S.seen.ident = true;
    if (!S.offline) say(a, "Through, and carrying something.");
    return true;
  }
  logEvent(next, where.gate + " threw " + (a.name || "someone") + " back.");
  a.deaths++; S.seen.death = true;
  loseGear(a, a.depth, false);
  a.depth = Math.floor(a.depth / 2);
  if (!S.offline) say(a, oneOf(["The gate did not open.", "Thrown back, and lighter for it."]));
  if (a.deaths >= hollowAt(a)){ goHollow(a); return false; }
  return false;
}

/* 6. The sanctuary is a ruined temple floor, not open ground.
   Columns stand at the edge of the light; as the fire dies the building
   disappears around the player. */

const COLUMNS = [];
for (let i = 0; i < 9; i++){
  const a = -Math.PI / 2 + (i / 9) * Math.PI * 2 + 0.22;
  COLUMNS.push({ a, fallen: i === 2 || i === 6, h: 46 + (i % 3) * 16, w: 13 + (i % 2) * 3 });
}
const ROOTS = [];
for (let i = 0; i < 14; i++)
  ROOTS.push({ a: (i / 14) * Math.PI * 2 + 0.3, len: 26 + (i % 4) * 12, k: 0.6 + (i % 5) * 0.2 });

function drawGround(time){
  const R = lightR(), life = flameLife();
  const seen = t => Math.max(0, Math.min(1, (R * 1.5 - t) / 60));   // fades out past the light

  /* At a low fire the temple is not dim, it is absent. The light is what builds it. */
  const reach = 0.34 + 0.66 * life;
  shape(()=>ctx.ellipse(fx, fy + 30, 184 * reach, 76 * reach, 0, 0, 6.2832), "#141a15", 0);
  shape(()=>ctx.ellipse(fx, fy + 28, 158 * reach, 62 * reach, 0, 0, 6.2832), C.mossDark, 0);
  if (life > 0.3)
    shape(()=>ctx.ellipse(fx - 54 * reach, fy + 62 * reach, 46 * reach, 13 * reach, 0.2, 0, 6.2832),
          C.water, 0);

  // roots coming up through the joints, thickest at the outer edge
  ctx.lineCap = "round";
  for (const r of ROOTS){
    const x0 = fx + Math.cos(r.a) * (R * 0.9), y0 = fy + Math.sin(r.a) * (R * 0.42) + 16;
    const rl = r.len * reach;
    const x1 = x0 + Math.cos(r.a) * rl, y1 = y0 + Math.sin(r.a) * rl * 0.45;
    ctx.strokeStyle = C.root; ctx.lineWidth = LW.inner + 1.5;
    ctx.beginPath(); ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo((x0 + x1) / 2 + r.k * 10, (y0 + y1) / 2 - 6, x1, y1);
    ctx.globalAlpha = 0.5 + 0.5 * seen(R); ctx.stroke(); ctx.globalAlpha = 1;
  }

  // the dais: a circular cut-stone step, worn, half taken by moss
  shape(()=>ctx.ellipse(fx, fy + 22, R * 1.12, R * 0.52, 0, 0, 6.2832), C.stone, LW.inner);
  shape(()=>ctx.ellipse(fx, fy + 16, R * 0.86, R * 0.40, 0, 0, 6.2832), C.stoneLit, LW.inner);
  ctx.save();                                        // flagstone joints
  ctx.beginPath(); ctx.ellipse(fx, fy + 16, R * 0.86, R * 0.40, 0, 0, 6.2832); ctx.clip();
  ctx.strokeStyle = C.shadow; ctx.lineWidth = LW.detail; ctx.globalAlpha = 0.55;
  for (let i = -3; i <= 3; i++){
    ctx.beginPath(); ctx.moveTo(fx + i * 34, fy - 40); ctx.lineTo(fx + i * 34 + 14, fy + 70); ctx.stroke();
  }
  for (let i = 0; i <= 3; i++){
    ctx.beginPath(); ctx.moveTo(fx - R, fy - 10 + i * 22); ctx.lineTo(fx + R, fy - 16 + i * 22); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.restore();
  shape(()=>ctx.ellipse(fx - R * 0.55, fy + 30, R * 0.30, R * 0.13, 0.3, 0, 6.2832), C.moss, 0);
  shape(()=>ctx.ellipse(fx + R * 0.62, fy + 8, R * 0.22, R * 0.10, -0.2, 0, 6.2832), C.moss, 0);

  // worn relief, too far gone to read
  ctx.globalAlpha = 0.5; ctx.strokeStyle = C.relief; ctx.lineWidth = LW.detail;
  for (let i = 0; i < 5; i++){
    const a = -Math.PI / 2 + (i / 5) * Math.PI * 2 + 0.9;
    const x = fx + Math.cos(a) * R * 0.72, y = fy + Math.sin(a) * R * 0.34 + 18;
    ctx.beginPath(); ctx.arc(x, y - 5, 5, 0.3, 3.4); ctx.moveTo(x - 4, y + 1);
    ctx.lineTo(x - 3, y + 9); ctx.moveTo(x + 4, y + 1); ctx.lineTo(x + 3, y + 9); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // the basin the fire sits in: human, cracked, too big for what it holds
  shape(()=>ctx.ellipse(fx, fy + 16, 62, 26, 0, 0, 6.2832), C.stoneLit, LW.outer);
  shape(()=>ctx.ellipse(fx, fy + 10, 50, 20, 0, 0, 6.2832), C.shadow, LW.inner);
  ctx.strokeStyle = C.shadow; ctx.lineWidth = LW.detail;
  ctx.beginPath(); ctx.moveTo(fx + 26, fy + 24); ctx.lineTo(fx + 40, fy + 14);
  ctx.lineTo(fx + 52, fy + 20); ctx.stroke();
}

function drawColumns(time){                          // stand at the edge of the light
  const R = lightR();
  for (const c of COLUMNS){
    const dist = R * 1.34;
    const x = fx + Math.cos(c.a) * dist, y = fy + Math.sin(c.a) * dist * 0.30 + 30;
    if (Math.abs(x - fx) > worldHalfW() + 60) continue;
    const vis = Math.max(0, Math.min(1, (R - 72) / 62));
    if (vis <= 0.02) continue;
    ctx.globalAlpha = 0.15 + 0.85 * vis;
    contact(x, y + 2, c.w * 1.3, 0.4);
    if (c.fallen){
      shape(()=>{ ctx.save(); ctx.translate(x, y); ctx.rotate(1.2);
        ctx.rect(-c.h * 0.5, -c.w * 0.5, c.h, c.w); ctx.restore(); }, C.stone, LW.inner);
    } else {
      shape(()=>ctx.rect(x - c.w / 2, y - c.h, c.w, c.h), C.stone, LW.inner);
      shape(()=>ctx.rect(x - c.w * 0.72, y - c.h - 7, c.w * 1.44, 8), C.stoneLit, LW.inner);
      ctx.strokeStyle = C.shadow; ctx.lineWidth = LW.detail;
      for (let f = 1; f < 3; f++){
        ctx.beginPath(); ctx.moveTo(x - c.w / 2 + f * c.w / 3, y - c.h + 5);
        ctx.lineTo(x - c.w / 2 + f * c.w / 3, y - 3); ctx.stroke();
      }
      shape(()=>ctx.ellipse(x, y - c.h * 0.35, c.w * 0.55, c.h * 0.16, 0.4, 0, 6.2832), C.moss, 0);
    }
    ctx.globalAlpha = 1;
  }
}

/* 9. The firelight itself: a warm rim on the side facing the fire,
   cool shadow away from it, both scaling with how alive the flame is. */
/* The firelight catches the edge of the head, on the side turned to it. It has to
   hug the silhouette: an arc floating clear of the shape reads as a stray line. */
/* How hard the fire reaches a point, and which side of the figure it lands on.
   Shared by the code-drawn rim and the sprite treatment, so both light identically. */
function firePull(cx, cy){
  const life = flameLife();
  if (life <= 0.05) return null;
  const dx = cx - fx, dy = (cy - fy) * 0.6, d = Math.max(1, Math.hypot(dx, dy));
  const near = Math.max(0, Math.min(1, 1 - (d - 40) / (lightR() * 1.3)));
  if (near <= 0.02) return null;
  return { near, life, side: dx > 0 ? -1 : 1 };     // -1: the fire is to their left
}

function rimLight(cx, cy, w, h, r){
  const f = firePull(cx, cy);
  if (!f) return;
  const { near, life, side } = f;
  const rad = r == null ? 12 : r, x0 = cx - w / 2, y0 = cy - h / 2;
  ctx.save();
  ctx.beginPath(); ctx.rect(side > 0 ? cx : cx - w, cy - h, w, h * 2); ctx.clip();
  ctx.globalAlpha = 0.10 + 0.20 * near * life;
  ctx.strokeStyle = C.fireCore; ctx.lineWidth = 1.2 + 0.8 * near; ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(x0 + rad, y0);
  ctx.arcTo(x0 + w, y0,     x0 + w, y0 + h, rad);
  ctx.arcTo(x0 + w, y0 + h, x0,     y0 + h, rad);
  ctx.arcTo(x0,     y0 + h, x0,     y0,     rad);
  ctx.arcTo(x0,     y0,     x0 + w, y0,     rad);
  ctx.closePath(); ctx.stroke();
  ctx.restore();
}

function drawFire(time){
  const life = flameLife();                      // 0 dead, 1 roaring
  const grow = 1 + S.lv.flame * 0.11;            // Kindled Flame builds the fire itself
  const size = grow * (0.42 + 0.58 * life);      // dying pulls it back toward its base
  const speed = 0.35 + 0.65 * life;
  const pulse = 1 + Math.sin(time * 3.4 * speed) * 0.06 * life + flare;
  const R = lightR() * pulse;

  const hot  = mix("#f2682c", "#4a5668", 1 - life);
  const mid  = mix("#ffab3d", "#66748a", 1 - life);
  const tip  = mix("#ffe9b8", "#8b96a8", 1 - life);

  const g = ctx.createRadialGradient(fx, fy - 12, 4, fx, fy - 12, R);
  g.addColorStop(0, "rgba(255,152,56," + (0.20 * (0.25 + 0.75*life)).toFixed(3) + ")");
  g.addColorStop(1, "rgba(255,157,61,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(fx, fy - 12, R, 0, 6.2832); ctx.fill();

  const logs = 2 + Math.floor(S.lv.flame / 4);   // the structure grows, not just the flame
  ctx.save(); ctx.translate(fx, fy + 8);
  for (let i = 0; i < logs; i++){
    ctx.rotate(i === 0 ? -0.42 : 0.84 / Math.max(1, logs - 1));
    rrect(0, i * 2, 56 * (1 + S.lv.flame * 0.045), 13, 6, i % 2 ? "#332f24" : "#2c2a21", 4);
  }
  ctx.restore();

  const tongues = S.flame <= 0 ? 0
                : Math.max(1, Math.min(5, 1 + Math.round(S.lv.flame / 3) + (life > 0.5 ? 1 : 0)));
  const w1 = 26 * size, h1 = 62 * size + Math.sin(time * 5.1 * speed) * 4 * life;
  for (let i = 0; i < tongues; i++){
    const off = i === 0 ? 0 : (i % 2 ? 1 : -1) * (9 + i * 4) * size;
    const sc = i === 0 ? 1 : 0.52 - i * 0.05;
    teardrop(fx + off + Math.sin(time * (2.2 + i) * speed) * 2, fy - 2,
             w1 * sc, h1 * sc * (0.8 + 0.2*life), hot, Math.max(2.4, 5 * size));
  }
  teardrop(fx + Math.sin(time * 3.7 * speed) * 3, fy - 4, w1 * 0.62, h1 * 0.66, mid,
           Math.max(2, 4 * size));
  if (life > 0.05)
    teardrop(fx + Math.sin(time * 4.9 * speed) * 2, fy - 5, w1 * 0.30, h1 * 0.36, tip,
             Math.max(1.5, 3 * size));
}

/* 4 + 7 + 8. Species read as silhouettes. A hollow keeps its silhouette exactly
   and loses everything else: colour, eyes, and all movement. */

/* A head with legs, not a robe with a head.
   Head 30x32, body 12x22, legs 8x6 with 6px between them: 48px in total.
   The head must always be wider than the body or it reverts to a cone. */
const FIG = { head:{ w:36, h:28 }, body:{ w:20, h:12 }, leg:{ w:6, h:8, gap:6 }, total:48 };

function ear(x, y, w, h, tilt, fill){
  shape(()=>{ ctx.save(); ctx.translate(x, y); ctx.rotate(tilt);
    ctx.moveTo(-w * 0.5, 4); ctx.lineTo(0, -h); ctx.lineTo(w * 0.5, 4);
    ctx.closePath(); ctx.restore(); }, fill, LW.outer);
}

function drawEyes(x, y, w, state){
  const ex = w * 0.24, ry = 4.5, rx = 3.4;
  if (state === "hollow"){                          // sockets, unfilled
    for (const sx of [-1, 1]) shape(()=>ctx.ellipse(x + sx * ex, y, rx, ry, 0, 0, 6.2832), "#1a1f1c", LW.outer);
    return;
  }
  ctx.fillStyle = OUTLINE;
  for (const sx of [-1, 1]){
    ctx.beginPath(); ctx.ellipse(x + sx * ex, y, rx, ry, 0, 0, 6.2832); ctx.fill();
  }
  if (state === "weary"){                           // lids over the top third
    ctx.fillStyle = arguments[4] || "#c9a882";
    for (const sx of [-1, 1]){
      ctx.beginPath(); ctx.ellipse(x + sx * ex, y - ry * 0.72, rx * 1.15, ry * 0.7, 0, 0, 6.2832); ctx.fill();
    }
  }
}

/* The face plate is inset in the head and does most of the character work. */
function facePlate(x, y, hw, hh, sp, fill){
  const w = hw * 0.70, h = hh * 0.65;
  if (sp === "frog")
    shape(()=>ctx.ellipse(x, y, w * 0.62, h * 0.44, 0, 0, 6.2832), fill, LW.outer);
  else if (sp === "crow")
    shape(()=>{ ctx.moveTo(x, y - h * 0.5); ctx.quadraticCurveTo(x + w * 0.34, y - h * 0.1, x, y + h * 0.5);
      ctx.quadraticCurveTo(x - w * 0.34, y - h * 0.1, x, y - h * 0.5); ctx.closePath(); }, fill, LW.outer);
  else if (sp === "goat")
    shape(()=>{ ctx.moveTo(x - w * 0.42, y - h * 0.5); ctx.lineTo(x + w * 0.42, y - h * 0.5);
      ctx.quadraticCurveTo(x + w * 0.34, y + h * 0.55, x, y + h * 0.55);
      ctx.quadraticCurveTo(x - w * 0.34, y + h * 0.55, x - w * 0.42, y - h * 0.5);
      ctx.closePath(); }, fill, LW.outer);
  else if (sp === "rabbit")
    shape(()=>ctx.ellipse(x, y, w * 0.44, h * 0.56, 0, 0, 6.2832), fill, LW.outer);
  else
    shape(()=>ctx.ellipse(x, y, w * 0.52, h * 0.50, 0, 0, 6.2832), fill, LW.outer);
}

/* A species can be drawn from six hand-made poses instead of from code. Anything
   with no sprite files keeps the code-drawn figure, so species drop in one at a
   time and a missing or broken file is never worse than the art we already had.

   Everything that responds to the world stays code: the bob, the firelight, the
   contact shadow, gear, indicators, the hollow treatment. None of it is baked in. */

const POSES = ["stand", "walk_a", "walk_b", "sit", "rest", "weary"];
const SPRITE_SPECIES = ["frog", "goat"];          // add a key once its six files exist

/* Sprites are embedded in this file as data URIs, not fetched from assets/. That
   keeps the game one double-clickable file: a page opened over file:// cannot load
   its own assets/ folder in Safari, and even where it can, the images come back
   cross-origin and taint the canvas, which breaks the hollow treatment.

   assets/sprites/ is still the source of truth. SPRITE_DATA is generated from it by
   tools/embed_sprites.py, and anything not embedded falls back to the folder path so
   new art can be dropped in and tested from a served copy before being baked in. */
function spriteSrc(key, pose){
  const id = key + "_" + pose;
  return SPRITE_DATA[id] || "assets/sprites/" + id + ".png";
}

/* The shape tools/normalize_sprites.py guarantees: a square canvas, content bottom
   sitting on `baseline`, an upright figure `fig` tall. Mapping `fig` onto FIG.total
   is what puts a sprite's feet exactly where the code-drawn figure's feet land. */
const SPR_GEO = { size:256, baseline:236, fig:185 };

/* Sockets for the hollow treatment, in sprite-canvas coordinates of the sit pose.
   Fixed per species; replaced outright when real hollow sprites arrive. Sized to
   the eye as drawn, not to a shared number: the frog's socket swallows its whole
   raised eye dome, while the goat's eye is a bare oval on a pale muzzle and needs
   a socket visibly wider than the eye to read as sunken rather than just dark. */
const SOCKETS = {
  frog: [{ x:96,  y:91,  rx:20, ry:27 }, { x:168, y:91,  rx:20, ry:27 }],
  goat: [{ x:115, y:120, rx:16, ry:23 }, { x:167, y:120, rx:16, ry:23 }]
};

const WALK_S = 0.25;                              // seconds per walk frame
const SPR = { art:{} };                           // species key -> pose -> derived treatments

function sprCanvas(draw){
  const n = SPR_GEO.size, c = document.createElement("canvas");
  c.width = c.height = n;
  draw(c.getContext("2d"), n);
  return c;
}

/* Derived treatments are built once per image, never per frame. Inside an offscreen
   canvas the sprite is the only content, so "source-atop" is a mask to its alpha. */
function derivePose(img){
  const lit = side => sprCanvas((g, n) => {       // a warm wash across the lit side
    g.drawImage(img, 0, 0, n, n);
    g.globalCompositeOperation = "source-atop";
    const grad = g.createLinearGradient(side > 0 ? n : 0, 0, side > 0 ? n * 0.35 : n * 0.65, 0);
    grad.addColorStop(0, C.fireBody); grad.addColorStop(1, "rgba(255,171,61,0)");
    g.fillStyle = grad; g.fillRect(0, 0, n, n);
  });
  /* The rim has to hug the silhouette, same as the code-drawn one: keep the sprite,
     erase a copy of itself shifted away from the fire, and what survives is the edge. */
  const rim = side => sprCanvas((g, n) => {
    const off = 7;                                // ~1.8px once the sprite is down at 48
    g.drawImage(img, 0, 0, n, n);
    g.globalCompositeOperation = "destination-out";
    g.drawImage(img, -side * off, 0, n, n);
    g.globalCompositeOperation = "source-in";
    g.fillStyle = C.fireCore; g.fillRect(0, 0, n, n);
  });
  return { base:img, lit:[lit(-1), lit(1)], rim:[rim(-1), rim(1)] };
}

/* No hollow sprites exist yet, so one is derived from the living sit pose: drained
   of colour, rebuilt out of C.hollow, then sockets where the eyes were. When real
   files arrive this becomes a manifest entry, not a rewrite. */
function deriveHollow(img, key){
  const c = sprCanvas((g, n) => {
    g.drawImage(img, 0, 0, n, n);
    let d = null;
    try { d = g.getImageData(0, 0, n, n); } catch (e){ d = null; }   // a tainted canvas: tint only
    if (d){
      /* Greyscale, then rebuilt out of C.hollow alone. Calibrating against the
         sprite's own brightest pixel puts its lightest surface exactly on the
         hollow colour, which is where the code-drawn hollow puts its body: the
         two treatments land on the same values without either being hand-tuned. */
      const px = d.data, tint = C.hollow;
      const tr = parseInt(tint.slice(1,3),16), tg = parseInt(tint.slice(3,5),16), tb = parseInt(tint.slice(5,7),16);
      let peak = 1;
      for (let i = 0; i < px.length; i += 4)
        if (px[i+3] > 128){
          const l = px[i]*0.30 + px[i+1]*0.59 + px[i+2]*0.11;
          if (l > peak) peak = l;
        }
      for (let i = 0; i < px.length; i += 4){
        if (!px[i+3]) continue;
        const t = (px[i]*0.30 + px[i+1]*0.59 + px[i+2]*0.11) / peak;
        px[i] = tr * t; px[i+1] = tg * t; px[i+2] = tb * t;
      }
      g.putImageData(d, 0, 0);
    } else {
      g.globalCompositeOperation = "source-atop";
      g.fillStyle = "rgba(69,75,72,0.72)"; g.fillRect(0, 0, n, n);
      g.globalCompositeOperation = "source-over";
    }
    g.fillStyle = C.socket;
    for (const e of (SOCKETS[key] || [])){
      g.beginPath(); g.ellipse(e.x, e.y, e.rx, e.ry, 0, 0, 6.2832); g.fill();
    }
  });
  return { base:c, lit:null, rim:null };
}

/* Preloaded on boot. The loading state is per species and all-or-nothing: a key
   only appears in SPR.art once all six of its poses have resolved, so nothing ever
   renders half-sprite, half-code, and there is no frame where a pose is missing.
   Until then, and for any species that fails to load, drawAnimal takes the code
   path. Boot is never blocked on it. */
function loadSprites(){
  for (const key of SPRITE_SPECIES){
    const img = {};
    let left = POSES.length, ok = true;
    const settle = () => {
      if (--left > 0 || !ok) return;
      const art = {};
      for (const p of POSES) art[p] = derivePose(img[p]);
      art.hollow = deriveHollow(img.sit, key);
      SPR.art[key] = art;
    };
    for (const pose of POSES){
      const src = spriteSrc(key, pose), im = new Image();
      im.onload  = () => { img[pose] = im; settle(); };
      im.onerror = () => {
        /* Falling back is correct, but doing it silently makes "why is my species
           still code art" undiagnosable. Say it once, and name the usual cause. */
        if (ok) console.warn("sprites: " + key + " stays on code art, could not load "
          + (src.slice(0, 5) === "data:" ? "embedded " + pose : src)
          + (src.slice(0, 5) !== "data:" && location.protocol === "file:"
             ? " — this page was opened over file://, which cannot reach assets/."
               + " Run tools/embed_sprites.py to bake it in, or serve the folder."
             : ""));
        ok = false; settle();
      };
      im.src = src;
    }
  }
}

/* One timer, one index swap. The id offset keeps two walkers off each other's beat. */
function poseOf(a, time){
  if (a.state === "hollow") return "hollow";
  if (a.state === "walkin" || a.state === "walkout")
    return (Math.floor((time + a.id * 0.11) / WALK_S) & 1) ? "walk_b" : "walk_a";
  const weary = a.deaths >= 2;
  if (a.state === "rest"){                        // seated: alert only while something waits on them
    const alert = !!(a.find || a.choice) || S.nudge === a.id;
    if (!alert) return "rest";
    return weary ? "weary" : "sit";
  }
  return weary ? "weary" : "stand";               // standing, idle, not at a seat
}

function artOf(a, time){
  const set = SPR.art[a.sp];
  return set ? set[poseOf(a, time)] : null;
}

/* Where the sprite canvas lands in world space. Build variation scales it the same
   way it scales the code figure, and the baseline stays pinned to the feet. */
function sprRect(x, y, b){
  const k = FIG.total / SPR_GEO.fig, sx = k * b.w, sy = k * b.h, n = SPR_GEO.size;
  return { dx: x - (n / 2) * sx, dy: y - SPR_GEO.baseline * sy, dw: n * sx, dh: n * sy };
}

/* The art is drawn facing right, so anything travelling left is mirrored. Mirroring
   happens about the figure's own centre line, never the world origin, so the feet
   stay on the same pixel they were anchored to. */
function mirrored(x, draw){
  ctx.save();
  ctx.translate(2 * x, 0); ctx.scale(-1, 1);
  draw();
  ctx.restore();
}

function drawSpriteFigure(art, x, y, b, hollow, flip){
  const r = sprRect(x, y, b);
  const paint = () => {
    if (hollow){                                  // slumped, leaning toward the fire it lost
      ctx.save();
      ctx.translate(x, y); ctx.rotate((x > fx ? 1 : -1) * 0.06); ctx.translate(-x, -y);
      ctx.drawImage(art.base, r.dx, r.dy, r.dw, r.dh);
      ctx.restore();
      return;
    }
    ctx.drawImage(art.base, r.dx, r.dy, r.dw, r.dh);
  };
  if (flip) mirrored(x, paint); else paint();
}

/* The same proximity and flame terms the code-drawn rim uses, at the same strengths,
   so a sprite sitting beside a code figure is lit by the same fire. */
function spriteRim(art, x, y, b, cy, flip){
  const f = firePull(x, cy);
  if (!f || !art.lit) return;
  /* The overlays are cut from the unmirrored art, so under a mirror the crescent
     has to be taken from the other side to still come out on the side facing the
     fire. Get this wrong and the rim lights the edge turned away from the flame. */
  const i = ((f.side > 0) !== !!flip) ? 1 : 0;
  const r = sprRect(x, y, b), k = f.near * f.life;
  const paint = () => {
    ctx.globalAlpha = 0.04 + 0.14 * k;
    ctx.drawImage(art.lit[i], r.dx, r.dy, r.dw, r.dh);
    ctx.globalAlpha = 0.10 + 0.20 * k;
    ctx.drawImage(art.rim[i], r.dx, r.dy, r.dw, r.dh);
    ctx.globalAlpha = 1;
  };
  if (flip) mirrored(x, paint); else paint();
}

function drawAnimal(a, x, y, opts){
  const o = opts || {};
  const sp = spOf(a), b = BUILDS[a.build || 0];
  const hollow = a.state === "hollow";
  const garb = hollow ? mix(a.garb || sp.body, "#6a6a68", 0.78) : (a.garb || "#c03a2f");
  const body = hollow ? C.hollow : sp.body;
  const plate = hollow ? "#2a2830" : sp.plate;
  const dir = o.dir || 1;
  const drop = hollow ? 5 : 0;                      // head forward, body lower, legs bent
  const hw = FIG.head.w * b.w, hh = FIG.head.h * b.h;
  const bw = FIG.body.w * b.w, bh = FIG.body.h;
  const gear = a.gear || {};

  contact(x, y + 2, hw * 0.52, hollow ? 0.5 : 0.42);

  /* The anchors below are shared by both paths, so gear lands in the same place
     whether the figure underneath it is a sprite or a stack of shapes. */
  const bodyY = y - FIG.leg.h - bh / 2 + drop * 0.5;
  const hy = y - FIG.leg.h - bh - hh / 2 + drop;
  const art = artOf(a, o.time || 0);

  const armour = () => {                            // armour widens the shoulders
    if (!gear.armour) return;
    shape(()=>ctx.ellipse(x, bodyY - bh * 0.3, bw * 0.72, bh * 0.5, 0, 0, 6.2832),
          mix(garb, C.relief, 0.55), LW.outer);
  };
  const pack = () => {                              // a pack, a bedroll: travellers
    if (hollow) return;
    shape(()=>ctx.ellipse(x - dir * (bw * 0.52), bodyY, 5.5, bh * 0.55, dir * 0.2, 0, 6.2832),
          mix(garb, OUTLINE, 0.4), LW.outer);
  };

  if (art){
    const flip = dir < 0;                           // they face the way they are going
    pack();                                         // behind them, so it reads as carried
    drawSpriteFigure(art, x, y, b, hollow, flip);
    armour();
    if (!hollow) spriteRim(art, x, y, b, hy, flip);
    drawGear(x, y, dir, hw, bh, bodyY, gear);
    return;
  }

  const legY = y - FIG.leg.h / 2 + drop * 0.3;      // 12. legs first, behind the body
  for (const sx of [-1, 1])
    shape(()=>{ ctx.rect(x + sx * (FIG.leg.gap / 2) - (sx > 0 ? 0 : FIG.leg.w), legY - FIG.leg.h / 2,
                         FIG.leg.w, FIG.leg.h + (hollow ? -2 : 0)); }, mix(body, OUTLINE, 0.25), LW.outer);

  shape(()=>{ ctx.moveTo(x - bw / 2, bodyY - bh / 2); ctx.lineTo(x + bw / 2, bodyY - bh / 2);
    ctx.lineTo(x + bw / 2 + 1, bodyY + bh / 2); ctx.lineTo(x - bw / 2 - 1, bodyY + bh / 2);
    ctx.closePath(); }, garb, LW.outer);            // the garment is the body block
  armour();
  pack();

  if (sp.key === "cat"){
    ear(x - hw * 0.30, hy - hh * 0.42, 12 * b.w, 13, -0.12, body);
    ear(x + hw * 0.30, hy - hh * 0.42, 12 * b.w, 13, 0.12, body);
  } else if (sp.key === "rabbit"){
    ear(x - hw * 0.24, hy - hh * 0.44, 9 * b.w, 24, -0.14, body);
    ear(x + hw * 0.24, hy - hh * 0.44, 9 * b.w, 24, 0.14, body);
  } else if (sp.key === "goat"){
    for (const sx of [-1, 1])
      shape(()=>{ ctx.moveTo(x + sx * hw * 0.34, hy - hh * 0.40);
        ctx.quadraticCurveTo(x + sx * hw * 0.86, hy - hh * 0.86, x + sx * hw * 0.74, hy - hh * 0.12);
        ctx.quadraticCurveTo(x + sx * hw * 0.62, hy - hh * 0.62, x + sx * hw * 0.30, hy - hh * 0.28);
        ctx.closePath(); }, "#5c5346", LW.outer);
  }
  rrect(x, hy, hw, hh, 12, body, LW.outer);         // the head, generously cornered
  if (sp.key === "dog")
    for (const sx of [-1, 1])
      shape(()=>ctx.ellipse(x + sx * hw * 0.50, hy + hh * 0.10, 6.5 * b.w, 11, sx * 0.25, 0, 6.2832),
            mix(body, OUTLINE, 0.18), LW.outer);

  facePlate(x, hy + hh * 0.10, hw, hh, sp.key, plate);
  if (sp.key === "crow")                            // the beak sits below the eyes, not through them
    shape(()=>{ ctx.moveTo(x - 3.5, hy + hh * 0.30); ctx.lineTo(x + 3.5, hy + hh * 0.30);
      ctx.lineTo(x, hy + hh * 0.56); ctx.closePath(); }, "#c9a06a", LW.outer);
  drawEyes(x, hy + hh * (sp.key === "frog" ? 0.02 : 0.04), hw,
           hollow ? "hollow" : a.deaths >= 2 ? "weary" : "normal", plate);

  drawGear(x, y, dir, hw, bh, bodyY, gear);
  if (!hollow) rimLight(x, hy, hw, hh, 12);
}

/* In front of the figure on both paths, and identical on both. */
function drawGear(x, y, dir, hw, bh, bodyY, gear){
  if (gear.weapon){                                 // scavenged, and too big for them
    const g = gear.weapon, len = g.rarity === "rare" ? 34 : g.rarity === "fine" ? 28 : 22;
    ctx.save(); ctx.translate(x + dir * (hw * 0.46), y - FIG.leg.h - bh * 0.4); ctx.rotate(dir * 0.22);
    shape(()=>ctx.rect(-2.5, -len, 5, len), g.cursed ? C.cursed : C.relief, LW.outer);
    ctx.restore();
  }
  if (gear.trinket){
    const g = gear.trinket;
    const col = g.cursed ? C.cursed : g.rarity === "rare" ? C.rare : g.rarity === "fine" ? "#9a8f6a" : "#6f6a5c";
    const gl = ctx.createRadialGradient(x, bodyY, 0, x, bodyY, 10);
    gl.addColorStop(0, col); gl.addColorStop(1, "rgba(0,0,0,0)");
    ctx.globalAlpha = 0.9; ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(x, bodyY, 10, 0, 6.2832); ctx.fill(); ctx.globalAlpha = 1;
    circle(x, bodyY, 2.4, col, LW.detail);
  }
}

function drawAdventurer(a, time){
  if (S.nudge === a.id && a.state === "rest"){    // the only attention-directing thing in the game
    const pulse = 0.5 + 0.5 * Math.sin(time * 2.6);
    const g = ctx.createRadialGradient(a.x, a.y - 24, 6, a.x, a.y - 24, 46);
    g.addColorStop(0, "rgba(255,233,184," + (0.20 + 0.16 * pulse).toFixed(3) + ")");
    g.addColorStop(1, "rgba(255,233,184,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(a.x, a.y - 24, 46, 0, 6.2832); ctx.fill();
  }
  if (a.state === "hollow"){ drawAnimal(a, a.x, a.y, { seated:true, dir:1, time }); }
  else {
    const rest = a.state === "rest";
    const bob = rest ? Math.sin(time * 1.6 * (a.rate || 1)) * 1.2
                     : Math.sin(a.bob) * 2.2;        // 11. nothing synchronised
    drawAnimal(a, a.x, a.y + bob, { seated:rest, dir:a.dir || 1, time,
                                    wag:Math.sin(time * 1.1 * (a.rate || 1) + a.id) * 3 });
  }
  const sp = spOf(a), lift = sp.key === "rabbit" ? 16 : sp.key === "cat" || sp.key === "goat" ? 9 : 0;
  const top = a.y - (a.state === "rest" ? 52 : 58) - lift;
  /* The scene carries no text. Marks only, and only where a decision waits. */
  if (a.find || a.choice) circle(a.x - 16, top, 5.5, C.rare, LW.outer);
  if (a.shallow) circle(a.x + 16, top, 4.5, C.relief, LW.outer);
  if (a.state === "hollow"){                        // the only countdown in the game
    const left = 1 - Math.min(1, (a.hollowT || 0) / hollowWindow());
    const cy = a.y + 5, rx = 28, ry = 10;           // on the ground, never across the figure
    ctx.save();
    ctx.strokeStyle = "rgba(20,16,20,0.55)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(a.x, cy, rx, ry, 0, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = C.deadCore; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.globalAlpha = 0.95;
    ctx.beginPath(); ctx.ellipse(a.x, cy, rx, ry, 0, -1.5708, -1.5708 + left * 6.2832);
    ctx.stroke();
    ctx.restore();
  }
  drawPips(a.x, a.y + 16, a.deaths, hollowAt(a), a.state === "hollow");
}


function drawPips(x, y, deaths, cap, hollow){
  if (!revealed("pips")) return;
  const gap = 9, x0 = x - (cap - 1) * gap / 2;
  for (let i = 0; i < cap; i++)
    circle(x0 + i*gap, y, 3.4, i < deaths ? (hollow ? "#454b48" : "#f2682c") : "#2a2136", 2.5);
}

function drawBlacksmith(time, px, py){
  const x = px != null ? px : fx + RING_R * 0.86;
  const y = py != null ? py : fy + 26, swing = Math.sin(time*5.2);
  rrect(x + 34, y - 4, 26, 9, 4, "#2b3136", 4);
  shape(()=>{ ctx.moveTo(x+26, y-8); ctx.lineTo(x+42, y-8); ctx.lineTo(x+39, y-18);
              ctx.lineTo(x+29, y-18); ctx.closePath(); }, "#3d444a", 4);
  shape(()=>{ ctx.moveTo(x+22, y-18); ctx.lineTo(x+46, y-18); ctx.lineTo(x+46, y-26);
