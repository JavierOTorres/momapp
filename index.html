<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#15101c">
<title>Sanctuary</title>
<style>
  :root{
    --bg:#15101c; --panel:#1e1729; --panel-2:#261d33; --ink:#0c0812;
    --line:#0c0812; --text:#f2e6d8; --dim:#9a8aa8;
    --ember:#ff9d3d; --ember-2:#ff5f3d; --gold:#ffd06b;
    --good:#7bd88f; --cold:#7fa8d0; --disabled:#3a3046;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:var(--bg);color:var(--text);
    font-family:ui-rounded,"Avenir Next Rounded","Trebuchet MS",Verdana,system-ui,sans-serif;
    font-weight:700;letter-spacing:.02em;
    display:flex;justify-content:center;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;
  }
  #app{
    width:100%;max-width:430px;height:100dvh;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* ---------- top bar ---------- */
  #top{
    flex:0 0 auto;padding:10px 16px 6px;
    display:flex;align-items:center;justify-content:space-between;
    background:var(--panel);
  }
  #soulWrap{display:flex;align-items:baseline;gap:8px}
  #souls{font-size:32px;line-height:1;color:var(--gold);text-shadow:0 2px 0 var(--ink)}
  #soulLabel{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.14em}
  #rate{font-size:11px;color:var(--dim);text-align:right;line-height:1.5}
  #rate b{display:block;font-size:16px;color:var(--text)}
  #bookBtn{
    flex:0 0 auto;margin-left:12px;width:38px;height:38px;border-radius:11px;
    border:3px solid var(--line);background:var(--panel-2);font-size:16px;line-height:1;
  }
  #book{
    position:fixed;inset:0;z-index:20;background:#15101c;
    display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  #book[hidden]{display:none}
  .bookTop{
    display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:3px solid var(--line);
    background:var(--panel);
  }
  .bookTop h3{margin:0;font-size:15px;letter-spacing:.06em}
  .bookTop p{margin:3px 0 0;font-size:11px;font-weight:600;color:var(--dim);font-style:italic}
  #bookList{flex:1 1 auto;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px}
  #pop{
    flex:0 0 auto;display:flex;gap:14px;padding:0 16px 9px;
    background:var(--panel);border-bottom:3px solid var(--line);
    font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em;
  }
  #pop span{display:flex;align-items:center;gap:5px}
  #pop i{width:8px;height:8px;border-radius:9px;display:block;border:2px solid var(--ink)}
  .dFire{background:var(--ember)} .dAway{background:var(--cold)} .dHollow{background:#6a6270}

  /* ---------- sanctuary ---------- */
  #stage{flex:1 1 auto;position:relative;min-height:0;background:var(--bg)}
  canvas{display:block;width:100%;height:100%}

  /* ---------- counsel card ---------- */
  #art{
    position:absolute;inset:0;z-index:6;background:rgba(15,11,22,0.96);
    display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 12px;
  }
  #art[hidden]{display:none}
  .artTop{display:flex;align-items:center;gap:10px;width:100%}
  .artTitle{font-size:15px}
  .artSub{font-size:11px;font-weight:600;color:var(--dim);margin-top:2px}
  #artCv{
    width:240px;height:200px;flex:0 0 auto;border:3px solid var(--line);border-radius:14px;
    background:#1b1526;touch-action:none;
  }
  .artHint{font-size:11px;font-weight:600;color:var(--dim);text-align:center;margin:2px 0 6px}
  #artDust,#artTest{width:100%;display:flex;flex-direction:column;gap:6px}
  #artTest[hidden],#artDust[hidden]{display:none}
  .axis{display:flex;gap:6px}
  .axis button{
    flex:1;padding:8px 2px;border:3px solid var(--line);border-radius:10px;
    background:var(--panel-2);color:var(--text);font:inherit;font-size:11px;
  }
  .axis button.on{background:var(--gold);color:var(--ink)}
  .axis button.out{opacity:.35;text-decoration:line-through}
  .tests{display:flex;gap:6px;margin-top:2px}
  .tests button{
    flex:1;padding:9px 2px;border:3px solid var(--line);border-radius:10px;
    background:var(--panel-2);color:var(--text);font:inherit;font-size:10.5px;line-height:1.3;
  }
  .tests button:disabled{opacity:.4}
  .tests button b{display:block;color:var(--gold);font-size:11px}
  #counsel{
    position:absolute;left:10px;right:10px;bottom:10px;z-index:5;
    background:var(--panel-2);border:3px solid var(--line);border-radius:16px;
    padding:10px;box-shadow:0 8px 0 rgba(0,0,0,.35);
  }
  #counsel[hidden]{display:none}
  .cTop{display:flex;align-items:center;gap:10px}
  .cTone{flex:0 0 auto;width:26px;height:26px;border-radius:14px;border:3px solid var(--line)}
  .cTitle{font-size:14px}
  .cSub{font-size:11px;font-weight:600;color:var(--dim);margin-top:2px}
  .cClose{
    margin-left:auto;width:30px;height:30px;border-radius:10px;border:3px solid var(--line);
    background:var(--panel);color:var(--dim);font:inherit;font-size:14px;
  }
  .cOdds{
    margin:8px 0;padding:7px 9px;border-radius:11px;background:var(--panel);
    border:3px solid var(--line);font-size:11.5px;font-weight:600;color:var(--dim);line-height:1.45;
  }
  .cOdds b{font-size:15px;color:var(--text);font-weight:800}
  .cGear{display:flex;gap:6px;margin-bottom:8px}
  .cGear button{
    flex:1;padding:7px 3px;border:3px solid var(--line);border-radius:11px;
    background:var(--panel);color:var(--text);font:inherit;font-size:10px;line-height:1.3;
  }
  .cGear button i{display:block;color:var(--dim);font-style:normal;font-size:9px;letter-spacing:.08em}
  .cGear button.filled{background:var(--panel-2);color:var(--gold)}
  .cPick{
    max-height:126px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;margin-bottom:8px;
  }
  .cPick button{
    width:100%;padding:8px;border:3px solid var(--line);border-radius:10px;
    background:var(--panel);color:var(--text);font:inherit;font-size:11px;text-align:left;
  }
  .cAct{
    width:100%;padding:11px;border:3px solid var(--line);border-radius:12px;
    background:var(--cold);color:var(--ink);font:inherit;font-size:14px;
  }
  .cAct:disabled{background:var(--disabled);color:#7d7090}
  .cAct.warm{background:var(--ember)}
  .cNote{font-size:10.5px;font-weight:600;color:var(--dim);text-align:center;margin-top:6px;line-height:1.35}

  /* ---------- bottom panel ---------- */
  #bottom{
    flex:0 0 auto;height:44%;min-height:296px;
    background:var(--panel);border-top:3px solid var(--line);
    display:flex;flex-direction:column;
  }
  #tip{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:9px 12px;background:#2e2440;border-bottom:3px solid var(--line);
    font-size:12px;font-weight:700;color:var(--gold);
  }
  #tip[hidden]{display:none}
  #tip span{flex:1 1 auto;line-height:1.35}
  #tipX{
    flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:3px solid var(--line);
    background:var(--panel);color:var(--dim);font:inherit;font-size:11px;
  }
  #tabs{display:flex;flex:0 0 auto;border-bottom:3px solid var(--line)}
  .tab{
    flex:1;padding:13px 0;background:var(--panel-2);color:var(--dim);
    border:0;border-right:3px solid var(--line);
    font:inherit;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;
  }
  .tab:last-child{border-right:0}
  .tab.on{background:var(--panel);color:var(--gold);box-shadow:inset 0 -4px 0 var(--ember)}
  #list{flex:1 1 auto;overflow-y:auto;padding:11px;display:flex;flex-direction:column;gap:9px;-webkit-overflow-scrolling:touch}

  .card{
    background:var(--panel-2);border:3px solid var(--line);border-radius:14px;
    padding:10px 11px;display:flex;align-items:center;gap:11px;
  }
  .icon{
    flex:0 0 auto;width:42px;height:42px;border:3px solid var(--line);border-radius:12px;
    display:grid;place-items:center;font-size:19px;
  }
  .info{flex:1 1 auto;min-width:0}
  .name{font-size:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .lvl{flex:0 0 auto;font-size:11px;color:var(--ink);background:var(--gold);border-radius:20px;padding:2px 7px;letter-spacing:.06em}
  .desc{font-size:11.5px;font-weight:600;color:var(--dim);margin-top:3px;line-height:1.35}
  .buy{
    flex:0 0 auto;min-width:86px;padding:10px;border:3px solid var(--line);border-radius:12px;
    background:var(--ember);color:var(--ink);font:inherit;font-size:14px;
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .buy small{font-size:10px;font-weight:700;opacity:.72;letter-spacing:.1em}
  .buy:active{transform:translateY(2px)}
  .buy:disabled{background:var(--disabled);color:#7d7090;transform:none}
  .buy.done{background:var(--good);color:var(--ink)}
  .entry{
    background:var(--panel-2);border:3px solid var(--line);border-radius:14px;padding:10px 12px;
  }
  .entry h4{margin:0;font-size:13px;letter-spacing:.06em}
  .entry p{margin:5px 0 0;font-size:11.5px;font-weight:600;color:var(--dim);line-height:1.45}
  .entry.locked{opacity:.55}
  .entry.locked h4{color:var(--dim)}
  .entry.locked p{font-style:italic}
  .note{font-size:11px;font-weight:600;color:var(--dim);text-align:center;padding:2px 6px 6px;line-height:1.4}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="soulWrap"><div id="souls">0</div><div id="soulLabel">souls</div></div>
    <div id="rate"><b>0.0</b>avg / sec, last 60s</div>
    <button id="bookBtn" title="The keeper's notes">📕</button>
  </div>
  <div id="pop">
    <span><i class="dFire"></i><em id="pFire">0</em> at fire</span>
    <span><i class="dAway"></i><em id="pAway">0</em> on expedition</span>
    <span><i class="dHollow"></i><em id="pHollow">0</em> hollow</span>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="art" hidden>
      <div class="artTop">
        <div><div class="artTitle">Unidentified</div><div class="artSub"></div></div>
        <button class="cClose" id="artX">✕</button>
      </div>
      <canvas id="artCv" width="240" height="200"></canvas>
      <div id="artDust">
        <div class="artHint">Drag to wipe the grime away.</div>
        <button class="cAct" id="artToFire" disabled>To the fire</button>
      </div>
      <div id="artTest" hidden>
        <div class="axis" data-axis="slot"></div>
        <div class="axis" data-axis="rarity"></div>
        <div class="axis" data-axis="cursed"></div>
        <div class="tests">
          <button data-test="sound"></button>
          <button data-test="heat"></button>
          <button data-test="bleed"></button>
        </div>
        <button class="cAct warm" id="artName">Name it</button>
      </div>
    </div>

    <div id="counsel" hidden>
      <div class="cTop">
        <div class="cTone"></div>
        <div><div class="cTitle">Adventurer</div><div class="cSub"></div></div>
        <button class="cClose">✕</button>
      </div>
      <div class="cOdds"></div>
      <div class="cGear"></div>
      <button class="cAct"></button>
      <div class="cNote"></div>
    </div>
  </div>

  <div id="book" hidden>
    <div class="bookTop">
      <div><h3>The keeper's notes</h3><p>Kept because no one else was going to.</p></div>
      <button class="cClose" id="bookX" style="margin-left:auto">✕</button>
    </div>
    <div id="bookList"></div>
  </div>

  <div id="bottom">
    <div id="tip" hidden>
      <span>Deeper adventurers pay more, and die more.</span>
      <button id="tipX">✕</button>
    </div>
    <div id="tabs">
      <button class="tab on" data-tab="skills">Skills</button>
      <button class="tab" data-tab="build">Build</button>
    </div>
    <div id="list"></div>
    <div class="note" id="note"></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================ tuning ============================

   Deaths now scar permanently and depth halves instead of resetting,
   so dying no longer hands an adventurer their survivability back.
   DEATH_PEN is the spec's 0.10; SURV_BASE is the dial that moved.
   At 0.84 the spiral runs far too hot — first hollow at 5 minutes and
   a choked sanctuary by 11 — so base goes up, not the penalty down.
   0.98 keeps the slide legible (92% fresh, 80% at depth 4 with one
   death, 70% with two) and lands: first hollow ~7min (p90 13),
   Herbalist ~10, choke ~19, ~22 if you rekindle, and a Counsel-heavy
   player stalls past 30 without ever escaping it.                    */

const T = {
  POOL:12, SLOTS:8, AWAY:30, REST:20, WALK:62,
  SURV_BASE:0.98, SURV_SMITH:0.12, SURV_HERB:0.08, DEPTH_PEN:0.05, DEATH_PEN:0.10,
  SURV_MIN:0.15, SURV_MAX:0.92,
  HOLLOW_AT:3, HOLLOW_AT_HERB:4,
  DEPTH_PAY:0.5,
  SMITH_COST:200, HERB_COST:500, REK_BASE:150, REK_GROWTH:1.6,
  BELL_BASE:40, BELL_GROWTH:1.55,
  TRAY_CAP:6, DROP_BASE:0.12, DROP_PER_DEPTH:0.03, DROP_CAP:0.45, CURSE_RATE:0.15,
  TEST_GROWTH:1.6, TEST_BASE:{ sound:10, heat:10, bleed:24 },
  MAX_EMBERS:10, EMBER_REGEN:2
};
const SMITH_SLOTS = [1,2], HERB_SLOT = 6;

const S = {
  souls:0, lv:{flame:0, word:0, echo:0}, smith:false, herb:false, rekindles:0,
  embers:T.MAX_EMBERS, emberT:0, arriveT:0, taps:0, tab:"skills",
  pool:[], nextId:1, sel:null, tipSeen:false, notice:null, bells:0,
  seen:{ depth:false, death:false, hollow:false, artifact:false, ident:false, curse:false },
  tray:[], inv:[], lost:[], nextArt:1,
  earnLog:[], floats:[], sparks:[], says:[]
};

const ARCHIVE = [
  { name:"Souls", open:()=>true, body:
    "What they pay with. I have never asked where it comes from and they have never offered. "
    + "It buys skills, vendors, the bell, and whatever the smith and the herbalist want for their "
    + "work. It does not buy anyone back." },
  { name:"The fire", open:()=>true, body:
    "It does not need me. I tend it anyway. Stoking it by hand pulls a soul out of the embers, "
    + "ten of them at a time, and one comes back every two seconds. Early on that is most of the "
    + "money. Later it is a thing to do with my hands." },
  { name:"Expeditions", open:()=>true, body:
    "They rest twenty seconds, pay, and go down for thirty. The track on the left is how I know "
    + "where they are. The number on the marker is how deep. The pips beside it are how many "
    + "times they have already died." },
  { name:"The bell", open:()=>true, body:
    "Rung, it brings one of them straight back up. They arrive alive, no deeper than they went, "
    + "and they owe me nothing, which is the point and also the cost. It asks more of me every "
    + "time I ring it." },
  { name:"Depth", open:()=>S.seen.depth, body:
    "Every run they survive takes them one layer further down. A rest pays half again as much for "
    + "each layer, so the ones who go deepest keep this place standing. Each layer also takes five "
    + "points off their odds of coming back. Both of those things are the same sentence." },
  { name:"Deaths and scars", open:()=>S.seen.death, body:
    "Dying does not end them. It halves how deep they are and it takes ten points off their odds "
    + "for good. The red pips under a figure are how many they have taken. Nothing lifts a scar "
    + "but the rite, and the rite is not cheap." },
  { name:"Hollowing", open:()=>S.seen.hollow, body:
    "The third death does it. The fourth, if the herbalist is here. Afterwards they sit where I "
    + "put them, grey, and they do not pay and they do not leave. There are eight places at the "
    + "fire. The smith keeps two and the herbalist one. Count what is left and you will see the "
    + "shape of the end." },
  { name:"The rite of rekindling", open:()=>S.seen.hollow, body:
    "It brings one of them back from grey: no depth, no scars, no memory of it that I can see. "
    + "The price climbs every time and my income does not climb with it. I have not decided yet "
    + "whether it is mercy." },
  { name:"The vendors", open:()=>true, body:
    "The smith takes two places and gives back two souls a rest and twelve points of survival. "
    + "The herbalist takes one place, gives eight points, and buys everyone a fourth death. They "
    + "are worth their room. Everything at this fire costs room." },
  { name:"Counsel", open:()=>S.seen.depth, body:
    "Sitting with one of them tells me what they are worth and how close they are. Sending them "
    + "shallow means one layer short of where they have been: better odds, a thinner purse, and "
    + "no new ground. It is how you keep a veteran instead of spending one." },
  { name:"What they bring back", open:()=>S.seen.artifact, body:
    "Twelve times in a hundred, and three more for every layer down, one of them comes up "
    + "carrying something. It arrives filthy. The tray by the fire holds six and I have watched "
    + "a full tray turn a find into nothing." },
  { name:"Cleaning a find", open:()=>S.seen.artifact, body:
    "Wiping the grime off tells me three things: the shape of it, what it is made of, and whether "
    + "there is a mark on it. All three have lied to me before." },
  { name:"Naming a find", open:()=>S.seen.ident, body:
    "Whatever I write down is what we call it. What it does is what it always was. If I am wrong, "
    + "I find out by watching whoever trusted me enough to wear it, and after three runs the truth "
    + "is plain enough to correct the book." },
  { name:"Cursed things", open:()=>S.seen.curse, body:
    "Some of what comes up is owed on. A cursed piece does the opposite of its kind: a blade that "
    + "costs survival, plate that deepens the scar, a charm that thins the purse. Clean, it looks "
    + "exactly like the other sort." },
  { name:"What the dead leave", open:()=>S.seen.artifact, body:
    "Whatever they were wearing stays at the depth that took them. Someone who survives a run that "
    + "deep brings a piece of it up again. Whatever they were wearing when they hollowed is gone, "
    + "and I have stopped going to look." }
];

const NODES = [
  { key:"flame", name:"Kindled Flame", glyph:"🔥", base:10, growth:1.5,
    desc:()=> "+1 soul per rest.  A depth 0 rest now pays " + perRest() + "." },
  { key:"word", name:"Word of Sanctuary", glyph:"🔔", base:25, growth:1.7,
    desc:()=> "Recruits arrive 10% faster, one every " + interval().toFixed(2) +
              "s, while the pool is below " + T.POOL + "." },
  { key:"echo", name:"Soul Echo", glyph:"💀", base:50, growth:2.0,
    desc:()=> "+5% chance a rest pays double, cap 50%.  Now " + Math.round(echoChance()*100) + "%." }
];

const cost      = n => Math.floor(n.base * Math.pow(n.growth, S.lv[n.key]));
const perRest   = () => 1 + S.lv.flame + (S.smith ? 2 : 0);
const interval  = () => 5 * Math.pow(0.9, S.lv.word);
const echoChance= () => Math.min(0.5, 0.05 * S.lv.echo);
const rekCost   = () => Math.floor(T.REK_BASE * Math.pow(T.REK_GROWTH, S.rekindles));
const bellCost  = () => Math.floor(T.BELL_BASE * Math.pow(T.BELL_GROWTH, S.bells));
const away      = () => S.pool.filter(a => a.state === "away");
const hollowAt  = () => S.herb ? T.HOLLOW_AT_HERB : T.HOLLOW_AT;
const payFor    = a => Math.round(perRest() * (1 + runDepth(a) * T.DEPTH_PAY + gearEffect(a, "trinket")));
const runDepth  = a => a.shallow ? Math.max(0, a.depth - 1) : a.depth;
const survival  = (d, deaths, a) => Math.max(T.SURV_MIN, Math.min(T.SURV_MAX,
                    T.SURV_BASE + (S.smith ? T.SURV_SMITH : 0) + (S.herb ? T.SURV_HERB : 0)
                    - d * T.DEPTH_PEN - deaths * (a ? deathPenFor(a) : T.DEATH_PEN)
                    + (a ? gearEffect(a, "weapon") : 0)));
const hollows   = () => S.pool.filter(a => a.state === "hollow");
const living    = () => S.pool.filter(a => a.state !== "hollow");
const avgRate   = () => {                 // never divide by a window too short to mean anything
  const w = Math.max(20, Math.min(60, S.elapsed || 0));
  return S.earnLog.reduce((s,e)=>s+e.n, 0) / w;
};

/* ============================ canvas ============================ */

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let W = 0, H = 0, fx = 0, fy = 0;

function resize(){
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fx = W / 2; fy = H * 0.54;
}
window.addEventListener("resize", resize);
if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);

/* thick-outline shape helpers (flat vector look) */
function shape(path, fill, lw){
  ctx.beginPath(); path();
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  ctx.lineWidth = lw || 4; ctx.strokeStyle = "#0c0812";
  ctx.lineJoin = "round"; ctx.stroke();
}
function circle(x, y, r, fill, lw){ shape(()=>ctx.arc(x, y, r, 0, 6.2832), fill, lw); }
function rrect(x, y, w, h, rad, fill, lw){
  shape(()=>{ ctx.moveTo(x-w/2+rad, y-h/2);
    ctx.arcTo(x+w/2, y-h/2, x+w/2, y+h/2, rad);
    ctx.arcTo(x+w/2, y+h/2, x-w/2, y+h/2, rad);
    ctx.arcTo(x-w/2, y+h/2, x-w/2, y-h/2, rad);
    ctx.arcTo(x-w/2, y-h/2, x+w/2, y-h/2, rad); ctx.closePath(); }, fill, lw);
}
function teardrop(x, y, w, h, fill, lw){
  shape(()=>{ ctx.moveTo(x, y-h);
    ctx.bezierCurveTo(x+w, y-h*0.5, x+w*0.85, y, x, y);
    ctx.bezierCurveTo(x-w*0.85, y, x-w, y-h*0.5, x, y-h); ctx.closePath(); }, fill, lw);
}
function desat(hex){                       // a hollow keeps its hue, drained of life
  const n = parseInt(hex.slice(1), 16), r = n>>16 & 255, g = n>>8 & 255, b = n & 255;
  const l = r*0.30 + g*0.59 + b*0.11;
  const m = c => Math.round(Math.min(255, c*0.20 + l*0.52));
  return "#" + [m(r), m(g), m(b)].map(v => v.toString(16).padStart(2,"0")).join("");
}

/* ============================ the pool ============================ */

const TONES = [ ["#6f8fd6","#41598f"], ["#c86f8f","#8a3f5c"], ["#7fbf8a","#4a7d57"],
                ["#c9a45c","#8a6a34"], ["#9b7fd0","#5f4a8c"], ["#d0796a","#8c4638"],
                ["#5fbec4","#2f7d82"], ["#e0904a","#9c5a22"], ["#b96fc4","#7a3f85"],
                ["#a8c95c","#6c8a30"], ["#8894b0","#525b74"], ["#c45f5f","#832f2f"] ];
const slotUsed = new Array(T.SLOTS).fill(null);

function slotPos(i){
  const a = -Math.PI/2 + (i / T.SLOTS) * Math.PI * 2 + 0.4;
  return { x: fx + Math.cos(a) * 96, y: fy + Math.sin(a) * 44 + 6 };
}
const reserved = i => (S.smith && SMITH_SLOTS.indexOf(i) >= 0) || (S.herb && i === HERB_SLOT);
function claimSlot(a){
  for (let i = 0; i < T.SLOTS; i++){
    if (reserved(i) || slotUsed[i]) continue;
    slotUsed[i] = a; a.slot = i; return true;
  }
  return false;
}
function releaseSlot(a){ if (a.slot >= 0){ slotUsed[a.slot] = null; a.slot = -1; } }
function edgeSpawn(a){
  const left = Math.random() < 0.5;
  a.x = left ? -30 : W + 30; a.y = fy + 40 + Math.random() * 12;
  a.dir = left ? 1 : -1; a.exit = left ? W + 40 : -40;
}

function recruit(){
  const a = { id:S.nextId++, depth:0, deaths:0, shallow:false, slot:-1,
              tone:TONES[(S.nextId - 1) % TONES.length], state:"walkin", t:0,
              x:0, y:0, dir:1, exit:0, bob:Math.random() * 6, queue:0 };
  edgeSpawn(a); S.pool.push(a); return a;
}

function earn(n, x, y, doubled){
  S.souls += n;
  S.earnLog.push({ t:S.elapsed, n });
  S.floats.push({ x, y, t:0, txt:"+" + n, col: doubled ? "#ffd06b" : "#f2e6d8" });
}

function ageGear(a){
  if (!a.gear) return;
  for (const slot of A_SLOTS){
    const g = a.gear[slot];
    if (!g || !g.label) continue;
    if (++g.runs >= 3 && !sameLabel(g.label, g)){
      g.label = { slot:g.slot, rarity:g.rarity, cursed:g.cursed };
      S.notice = { txt:"It was a " + artName(g.label).toLowerCase() + " all along.", t:0 };
    }
  }
}
const sameLabel = (l, a) => l.slot === a.slot && l.rarity === a.rarity && l.cursed === a.cursed;

function sitDown(a){
  a.state = "rest"; a.t = T.REST;
  const p = slotPos(a.slot); a.x = p.x; a.y = p.y;
  if (a.recalled){                      // the bell buys their life, not their purse
    a.recalled = false;
    S.floats.push({ x:a.x, y:a.y - 26, t:0, txt:"no fee", col:"#7fa8d0" });
  } else {
    const doubled = Math.random() < echoChance();
    earn(payFor(a) * (doubled ? 2 : 1), a.x, a.y - 26, doubled);
  }
  if (a.pending){ say(a, a.pending); a.pending = null; }
  a.shallow = false;                    // the discount is spent on this rest
  for (let k = 0; k < 4; k++) sparks(a.x, a.y - 10, 0.7);
}

function resolveExpedition(a){
  const d = runDepth(a), survived = Math.random() < survival(d, a.deaths, a);
  a.shallow = false;
  ageGear(a);                             // three runs and the truth outs itself
  if (survived){
    if (a.depth === d) a.depth = d + 1;   // sent shallow: banked, not deepened
    if (a.depth === 1 && !S.tipSeen){ S.seen.depth = true; showTip(); }
    dropFor(a);
    recoverGear(a, d);
    if (Math.random() < 0.25) a.pending = oneOf(d >= 5 ? LINES.deepRet : LINES.ret);
  } else {
    a.deaths++; S.seen.death = true;
    if (a.deaths === 1) a.pending = oneOf(LINES.firstDeath);
    const hollowing = a.deaths >= hollowAt();
    loseGear(a, d, hollowing);            // dropped at depth, unless they hollow — then it burns
    a.depth = Math.floor(a.depth / 2);    // a setback, not a reset — the scar stays
    if (hollowing){ goHollow(a); return; }
  }
  edgeSpawn(a); a.state = "walkin";
}

function goHollow(a){                     // the thing the whole system exists to produce
  a.state = "hollow"; a.t = 0; S.seen.hollow = true;
  loseGear(a, 0, true);                   // whatever they carried burns with them
  releaseSlot(a);
  if (claimSlot(a)){ const p = slotPos(a.slot); a.x = p.x; a.y = p.y; }
  else { a.x = fx; a.y = fy + 78; }
  const first = !S.everHollowed; S.everHollowed = true;
  say(a, oneOf(first ? LINES.firstHollow : LINES.hollow));
  S.notice = { txt:"Someone has gone hollow.", t:0 };
  for (let k = 0; k < 22; k++)
    S.sparks.push({ x:a.x + (Math.random()-0.5)*18, y:a.y - 14, vx:(Math.random()-0.5)*44,
                    vy:-30-Math.random()*40, t:0, life:1.1 + Math.random()*0.7, col:"#8e86a0" });
  if (S.sel === a.id) showCounsel(a);
}

function updatePool(dt){
  const speed = 62;
  let spill = 0;                           // a hollow squats the next slot that frees
  for (const h of S.pool){
    if (h.state !== "hollow") continue;
    if (h.slot < 0 && claimSlot(h)){ const p = slotPos(h.slot); h.x = p.x; h.y = p.y; }
    if (h.slot < 0){                       // no room left: they slump outside the ring
      h.x = fx + 108 - (spill++) * 38; h.y = fy + 78;
    }
  }
  for (const a of S.pool){
    if (a.state === "hollow") continue;
    a.bob += dt * 9;
    if (a.state === "walkin"){
      if (a.slot < 0 && !claimSlot(a)){ a.state = "wait"; a.t = 0.4; continue; }
      const p = slotPos(a.slot), dx = p.x - a.x, dy = p.y - a.y, d = Math.hypot(dx, dy);
      if (d < 3) sitDown(a);
      else { a.x += dx/d * speed * dt; a.y += dy/d * speed * dt; a.dir = dx >= 0 ? 1 : -1; }
    } else if (a.state === "wait"){
      const qi = S.pool.filter(o => o.state === "wait").indexOf(a);
      const tx = fx - 108 + qi * 40, ty = fy + 62;
      a.x += (tx - a.x) * Math.min(1, dt * 3); a.y += (ty - a.y) * Math.min(1, dt * 3);
      a.t -= dt;
      if (a.t <= 0){ a.t = 0.4; if (claimSlot(a)) a.state = "walkin"; }
    } else if (a.state === "rest"){
      a.t -= dt;
      if (a.t <= 0){ releaseSlot(a); a.state = "walkout"; if (S.sel === a.id) closeCounsel(); }
    } else if (a.state === "walkout"){
      a.x += Math.sign(a.exit - a.x) * speed * dt;
      a.y += (fy + 46 - a.y) * dt;
      a.dir = Math.sign(a.exit - a.x);
      if (Math.abs(a.x - a.exit) < 6){
        a.state = "away"; a.t = T.AWAY;
        a.events = [0.22 + Math.random()*0.12, 0.5 + Math.random()*0.12, 0.74 + Math.random()*0.12]
          .slice(0, 2 + (Math.random() < 0.5 ? 1 : 0))
          .map(at => ({ at, icon: EVENTS[(Math.random()*EVENTS.length)|0], fired:false }));
        a.flash = null;
      }
    } else if (a.state === "away"){
      a.t -= dt;
      const prog = 1 - a.t / T.AWAY;
      if (a.events) for (const e of a.events)
        if (!e.fired && prog >= e.at){ e.fired = true; a.flash = { icon:e.icon, t:0 }; }
      if (a.flash && (a.flash.t += dt) > 2) a.flash = null;
      if (a.t <= 0) resolveExpedition(a);
    }
  }
}

/* ============================ artifacts ============================ */

const A_SLOTS = ["weapon", "armour", "trinket"];
const RARITIES = ["common", "fine", "rare"];
const EFFECT = { weapon:{ common:0.04, fine:0.08, rare:0.14 },
                 armour:{ common:0.03, fine:0.05, rare:0.08 },
                 trinket:{ common:0.15, fine:0.30, rare:0.55 } };
const APPARENT = { common:1, fine:1.8, rare:3 };
const SLOT_NAME = { weapon:"Weapon", armour:"Armour", trinket:"Trinket" };
const RARITY_NAME = { common:"Common", fine:"Fine", rare:"Rare" };

const effectOf = a => EFFECT[a.slot][a.rarity] * (a.cursed ? -1 : 1);
const testCost = (a, kind) =>
  Math.round(T.TEST_BASE[kind] * APPARENT[a.clue.rarity] * Math.pow(T.TEST_GROWTH, a.tests));
const artName = l => l ? (RARITY_NAME[l.rarity] + " " + SLOT_NAME[l.slot] + (l.cursed ? " (cursed)" : ""))
                       : "Unidentified";

function rollRarity(){ const r = Math.random(); return r < 0.60 ? "common" : r < 0.90 ? "fine" : "rare"; }
function lie(truth, pool, p){                 // clues point at the truth, usually
  if (Math.random() < p) return truth;
  const others = pool.filter(o => o !== truth);
  return others[(Math.random() * others.length) | 0];
}

function makeArtifact(depth){
  const slot = A_SLOTS[(Math.random()*3)|0], rarity = rollRarity();
  const cursed = Math.random() < T.CURSE_RATE;
  return {
    id: S.nextArt++, slot, rarity, cursed, depth,
    clue: { slot: lie(slot, A_SLOTS, 0.75), rarity: lie(rarity, RARITIES, 0.70),
            cursed: Math.random() < 0.75 ? cursed : !cursed },
    grid: null, cleared: 0, sites: { form:false, material:false, glyph:false },
    tests: 0, elim: { slot:[], rarity:[], cursed:[] },
    label: null, runs: 0, wornBy: null
  };
}

function dropFor(a){
  const chance = Math.min(T.DROP_CAP, T.DROP_BASE + a.depth * T.DROP_PER_DEPTH);
  if (Math.random() >= chance) return;
  if (S.tray.length >= T.TRAY_CAP){
    S.notice = { txt:"Something came back. The tray was full.", t:0 };
    return;
  }
  S.tray.push(makeArtifact(a.depth));
  S.seen.artifact = true;
  S.notice = { txt:"They brought something back.", t:0 };
}

/* gear a given adventurer is wearing, by the slot it was filed under */
const gearIn = (a, slot) => (a.gear && a.gear[slot]) || null;
function gearEffect(a, slot){ const g = gearIn(a, slot); return g ? effectOf(g) : 0; }
const deathPenFor = a => Math.max(0, T.DEATH_PEN - gearEffect(a, "armour"));

function loseGear(a, depth, destroy){
  if (!a.gear) return;
  for (const slot of A_SLOTS){
    const g = a.gear[slot];
    if (!g) continue;
    g.wornBy = null;
    if (!destroy) S.lost.push({ art:g, depth });
  }
  a.gear = null;
}

function recoverGear(a, depth){               // a deep enough run finds what the dead dropped
  const i = S.lost.findIndex(l => l.depth <= depth);
  if (i < 0) return;
  const found = S.lost.splice(i, 1)[0];
  S.inv.push(found.art);
  S.notice = { txt:"Recovered from depth " + found.depth + ": " + artName(found.art.label), t:0 };
}

function stripGeom(){ return { x:26, top:58, bottom: H - 76 }; }
function markerPos(a, i){
  const g = stripGeom(), p = Math.min(1, Math.max(0, 1 - a.t / T.AWAY));
  return { x: g.x + (i % 2 ? 9 : -9), y: g.top + p * (g.bottom - g.top) };
}

function ringBell(a){
  const c = bellCost();
  if (S.souls < c){
    S.floats.push({ x:fx, y:fy - 40, t:0, txt:"need " + fmt(c), col:"#9a8aa8" });
    return false;
  }
  S.souls -= c; S.bells++;
  a.recalled = true;                      // home safe, no deeper, and nothing to show for it
  a.events = null; a.flash = null;
  edgeSpawn(a); a.state = "walkin";
  S.notice = { txt:"Recalled. Alive, and no richer.", t:0 };
  for (let k = 0; k < 12; k++)
    S.sparks.push({ x:a.x, y:a.y - 12, vx:(Math.random()-0.5)*36, vy:-26-Math.random()*30,
                    t:0, life:0.9, col:"#7fa8d0" });
  refresh(); return true;
}

function sparks(x, y, life){
  S.sparks.push({ x, y, vx:(Math.random()-0.5)*26, vy:-24-Math.random()*30, t:0, life: life + Math.random()*0.6 });
}

/* ============================ drawing ============================ */

function drawGround(){
  shape(()=>ctx.ellipse(fx, fy + 24, Math.min(W*0.46, 178), 74, 0, 0, 6.2832), "#241a30", 5);
  shape(()=>ctx.ellipse(fx, fy + 18, Math.min(W*0.30, 116), 46, 0, 0, 6.2832), "#2c2038", 4);
}

function drawFire(time){
  const pulse = 1 + Math.sin(time*3.4)*0.06 + flare;
  const g = ctx.createRadialGradient(fx, fy - 12, 4, fx, fy - 12, 126*pulse);
  g.addColorStop(0, "rgba(255,157,61,0.34)"); g.addColorStop(1, "rgba(255,157,61,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(fx, fy - 12, 126*pulse, 0, 6.2832); ctx.fill();

  ctx.save(); ctx.translate(fx, fy + 8);
  ctx.rotate(-0.42); rrect(0, 0, 56, 13, 6, "#4a3324", 4);
  ctx.rotate(0.84);  rrect(0, 0, 56, 13, 6, "#5a3f2c", 4);
  ctx.restore();

  const w1 = 26*pulse, h1 = 62*pulse + Math.sin(time*5.1)*4;
  teardrop(fx + Math.sin(time*2.2)*2, fy - 2, w1, h1, "#ff5f3d", 5);
  teardrop(fx + Math.sin(time*3.7)*3, fy - 4, w1*0.62, h1*0.66, "#ff9d3d", 4);
  teardrop(fx + Math.sin(time*4.9)*2, fy - 5, w1*0.30, h1*0.36, "#ffd06b", 3);
}

/* one hooded figure: trapezoid cloak, hood, pale face */
function figure(x, y, h, w, cloak, hood, dir, face){
  shape(()=>ctx.ellipse(x, y + 5, w*0.6, 4.5, 0, 0, 6.2832), "rgba(0,0,0,0.32)", 0.001);
  shape(()=>{ ctx.moveTo(x - w*0.40, y - h); ctx.lineTo(x + w*0.40, y - h);
              ctx.lineTo(x + w*0.52, y + 1); ctx.quadraticCurveTo(x, y + 7, x - w*0.52, y + 1);
              ctx.closePath(); }, cloak, 4);
  circle(x, y - h - 2, w*0.50, hood, 4);
  circle(x + dir*w*0.16, y - h - 1, w*0.30, face || "#e8cfae", 3);
}

function drawPips(x, y, deaths, cap, hollow){
  const gap = 9, x0 = x - (cap - 1) * gap / 2;
  for (let i = 0; i < cap; i++)
    circle(x0 + i*gap, y, 3.4, i < deaths ? (hollow ? "#6a6270" : "#ff5f3d") : "#2a2136", 2.5);
}

function drawAdventurer(a, time){
  if (a.state === "hollow"){
    const x = a.x, y = a.y;
    ctx.save(); ctx.translate(x, y); ctx.rotate(0.13); ctx.translate(-x, -y);
    figure(x, y, 13, 21, desat(a.tone[0]), desat(a.tone[1]), 1, "#544d5e");
    ctx.restore();
    drawPips(x, y + 14, a.deaths, Math.max(a.deaths, hollowAt()), true);
    return;
  }
  const rest = a.state === "rest", bob = rest ? 0 : Math.sin(a.bob) * 1.8;
  const y = a.y + bob;
  if (rest){                                        // the fire's warmth on a living guest
    const g = ctx.createRadialGradient(a.x, y - 14, 2, a.x, y - 14, 26);
    g.addColorStop(0, "rgba(255,157,61,0.20)"); g.addColorStop(1, "rgba(255,157,61,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(a.x, y - 14, 26, 0, 6.2832); ctx.fill();
  }
  figure(a.x, y, rest ? 17 : 22, 22, a.tone[0], a.tone[1], a.dir || 1);
  const top = y - (rest ? 17 : 22) - 15;
  if (a.depth > 0){
    rrect(a.x, top, 24, 15, 7, "#0c0812", 2);
    ctx.font = "800 10px ui-rounded, system-ui, sans-serif"; ctx.textAlign = "center";
    ctx.fillStyle = "#ffd06b"; ctx.fillText("D" + a.depth, a.x, top + 4);
  }
  if (a.shallow){
    circle(a.x + 17, top + 1, 7, "#7fa8d0", 3);
    ctx.font = "800 9px ui-rounded, system-ui, sans-serif"; ctx.textAlign = "center";
    ctx.fillStyle = "#0c0812"; ctx.fillText("↓", a.x + 17, top + 4);
  }
  drawPips(a.x, y + 14, a.deaths, hollowAt(), false);   // how close they are, at a glance
}

  rrect(x - 1, y - 10, 17, 19, 6, "#4d6749", 3);             // apron
  circle(x + 10, y - 27, 5.5, "#9bd08a", 3);                 // sprig at the hood
  if (grind > 0.97) S.sparks.push({ x:x-25, y:y-22, vx:(Math.random()-0.5)*20, vy:-18, t:0, life:0.5 });
}

function drawStrip(time){
  const g = stripGeom(), list = away(), h = g.bottom - g.top;
  rrect(g.x, (g.top + g.bottom)/2 - 16, 46, h + 56, 22, "rgba(20,15,28,0.82)", 3);

  ctx.font = "800 9px ui-rounded, system-ui, sans-serif"; ctx.textAlign = "center";
  ctx.fillStyle = "#9a8aa8"; ctx.fillText("BELOW", g.x, g.top - 26);
  const c = bellCost(), can = S.souls >= c;
  ctx.font = "800 11px ui-rounded, system-ui, sans-serif";
  ctx.fillStyle = can ? "#ffd06b" : "#5a4f6b";
  ctx.fillText("🔔 " + fmt(c), g.x, g.top - 11);

  shape(()=>{ ctx.moveTo(g.x, g.top); ctx.lineTo(g.x, g.bottom); }, null, 3);
  for (let i = 0; i <= 4; i++){                       // depth stages down the track
    const y = g.top + (i/4) * h;
    shape(()=>{ ctx.moveTo(g.x - 7, y); ctx.lineTo(g.x + 7, y); }, null, 2.5);
  }
  if (!list.length){
    ctx.font = "700 9px ui-rounded, system-ui, sans-serif"; ctx.fillStyle = "#5a4f6b";
    ctx.fillText("empty", g.x, (g.top + g.bottom)/2);
  }
  list.forEach((a, i) => {
    const p = markerPos(a, i);
    circle(p.x, p.y, 9, a.tone[0], 3);
    ctx.font = "800 9px ui-rounded, system-ui, sans-serif"; ctx.textAlign = "center";
    ctx.fillStyle = "#0c0812"; ctx.fillText(String(a.depth), p.x, p.y + 3);
    if (a.deaths > 0){                                // scars travel with them
      for (let k = 0; k < a.deaths; k++)
        circle(p.x - 12, p.y - 6 + k*6, 2.2, "#ff5f3d", 1.8);
    }
    if (a.flash){
      const al = a.flash.t < 0.2 ? a.flash.t/0.2 : Math.min(1, (2 - a.flash.t)/0.6);
      ctx.globalAlpha = al;
      circle(p.x + 17, p.y, 8, "#2e2440", 2.5);
      ctx.font = "800 11px ui-rounded, system-ui, sans-serif"; ctx.fillStyle = "#ffd06b";
      ctx.fillText(a.flash.icon, p.x + 17, p.y + 4);
      ctx.globalAlpha = 1;
    }
  });
}

function trayGeom(){ const w = 34, gap = 6; return { w, gap, y: H - 26,
  x0: fx + 16 - (T.TRAY_CAP - 1) * (w + gap) / 2 }; }
function trayPos(i){ const g = trayGeom(); return { x: g.x0 + i * (g.w + g.gap), y: g.y }; }

function drawTray(time){
  if (!S.tray.length && !S.seen.artifact) return;
  const g = trayGeom();
  ctx.font = "800 9px ui-rounded, system-ui, sans-serif"; ctx.textAlign = "center";
  ctx.fillStyle = "#5a4f6b";
  ctx.fillText("UNIDENTIFIED  " + S.tray.length + "/" + T.TRAY_CAP, fx + 16, g.y - 24);
  for (let i = 0; i < T.TRAY_CAP; i++){
    const p = trayPos(i), art = S.tray[i];
    rrect(p.x, p.y, g.w, g.w, 10, art ? "#3a2c4a" : "#221a2e", 3);
    if (!art) continue;
    const bob = Math.sin(time*2 + i) * 1.2;
    shape(()=>{ ctx.moveTo(p.x - 8, p.y + 7 + bob); ctx.lineTo(p.x, p.y - 9 + bob);
                ctx.lineTo(p.x + 8, p.y + 7 + bob); ctx.closePath(); }, "#5c5468", 2.5);
    ctx.fillStyle = "#9a8aa8"; ctx.font = "800 10px ui-rounded, system-ui, sans-serif";
    ctx.fillText("?", p.x, p.y + 5 + bob);
  }
}

/* ============================ the keeper ============================ */

const K = { x:0, y:0, tx:0, ty:0, mode:"idle", t:0, dir:1, placed:false };

function keeperGoTo(x, y, mode){ K.tx = x; K.ty = y; K.mode = mode || "attend"; K.t = 0; }
function keeperIdle(){ keeperGoTo(fx - 62, fy + 30, "idle"); }

function updateKeeper(dt){
  if (!K.placed){ K.x = fx - 62; K.y = fy + 30; K.tx = K.x; K.ty = K.y; K.placed = true; }
  if (S.sel != null){                        // stands with whoever you are counselling
    const who = S.pool.find(o => o.id === S.sel);
    if (who && who.state !== "away") keeperGoTo(who.x + (who.x > fx ? -34 : 34), who.y + 6, "attend");
  } else if (K.mode !== "idle" && (K.t += dt) > 6) keeperIdle();
  const dx = K.tx - K.x, dy = K.ty - K.y, d = Math.hypot(dx, dy);
  if (d > 2){ const sp = Math.min(d, 54 * dt); K.x += dx/d * sp; K.y += dy/d * sp; K.dir = dx >= 0 ? 1 : -1; }
}

function drawKeeper(time){
  const walking = Math.hypot(K.tx - K.x, K.ty - K.y) > 2;
  const sway = walking ? Math.sin(time * 9) * 1.6 : Math.sin(time * 1.4) * 0.8;
  const y = K.y + sway;
  shape(()=>ctx.ellipse(K.x, K.y + 6, 17, 5, 0, 0, 6.2832), "rgba(0,0,0,0.34)", 0.001);
  shape(()=>{ ctx.moveTo(K.x - 12, y - 40); ctx.lineTo(K.x + 12, y - 40);
              ctx.lineTo(K.x + 17, y + 2); ctx.quadraticCurveTo(K.x, y + 9, K.x - 17, y + 2);
              ctx.closePath(); }, "#2b2136", 4);                      // taller, plainer robe
  rrect(K.x, y - 22, 30, 7, 3, "#e0904a", 3);                          // the one warm colour
  circle(K.x, y - 44, 13, "#241a30", 4);                               // deep hood
  circle(K.x + K.dir * 3, y - 43, 6, "#3a2c4a", 3);                    // no face to speak of
  const tend = K.mode === "tend" && !walking;                          // leans in to feed the fire
  ctx.save();
  ctx.translate(K.x + K.dir * 13, y - 26);
  ctx.rotate(K.dir * (tend ? 0.5 + Math.sin(time * 2.2) * 0.22 : 0.15 + Math.sin(time * 0.9) * 0.06));
  rrect(0, 0, 6, 34, 3, "#5a3f2c", 3);
  circle(0, -19, 4.5, "#e0904a", 3);
  ctx.restore();
}

function drawEmbers(){
  const n = T.MAX_EMBERS, gap = 15, x0 = fx + 16 - (n-1)*gap/2, y = fy + 94;
  for (let i = 0; i < n; i++)
    circle(x0 + i*gap, y, 4.5, i < Math.floor(S.embers) ? "#ff9d3d" : "#33263f", 3);
  if (S.taps < 8){
    ctx.font = "700 11px ui-rounded, system-ui, sans-serif";
    ctx.fillStyle = "#9a8aa8"; ctx.textAlign = "center";
    ctx.fillText("TAP THE FIRE", fx + 16, y + 22);
  }
}

function drawFx(dt){
  for (let i = S.sparks.length - 1; i >= 0; i--){
    const p = S.sparks[i]; p.t += dt;
    if (p.t > p.life){ S.sparks.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 14*dt;
    ctx.globalAlpha = 1 - p.t/p.life; ctx.fillStyle = p.col || "#ffd06b";
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.6, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = "center";
  for (let i = S.says.length - 1; i >= 0; i--){
    const q = S.says[i]; q.t += dt;
    if (q.t > 4.2){ S.says.splice(i, 1); continue; }
    const who = S.pool.find(o => o.id === q.id);
    if (who && who.state !== "away"){ q.x = who.x; q.y = who.y - 44; }
    ctx.globalAlpha = q.t < 0.5 ? q.t/0.5 : Math.min(1, (4.2 - q.t)/1.1);
    ctx.font = "600 11px ui-rounded, system-ui, sans-serif";
    const w = ctx.measureText(q.txt).width + 16;
    const bx = Math.max(w/2 + 4, Math.min(W - w/2 - 4, q.x));   // never off the edge
    rrect(bx, q.y, w, 20, 9, "rgba(20,15,28,0.9)", 2);
    ctx.fillStyle = "#c9bfd6"; ctx.fillText(q.txt, bx, q.y + 4);
    ctx.globalAlpha = 1;
  }
  for (let i = S.floats.length - 1; i >= 0; i--){
    const f = S.floats[i]; f.t += dt;
    if (f.t > 1.2){ S.floats.splice(i,1); continue; }
    ctx.globalAlpha = 1 - f.t/1.2;
    ctx.font = "800 16px ui-rounded, system-ui, sans-serif";
    ctx.lineWidth = 4; ctx.strokeStyle = "#0c0812";
    ctx.strokeText(f.txt, f.x, f.y - f.t*38);
    ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, f.y - f.t*38);
    ctx.globalAlpha = 1;
  }
}

/* ============================ loop ============================ */

let flare = 0, sparkT = 0, uiT = 0, last = performance.now();
S.elapsed = 0;

function frame(now){
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.25) dt = 0.25;
  S.elapsed += dt;
  const time = now / 1000;

  S.arriveT += dt;
  const iv = interval();
  let guard = 0;
  while (S.arriveT >= iv && guard++ < 20){
    S.arriveT -= iv;
    if (living().length < T.POOL) recruit();
  }

  S.emberT += dt;
  while (S.emberT >= T.EMBER_REGEN){ S.emberT -= T.EMBER_REGEN; S.embers = Math.min(T.MAX_EMBERS, S.embers + 1); }

  updatePool(dt);
  updateKeeper(dt);
  while (S.earnLog.length && S.earnLog[0].t < S.elapsed - 60) S.earnLog.shift();
  flare = Math.max(0, flare - dt * 1.6);
  sparkT += dt;
  if (sparkT > 0.16){ sparkT = 0; sparks(fx + (Math.random()-0.5)*14, fy - 18, 0.8); }

  ctx.clearRect(0, 0, W, H);
  drawGround();
  const onStage = S.pool.filter(a => a.state !== "away");
  onStage.sort((a,b) => a.y - b.y);
  const behind = onStage.filter(a => a.y <= fy), front = onStage.filter(a => a.y > fy);
  behind.forEach(a => drawAdventurer(a, time));
  if (S.smith) drawBlacksmith(time);
  if (S.herb) drawHerbalist(time);
  if (K.y <= fy) drawKeeper(time);
  drawFire(time);
  front.forEach(a => drawAdventurer(a, time));
  if (K.y > fy) drawKeeper(time);
  drawEmbers();
  drawTray(time);
  drawStrip(time);
  drawFx(dt);

  if (S.notice){
    S.notice.t += dt;
    if (S.notice.t > 4.5) S.notice = null;
    else {
      const n = S.notice;
      ctx.globalAlpha = n.t < 0.3 ? n.t / 0.3 : Math.min(1, (4.5 - n.t) / 1.2);
      ctx.font = "800 15px ui-rounded, system-ui, sans-serif"; ctx.textAlign = "center";
      ctx.lineWidth = 5; ctx.strokeStyle = "#0c0812";
      ctx.strokeText(n.txt, fx, 30); ctx.fillStyle = "#c9bfd6"; ctx.fillText(n.txt, fx, 30);
      ctx.globalAlpha = 1;
    }
  }

  uiT += dt;
  if (uiT > 0.15){ uiT = 0; refresh(); if (S.sel != null) showCounsel(byId(S.sel)); }
  requestAnimationFrame(frame);
}

/* ============================ input ============================ */

const byId = id => S.pool.find(a => a.id === id);

cv.addEventListener("pointerdown", e => {
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;

  const tg = trayGeom();                        // the tray owns its own taps
  if (Math.abs(y - tg.y) < 24){
    for (let i = 0; i < S.tray.length; i++){
      const tp = trayPos(i);
      if (Math.abs(x - tp.x) < 20){ openArtifact(S.tray[i]); return; }
    }
  }

  const list = away();                          // the strip owns its own taps
  for (let i = 0; i < list.length; i++){
    const p = markerPos(list[i], i);
    if (Math.hypot(x - p.x, y - p.y) < 20){ ringBell(list[i]); keeperGoTo(fx - 78, fy - 6, "attend"); return; }
  }

  let hit = null, best = 34;                    // a guest is worth more than the fire behind them
  for (const a of S.pool){
    if (a.state !== "rest" && a.state !== "hollow") continue;
    const d = Math.hypot(x - a.x, y - (a.y - 14));
    if (d < best){ best = d; hit = a; }
  }
  if (hit){ S.sel = hit.id; showCounsel(hit);
            keeperGoTo(hit.x + (hit.x > fx ? -34 : 34), hit.y + 6, "attend"); return; }

  if (Math.hypot(x - fx, (y - fy + 14) * 0.85) > 84){ closeCounsel(); return; }
  S.taps++;
  if (S.embers < 1){ S.floats.push({ x:fx, y:fy - 46, t:0, txt:"no embers", col:"#9a8aa8" }); return; }
  keeperGoTo(fx - 52, fy + 26, "tend");
  S.embers--; earn(1, fx + (Math.random()-0.5)*20, fy - 46, false); flare = 0.5;
  for (let k = 0; k < 5; k++) sparks(fx + (Math.random()-0.5)*16, fy - 22, 0.6);
});

/* ============================ counsel card ============================ */

const counsel = document.getElementById("counsel");
const cTone = counsel.querySelector(".cTone"), cTitle = counsel.querySelector(".cTitle");
const cSub = counsel.querySelector(".cSub"), cOdds = counsel.querySelector(".cOdds");
const cAct = counsel.querySelector(".cAct"), cNote = counsel.querySelector(".cNote");
counsel.querySelector(".cClose").addEventListener("click", closeCounsel);

function closeCounsel(){ S.sel = null; picking = null; counsel.hidden = true; }
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");

function showCounsel(a){
  if (!a){ closeCounsel(); return; }
  S.sel = a.id; counsel.hidden = false;
  const hollow = a.state === "hollow";
  cTone.style.background = hollow ? desat(a.tone[0]) : a.tone[0];
  cTitle.textContent = hollow ? "Hollowed" : "Adventurer";
  cSub.textContent = hollow ? "Nothing left to spend" : "Rests at your fire";
  cGear.hidden = hollow;
  if (hollow) cGear.innerHTML = ""; else renderGear(a);

  if (hollow){
    cOdds.innerHTML = "Holds a slot at the fire. Pays <b>nothing</b>, ever.<br>"
                    + plural(a.deaths, "death") + ", and no more expeditions.";
    const c = rekCost();
    cAct.textContent = "Rite of Rekindling — " + fmt(c);
    cAct.className = "cAct warm";
    cAct.disabled = S.souls < c;
    cAct.onclick = () => { if (rekindle(a)) closeCounsel(); };
    cNote.textContent = "Back to the pool at depth 0, their deaths forgiven.";
  } else {
    const d = runDepth(a), odds = Math.round(survival(d, a.deaths, a) * 100);
    const mult = (1 + d * T.DEPTH_PAY).toFixed(1).replace(/\.0$/, "");
    const left = hollowAt() - a.deaths;
    cOdds.innerHTML =
      "Depth " + d + ". Pays <b>" + mult + "x</b>, or " + plural(payFor(a), "soul") + ".<br>" +
      "Deaths " + a.deaths + " of " + hollowAt() + ". " +
      (left === 1 ? "One more and they hollow." : left === 2 ? "Two more and they hollow." : "Unscarred.") + "<br>" +
      "Survival <b>" + odds + "%</b>.";
    cAct.textContent = a.shallow ? "Sent shallow" : "Send shallow";
    cAct.className = "cAct";
    cAct.disabled = a.shallow || a.depth === 0;
    cAct.onclick = () => { a.shallow = true; showCounsel(a); };
    cNote.textContent = a.depth === 0 ? "Nowhere shallower to send them."
      : a.shallow ? "They come home no deeper than they left."
      : "One layer short: safer odds, a smaller purse, no new depth.";
  }
}

const cGear = counsel.querySelector(".cGear");
let picking = null;

function renderGear(a){
  cGear.innerHTML = "";
  if (picking){
    cGear.className = "cPick";
    const opts = S.inv.filter(g => !g.wornBy && g.label.slot === picking);
    const worn = gearIn(a, picking);
    if (worn){
      const b = document.createElement("button");
      b.textContent = "Take back the " + artName(worn.label).toLowerCase();
      b.onclick = () => { worn.wornBy = null; a.gear[picking] = null; S.inv.push(worn); picking = null; showCounsel(a); };
      cGear.appendChild(b);
    }
    if (!opts.length && !worn){
      const b = document.createElement("button");
      b.textContent = "Nothing identified for this slot.";
      b.disabled = true; cGear.appendChild(b);
    }
    opts.forEach(g => {
      const b = document.createElement("button");
      b.textContent = artName(g.label);
      b.onclick = () => {
        a.gear = a.gear || {};
        const old = a.gear[picking];
        if (old){ old.wornBy = null; S.inv.push(old); }
        a.gear[picking] = g; g.wornBy = a.id; g.runs = 0;
        S.inv.splice(S.inv.indexOf(g), 1);
        picking = null; showCounsel(a);
      };
      cGear.appendChild(b);
    });
    const back = document.createElement("button");
    back.textContent = "Back"; back.onclick = () => { picking = null; showCounsel(a); };
    cGear.appendChild(back);
    return;
  }
  cGear.className = "cGear";
  for (const slot of A_SLOTS){
    const g = gearIn(a, slot), b = document.createElement("button");
    b.className = g ? "filled" : "";
    b.innerHTML = "<i>" + SLOT_NAME[slot].toUpperCase() + "</i>" +
                  (g ? RARITY_NAME[g.label.rarity] + (g.label.cursed ? "!" : "") : "empty");
    b.onclick = () => { picking = slot; showCounsel(a); };
    cGear.appendChild(b);
  }
}

function rekindle(a){
  const c = rekCost();
  if (!a || a.state !== "hollow" || S.souls < c) return false;
  S.souls -= c; S.rekindles++;
  releaseSlot(a); a.deaths = 0; a.depth = 0; a.shallow = false;
  edgeSpawn(a); a.state = "walkin";
  for (let k = 0; k < 14; k++) sparks(a.x, a.y - 10, 1.1);
  render(); return true;
}

/* ==================== dusting and deduction ==================== */

const artEl = document.getElementById("art");
const artCv = document.getElementById("artCv");
const actx  = artCv.getContext("2d");
const artDust = document.getElementById("artDust");
const artTest = document.getElementById("artTest");
const artToFire = document.getElementById("artToFire");
const AW = 240, AH = 200, GRID = 20;
const SITES = { glyph:[0.50, 0.15], material:[0.32, 0.62], form:[0.70, 0.64] };
let grimeCv = null, gctx = null, open_ = null, wiping = false, pick = null, testing = 0;

function openArtifact(a){
  open_ = a; artEl.hidden = false; closeCounsel();
  if (!a.dusted){                                   // the grime only exists before it comes off
    if (!a.grimeCv){
      a.grid = a.grid || new Uint8Array(GRID * GRID);
      a.grimeCv = document.createElement("canvas");
      a.grimeCv.width = AW; a.grimeCv.height = AH;
      grimeCv = a.grimeCv; gctx = grimeCv.getContext("2d"); paintGrime();
    } else { grimeCv = a.grimeCv; gctx = grimeCv.getContext("2d"); }
  }
  pick = a.label ? Object.assign({}, a.label)
                 : { slot:a.clue.slot, rarity:a.clue.rarity, cursed:a.clue.cursed };
  artDust.hidden = a.dusted; artTest.hidden = !a.dusted;
  document.querySelector(".artTitle").textContent = a.dusted ? "At the fire" : "Unidentified";
  document.querySelector(".artSub").textContent = a.dusted
    ? "Test it, or name it and find out the hard way."
    : "Found at depth " + a.depth + ".";
  if (a.dusted) renderTest();
  drawArt();
}
function closeArtifact(){ open_ = null; artEl.hidden = true; }
document.getElementById("artX").addEventListener("click", closeArtifact);

function paintGrime(){
  gctx.globalCompositeOperation = "source-over";
  gctx.fillStyle = "#4a3f52"; gctx.fillRect(0, 0, AW, AH);
  for (let i = 0; i < 420; i++){                    // crust, so wiping reads as work
    gctx.fillStyle = ["#3d3345","#574a5e","#443a4d"][(Math.random()*3)|0];
    gctx.beginPath();
    gctx.arc(Math.random()*AW, Math.random()*AH, 3 + Math.random()*9, 0, 6.2832);
    gctx.fill();
  }
}

/* the artifact as it appears — which is not always as it is */
function drawArt(){
  const a = open_; if (!a) return;
  actx.clearRect(0, 0, AW, AH);
  const mat = { common:"#8a8494", fine:"#c9a45c", rare:"#9bd0c4" }[a.clue.rarity];
  const dark = { common:"#5e5868", fine:"#8a6a34", rare:"#5f8f86" }[a.clue.rarity];
  const cx = AW/2, cy = AH/2;
  actx.lineWidth = 4; actx.strokeStyle = "#0c0812"; actx.lineJoin = "round";
  const box = (x, y, w, h, r, fill) => {
    actx.beginPath();
    actx.moveTo(x-w/2+r, y-h/2);
    actx.arcTo(x+w/2, y-h/2, x+w/2, y+h/2, r); actx.arcTo(x+w/2, y+h/2, x-w/2, y+h/2, r);
    actx.arcTo(x-w/2, y+h/2, x-w/2, y-h/2, r); actx.arcTo(x-w/2, y-h/2, x+w/2, y-h/2, r);
    actx.closePath(); actx.fillStyle = fill; actx.fill(); actx.stroke();
  };
  if (a.clue.slot === "weapon"){                    // form is the slot tell
    actx.beginPath(); actx.moveTo(cx, cy - 74); actx.lineTo(cx + 13, cy - 46);
    actx.lineTo(cx + 13, cy + 30); actx.lineTo(cx - 13, cy + 30); actx.lineTo(cx - 13, cy - 46);
    actx.closePath(); actx.fillStyle = mat; actx.fill(); actx.stroke();
    box(cx, cy + 38, 56, 12, 5, dark);
    box(cx, cy + 60, 14, 34, 6, dark);
  } else if (a.clue.slot === "armour"){
    actx.beginPath(); actx.moveTo(cx - 44, cy - 58); actx.lineTo(cx + 44, cy - 58);
    actx.lineTo(cx + 36, cy + 34); actx.lineTo(cx, cy + 70); actx.lineTo(cx - 36, cy + 34);
    actx.closePath(); actx.fillStyle = mat; actx.fill(); actx.stroke();
    box(cx, cy - 4, 42, 60, 12, dark);
  } else {
    actx.beginPath(); actx.arc(cx, cy + 10, 46, 0, 6.2832);
    actx.arc(cx, cy + 10, 26, 0, 6.2832, true);
    actx.fillStyle = mat; actx.fill("evenodd");
    actx.beginPath(); actx.arc(cx, cy + 10, 46, 0, 6.2832); actx.stroke();
    actx.beginPath(); actx.arc(cx, cy + 10, 26, 0, 6.2832); actx.stroke();
    actx.beginPath(); actx.arc(cx, cy - 32, 14, 0, 6.2832);
    actx.fillStyle = dark; actx.fill(); actx.stroke();
  }
  const g = SITES.glyph;                            // glyph is the curse tell
  actx.save(); actx.translate(AW*g[0], AH*g[1]);
  actx.lineWidth = 3.4; actx.strokeStyle = a.clue.cursed ? "#c4506a" : "#e8dcc0";
  actx.beginPath();
  if (a.clue.cursed){ actx.moveTo(-9,-9); actx.lineTo(4,-2); actx.lineTo(-4,3); actx.lineTo(9,10); }
  else { actx.arc(0, 0, 9, 0.5, 5.4); }
  actx.stroke(); actx.restore();

  if (!a.dusted && grimeCv) actx.drawImage(grimeCv, 0, 0);
}

function cellCleared(nx, ny){
  const a = open_, gx = Math.min(GRID-1, (nx*GRID)|0), gy = Math.min(GRID-1, (ny*GRID)|0);
  return a.grid[gy*GRID + gx] === 1;
}

function wipe(e){
  const a = open_; if (!a || a.dusted) return;
  const r = artCv.getBoundingClientRect();
  const x = (e.clientX - r.left) * AW / r.width, y = (e.clientY - r.top) * AH / r.height;
  const R = 24;
  gctx.globalCompositeOperation = "destination-out";
  const grad = gctx.createRadialGradient(x, y, 0, x, y, R);   // soft edges, not a hard hole
  grad.addColorStop(0, "rgba(0,0,0,1)"); grad.addColorStop(0.65, "rgba(0,0,0,0.9)");
  grad.addColorStop(1, "rgba(0,0,0,0)");
  gctx.fillStyle = grad; gctx.beginPath(); gctx.arc(x, y, R, 0, 6.2832); gctx.fill();

  const cw = AW/GRID, ch = AH/GRID;
  for (let gy = 0; gy < GRID; gy++) for (let gx = 0; gx < GRID; gx++){
    if (a.grid[gy*GRID+gx]) continue;
    if (Math.hypot((gx+0.5)*cw - x, (gy+0.5)*ch - y) < R*0.8){ a.grid[gy*GRID+gx] = 1; a.cleared++; }
  }
  for (const k in SITES) if (!a.sites[k] && cellCleared(SITES[k][0], SITES[k][1])) a.sites[k] = true;
  for (let i = 0; i < 3; i++)
    S.sparks.push({ x:fx + (Math.random()-0.5)*10, y:fy - 10, vx:(Math.random()-0.5)*20,
                    vy:-14, t:0, life:0.4, col:"#6f6478" });
  const frac = a.cleared / (GRID*GRID);
  artToFire.disabled = frac < 0.62;
  artToFire.textContent = frac < 0.62 ? "Keep wiping — " + Math.round(frac/0.62*100) + "%" : "To the fire";
  drawArt();
}
artCv.addEventListener("pointerdown", e => { wiping = true; artCv.setPointerCapture(e.pointerId); wipe(e); });
artCv.addEventListener("pointermove", e => { if (wiping) wipe(e); });
artCv.addEventListener("pointerup",   () => { wiping = false; });
artCv.addEventListener("pointercancel", () => { wiping = false; });

artToFire.addEventListener("click", () => {
  const a = open_; if (!a) return;
  a.dusted = true; openArtifact(a);
});

/* ---- deduction ---- */
const AXES = { slot:A_SLOTS, rarity:RARITIES, cursed:[false, true] };
const axisLabel = (axis, v) => axis === "cursed" ? (v ? "Cursed" : "Blessed")
                 : axis === "slot" ? SLOT_NAME[v] : RARITY_NAME[v];

function renderTest(){
  const a = open_; if (!a) return;
  for (const axis of ["slot","rarity","cursed"]){
    const host = artTest.querySelector('.axis[data-axis="' + axis + '"]');
    host.innerHTML = "";
    for (const v of AXES[axis]){
      const b = document.createElement("button");
      b.textContent = axisLabel(axis, v);
      const out = a.elim[axis].indexOf(v) >= 0;
      b.className = (out ? "out " : "") + (pick[axis] === v ? "on" : "");
      b.disabled = out;
      b.addEventListener("click", () => { pick[axis] = v; renderTest(); });
      host.appendChild(b);
    }
  }
  const LABELS = { sound:"Sound it<br>narrows slot", heat:"Heat it<br>narrows rarity",
                   bleed:"Bleed it<br>reads the curse" };
  artTest.querySelectorAll(".tests button").forEach(b => {
    const kind = b.dataset.test, axis = kind === "sound" ? "slot" : kind === "heat" ? "rarity" : "cursed";
    const left = AXES[axis].filter(v => a.elim[axis].indexOf(v) < 0).length;
    const c = testCost(a, kind);
    b.innerHTML = LABELS[kind] + "<b>" + (left <= 1 ? "done" : fmt(c)) + "</b>";
    b.disabled = testing > 0 || left <= 1 || S.souls < c;
    b.onclick = () => runTest(a, kind, axis, c);
  });
  document.getElementById("artName").textContent =
    "Name it: " + artName(pick);
}

function runTest(a, kind, axis, cost){
  if (S.souls < cost || testing) return;
  S.souls -= cost; a.tests++; testing = 1;
  const truth = axis === "cursed" ? a.cursed : a[axis];
  const wrong = AXES[axis].filter(v => v !== truth && a.elim[axis].indexOf(v) < 0);
  artTest.querySelectorAll(".tests button").forEach(b => b.disabled = true);
  setTimeout(() => {                                 // a few seconds at the fire
    if (wrong.length) a.elim[axis].push(wrong[(Math.random()*wrong.length)|0]);
    const left = AXES[axis].filter(v => a.elim[axis].indexOf(v) < 0);
    if (left.indexOf(pick[axis]) < 0) pick[axis] = left[0];
    testing = 0; renderTest(); refresh();
  }, 1800);
  renderTest();
}

document.getElementById("artName").addEventListener("click", () => {
  const a = open_; if (!a || !a.dusted) return;
  a.label = { slot:pick.slot, rarity:pick.rarity, cursed:pick.cursed };
  a.runs = 0;
  const i = S.tray.indexOf(a); if (i >= 0) S.tray.splice(i, 1);
  S.inv.push(a);
  S.seen.ident = true; if (a.cursed) S.seen.curse = true;
  closeArtifact(); render();
});

/* ============================ ui ============================ */

const listEl  = document.getElementById("list");
const soulsEl = document.getElementById("souls");
const rateEl  = document.querySelector("#rate b");
const noteEl  = document.getElementById("note");
const popEl   = { fire:document.getElementById("pFire"), away:document.getElementById("pAway"),
                  hollow:document.getElementById("pHollow") };
const fmt = n => Math.floor(n).toLocaleString("en-US");
let rows = [];

function card(o){
  const el = document.createElement("div"); el.className = "card";
  el.innerHTML =
    '<div class="icon" style="background:' + o.tint + '">' + o.glyph + '</div>' +
    '<div class="info"><div class="name">' + o.name +
      (o.level != null ? '<span class="lvl">LV ' + o.level + '</span>' : '') +
    '</div><div class="desc"></div></div>' +
    '<button class="buy"><span></span><small>SOULS</small></button>';
  const btn = el.querySelector(".buy"), lvl = el.querySelector(".lvl");
  btn.addEventListener("click", o.onBuy);
  listEl.appendChild(el);
  rows.push(()=>{
    el.querySelector(".desc").textContent = o.desc();
    btn.querySelector("span").textContent = o.label();
    btn.disabled = !o.enabled();
    if (lvl) lvl.textContent = "LV " + o.level2();
    const done = o.done && o.done();
    btn.classList.toggle("done", !!done);
    const small = btn.querySelector("small");
    if (small) small.style.visibility = done ? "hidden" : "visible";
  });
}

const bookEl = document.getElementById("book"), bookList = document.getElementById("bookList");
function openBook(){
  bookList.innerHTML = "";
  for (const e of ARCHIVE){
    const open = e.open(), el = document.createElement("div");
    el.className = "entry" + (open ? "" : " locked");
    el.innerHTML = "<h4></h4><p></p>";
    el.querySelector("h4").textContent = e.name;
    el.querySelector("p").textContent = open ? e.body : "Nothing written here yet.";
    bookList.appendChild(el);
  }
  bookEl.hidden = false;
}
document.getElementById("bookBtn").addEventListener("click", openBook);
document.getElementById("bookX").addEventListener("click", ()=>{ bookEl.hidden = true; });

function render(){
  listEl.innerHTML = ""; rows = [];
  if (S.tab === "skills"){
    NODES.forEach(n => card({
      glyph:n.glyph, tint:"#3a2c4a", name:n.name, level:S.lv[n.key], level2:()=>S.lv[n.key],
      desc:n.desc, label:()=>fmt(cost(n)), enabled:()=>S.souls >= cost(n),
      onBuy(){ const p = cost(n); if (S.souls < p) return; S.souls -= p; S.lv[n.key]++; render(); }
    }));
    card({
      glyph:"✨", tint:"#4a3c2c", name:"Rite of Rekindling", level:S.rekindles, level2:()=>S.rekindles,
      desc:()=> hollows().length
        ? "Clears one hollow and returns them to the pool, depth 0, deaths forgiven."
        : "The way back from hollowing. Nothing to rekindle yet — no one has gone.",
      label:()=>fmt(rekCost()),
      enabled:()=> hollows().length > 0 && S.souls >= rekCost(),
      onBuy(){ rekindle(hollows()[0]); }
    });
    noteEl.textContent = "Skills grow the take. Vendors keep them alive.";
  } else {
    card({
      glyph:"🔨", tint:"#5a3f2c", name:"The Blacksmith", level:null, level2:()=>0,
      desc:()=> S.smith ? "Repairs paid at the fire: +2 souls per rest, +12% survival."
                        : "Adventurers pay for repairs. +2 souls per rest, +12% survival. Holds 2 slots.",
      label:()=> S.smith ? "Built" : fmt(T.SMITH_COST),
      enabled:()=> !S.smith && S.souls >= T.SMITH_COST, done:()=>S.smith,
      onBuy(){ if (S.smith || S.souls < T.SMITH_COST) return; S.souls -= T.SMITH_COST; S.smith = true;
               evictReserved(); keeperGoTo(Math.min(fx + 70, W - 70), fy + 26, "attend"); render(); }
    });
    card({
      glyph:"🌿", tint:"#3f5a3e", name:"The Herbalist", level:null, level2:()=>0,
      desc:()=> S.herb ? "Poultices at the fire: +8% survival, and they endure a 4th death."
                       : "+8% survival, and adventurers hollow on the 4th death instead of the 3rd. Holds 1 slot.",
      label:()=> S.herb ? "Built" : fmt(T.HERB_COST),
      enabled:()=> !S.herb && S.souls >= T.HERB_COST, done:()=>S.herb,
      onBuy(){ if (S.herb || S.souls < T.HERB_COST) return; S.souls -= T.HERB_COST; S.herb = true;
               evictReserved(); keeperGoTo(Math.max(fx - 74, 60), fy + 20, "attend"); render(); }
    });
    noteEl.textContent = "Vendors take room at the fire. That is the whole cost of them.";
  }
  refresh();
}

function evictReserved(){                 // a new vendor turns guests out of its slots
  for (let i = 0; i < T.SLOTS; i++){
    const a = slotUsed[i];
    if (!a || !reserved(i)) continue;
    releaseSlot(a);
    if (a.state === "hollow") continue;   // a hollow re-squats elsewhere on the next tick
    a.state = a.state === "rest" ? "walkout" : "walkin";   // never pays twice for one rest
  }
}

function refresh(){
  soulsEl.textContent = fmt(S.souls);
  rateEl.textContent = avgRate().toFixed(1);
  const atFire = S.pool.filter(a => a.state === "rest" || a.state === "wait").length;
  popEl.fire.textContent = atFire;
  popEl.away.textContent = S.pool.filter(a => a.state === "away").length;
  popEl.hollow.textContent = hollows().length;
  rows.forEach(u => u());
}

const tipEl = document.getElementById("tip");
function showTip(){ if (S.tipSeen) return; S.tipSeen = true; tipEl.hidden = false; }
document.getElementById("tipX").addEventListener("click", ()=>{ tipEl.hidden = true; });

document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
    S.tab = t.dataset.tab; render();
  });
});

/* ============================ start ============================ */

resize();
render();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
